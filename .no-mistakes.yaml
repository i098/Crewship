pr:
  template: .github/PULL_REQUEST_TEMPLATE.md
  publish_intent: false
  appendix: collapsed
# The test step runs only the affected tests (pytest-testmon) in cf-sandbox: private HOME, runtime directory, /tmp and pid space, so a test
