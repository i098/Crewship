# Crewship configuration document for container builds.
#
# Validated by `./ship.sh inspect --config containers/crewship.container.yml`
# against schemas/crewship.schema.json, then consumed by `./ship.sh launch` during
# the Dockerfile `worker` stage. It differs from config/default.yml only where a
# container genuinely cannot host a native capability:
#
#   start_services: false  no systemd/D-Bus inside an ordinary container, so unit
#                          start/enable operations must be suppressed. Koncreet,
#                          the host hardening toolkit, is not installed either.
#   enable_linger: false   `loginctl enable-linger` requires a host user manager.
#   profiles.docker        the worker never receives the host Docker socket and
#                          does not run a nested daemon.
#   profiles.tailscale     tailscaled needs host networking and a fresh node
#                          identity; joining a tailnet is an interactive host step.
#   profiles.desktop       XFCE/TigerVNC/noVNC and the single persistent
#                          ~/.vnc-chrome-profile are host-only by design.
#   profiles.firstmate     the Firstmate checkout belongs in the workspace, which
#                          compose and the devcontainer mount as a volume/bind,
#                          so baking a clone into the image would be shadowed.
#   browser_prune.enabled  the pruner needs host PID visibility and live browser
#                          process groups; it is native-only.
#
# profiles.agents and profiles.development stay true: the image installs the real
# agent and development toolchain through scripts/provisions.py.
# See docs/dependencies.md for release selection, download verification, and exceptions.
schema_version: 1
crewship:
  user: coder
  home: /home/coder
  workspace: /home/coder/Dev
  start_services: false
  enable_linger: false
  profiles:
    agents: true
    development: true
    firstmate: false
    docker: false
    tailscale: false
    desktop: false
    chat: false
  herdr:
    theme: catppuccin
    toast_delivery: herdr
    agent_panel_sort: spaces
    headless_cols: 120
    headless_rows: 40
  browser_prune:
    enabled: false
    idle_seconds: 7200
    poll_seconds: 300
    max_gap_seconds: 900
  firstmate:
    url: https://github.com/kunchenguid/firstmate.git
  desktop:
    display: 1
    novnc_port: 6080
    geometry: 1440x900
