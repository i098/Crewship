# Crewship Ansible configuration.
#
# The CLI (`./ship.sh chart|launch`) loads this file through ANSIBLE_CONFIG.
# It passes the inventory and validated configuration document explicitly.
# Direct `ansible-playbook` calls can use the same settings with
# ANSIBLE_CONFIG=blueprint/ansible/ansible.cfg.
#
# Privilege escalation: the playbook escalates per task. Root is needed for apt,
# account creation and lingering; the target account is used for every file
# under <crewship.home>. Unprivileged -> unprivileged become needs POSIX ACLs on
# the tmp path, which is why `acl` is part of the base package set and of the
# cloud-init prerequisites.

[defaults]
inventory = inventory.yml
# The apt module must import python3-apt from the system interpreter, so the
# inventory pins /usr/bin/python3 rather than the uv virtualenv interpreter.
interpreter_python = /usr/bin/python3
host_key_checking = True
retry_files_enabled = False
localhost_warning = False
display_skipped_hosts = True
force_handlers = False
# Only ansible-core plugins are referenced here; no collection is required.
stdout_callback = default
gathering = smart
fact_caching = memory

[privilege_escalation]
become = False
become_method = sudo
become_user = root
become_ask_pass = False

[connection]
# Pipelining avoids a separate module-file transfer on the local connection.
pipelining = True
