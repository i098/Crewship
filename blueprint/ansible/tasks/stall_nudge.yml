---
# Stall nudge for main Firstmate (docs/architecture.md#stall-nudge): a user
# timer runs blueprint/maintenance/fm-main-stall-nudge every 15 s. Each run is a fresh
# process, so a rewritten script needs no restart.

- name: Ensure the stall nudge directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ crewship_local_bin }}"
    - "{{ crewship_user_units }}/timers.target.wants"

- name: Install the stall nudge script
  ansible.builtin.copy:
    src: "{{ crewship_blueprint }}/maintenance/fm-main-stall-nudge"
    dest: "{{ crewship_stall_nudge_script }}"
    mode: "0755"
    remote_src: true

- name: Install the usage card scripts
  ansible.builtin.copy:
    src: "{{ crewship_blueprint }}/maintenance/{{ item }}"
    dest: "{{ crewship_local_bin }}/{{ item }}"
    mode: "0755"
    remote_src: true
  loop: "{{ crewship_usage_scripts }}"

- name: Render the stall nudge unit and timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ crewship_user_units }}/{{ item }}"
    mode: "0644"
  loop: [fm-main-stall-nudge.service, fm-main-stall-nudge.timer]
  notify: reload user systemd

- name: Statically enable the stall nudge timer
  ansible.builtin.file:
    src: "{{ crewship_user_units }}/fm-main-stall-nudge.timer"
    dest: "{{ crewship_user_units }}/timers.target.wants/fm-main-stall-nudge.timer"
    state: link
    force: true
    follow: false

- name: Check for the installed stall nudge timer
  ansible.builtin.stat:
    path: "{{ crewship_user_units }}/fm-main-stall-nudge.timer"
  register: crewship_stall_nudge_timer
  when: ansible_check_mode

- name: Enable and start the stall nudge timer
  ansible.builtin.systemd_service:
    scope: user
    name: fm-main-stall-nudge.timer
    enabled: true
    state: started
  environment: "{{ crewship_user_systemd_env }}"
  when:
    - crewship_manage_services | bool
    - not ansible_check_mode or crewship_stall_nudge_timer.stat.exists
