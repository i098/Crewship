---
# Optional review desktop: XFCE on TigerVNC, reached through noVNC.
#
# Both listeners bind loopback. RFB also requires an operator-created password:
# loopback is shared by local accounts, so SSH tunneling alone is not authentication.
# No password, TLS key, tailnet identity, or browser login is exported.
#
# Exactly one browser profile exists, ~/.vnc-chrome-profile. Nothing here
# copies, seeds, clones or multiplies profiles, and no per-agent desktop
# allocator, display range, registry or wall is reproduced.

- name: Install the desktop packages
  ansible.builtin.apt:
    name: "{{ crewship_desktop_packages }}"
    state: present
  become: true
  become_user: root

- name: Check for an installed Chrome binary
  ansible.builtin.stat:
    path: /usr/bin/google-chrome
    get_checksum: false
  register: crewship_desktop_chrome
  changed_when: false
  check_mode: false

- name: Report a desktop without a browser
  ansible.builtin.debug:
    msg: >-
      /usr/bin/google-chrome is absent, so {{ crewship_local_bin }}/vnc-chrome
      cannot start anything yet. crewship_chrome_install is
      "{{ crewship_chrome_install }}"; set it to auto or true to install Chrome
      from Google's apt repository.
  when: not crewship_desktop_chrome.stat.exists

- name: Ensure the VNC configuration directory
  ansible.builtin.file:
    path: "{{ crewship_vnc_dir }}"
    state: directory
    owner: "{{ crewship_cfg.user }}"
    group: "{{ crewship_group }}"
    mode: "0700"
  become: true

- name: Inspect the operator-created VNC credential without reading its value
  ansible.builtin.stat:
    path: "{{ crewship_vnc_password_file }}"
    follow: false
    get_checksum: false
    get_mime: false
  register: crewship_vnc_password
  check_mode: false

- name: Require a private VNC password before enabling the desktop
  ansible.builtin.assert:
    that:
      - crewship_vnc_password.stat.exists | default(false)
      - crewship_vnc_password.stat.isreg | default(false)
      - not (crewship_vnc_password.stat.islnk | default(false))
      - (crewship_vnc_password.stat.uid | default(-1) | int) == (crewship_user_uid | int)
      - (crewship_vnc_password.stat.mode | default('')) == '0600'
    fail_msg: >-
      Desktop authentication is not configured. As {{ crewship_cfg.user }}, run
      tigervncpasswd {{ crewship_vnc_password_file }}, then chmod 600 that file
      and rerun apply. No desktop listener has been enabled by this task.
    quiet: true
  when: not ansible_check_mode

- name: Render the VNC session startup script
  ansible.builtin.template:
    src: vnc-xstartup.j2
    dest: "{{ crewship_vnc_dir }}/xstartup"
    owner: "{{ crewship_cfg.user }}"
    group: "{{ crewship_group }}"
    mode: "0755"
  become: true
  notify: vnc restart required


# The single persistent profile. Created empty if it does not exist and never
# touched again: no seed profile is copied in and its contents are not managed.
- name: Ensure the one persistent VNC Chrome profile directory exists
  ansible.builtin.file:
    path: "{{ crewship_vnc_chrome_profile }}"
    state: directory
    owner: "{{ crewship_cfg.user }}"
    group: "{{ crewship_group }}"
    mode: "0700"
  become: true

- name: Install the persistent-profile browser launcher
  ansible.builtin.template:
    src: vnc-chrome.j2
    dest: "{{ crewship_local_bin }}/vnc-chrome"
    owner: "{{ crewship_cfg.user }}"
    group: "{{ crewship_group }}"
    mode: "0755"
  become: true

- name: Render the desktop user units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ crewship_user_units }}/{{ item }}"
    owner: "{{ crewship_cfg.user }}"
    group: "{{ crewship_group }}"
    mode: "0644"
  become: true
  loop:
    - crewship-vnc.service
    - crewship-novnc.service
  notify:
    - reload user systemd
    - restart novnc
    - vnc restart required

- name: Ensure the user default.target.wants directory
  ansible.builtin.file:
    path: "{{ crewship_user_units }}/default.target.wants"
    state: directory
    owner: "{{ crewship_cfg.user }}"
    group: "{{ crewship_group }}"
    mode: "0755"
  become: true

- name: Statically enable the desktop user units
  ansible.builtin.file:
    src: "{{ crewship_user_units }}/{{ item }}"
    dest: "{{ crewship_user_units }}/default.target.wants/{{ item }}"
    state: link
    owner: "{{ crewship_cfg.user }}"
    group: "{{ crewship_group }}"
    force: true
    follow: false
  become: true
  loop:
    - crewship-vnc.service
    - crewship-novnc.service

- name: Enable and start the desktop user units
  ansible.builtin.systemd_service:
    scope: user
    name: "{{ item }}"
    enabled: true
    state: started
  become: "{{ crewship_become_target | bool }}"
  become_user: "{{ crewship_cfg.user }}"
  environment: "{{ crewship_user_systemd_env }}"
  loop:
    - crewship-vnc.service
    - crewship-novnc.service
  when: crewship_manage_services | bool

- name: Report how to reach the desktop
  ansible.builtin.debug:
    msg:
      - "VNC display :{{ crewship_cfg.desktop.display }} requires VncAuth and listens only on loopback port {{ crewship_vnc_rfb_port }}."
      - "noVNC listens on 127.0.0.1:{{ crewship_cfg.desktop.novnc_port }}."
      - "From a workstation: ssh -N -L {{ crewship_cfg.desktop.novnc_port }}:127.0.0.1:{{ crewship_cfg.desktop.novnc_port }} {{ crewship_cfg.user }}@<host>"
      - "Then open http://127.0.0.1:{{ crewship_cfg.desktop.novnc_port }}/vnc.html"
      - "Browser sign-in happens once, by hand, in the persistent profile {{ crewship_vnc_chrome_profile }} (launcher: vnc-chrome)."
