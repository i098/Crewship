---
# Chrome AXI bridge pruning: portable pruner plus a user timer.
#
# The pruner only signals idle, installed AXI bridge processes with loopback
# listeners. It never touches headed, attached or persistent-profile browsers,
# which is why the persistent VNC profile is safe next to it. Native only: it
# needs host pidfds and process trees.
#
# Runtime: the pruner calls psutil.Process.net_connections(), which needs
# psutil >= 6, while Ubuntu 24.04 ships python3-psutil 5.9. It therefore runs
# on an account-owned virtualenv created by the managed uv and filled with the
# latest psutil, --require-hashes against the digests PyPI publishes for that
# release (crewship_latest.psutil, resolved in tasks/preflight.yml). The distribution
# interpreter is never pip-installed into, and the unit only references paths
# under the account's home, so the timer survives deletion of this checkout.

- name: Report the pruner runtime that check mode cannot build
  ansible.builtin.debug:
    msg: >-
      check mode: would provide psutil {{ crewship_pruner_psutil_version }} in
      {{ crewship_pruner_venv }} via {{ crewship_uv_bin }}, verified against the
      digests PyPI publishes.
  when: ansible_check_mode

- name: Build the private pruner runtime
  when: not ansible_check_mode
  block:
    - name: Stat the managed uv the runtime is built with
      ansible.builtin.stat:
        path: "{{ crewship_uv_bin }}"
        get_checksum: false
      become: "{{ crewship_become_target | bool }}"
      become_user: "{{ crewship_cfg.user }}"
      register: crewship_prune_uv
      changed_when: false

    - name: Assert uv is available for the pruner runtime
      ansible.builtin.assert:
        that:
          - crewship_prune_uv.stat.exists | default(false)
        fail_msg: >-
          {{ crewship_uv_bin }} is missing, so the hash-verified pruner runtime
          cannot be built. uv is a core tool of the installer
          (crewship_core_tools); fix tasks/tools.yml output before re-running.
          Provisioning refuses to fall back to the distribution psutil, which
          is too old for the pruner.
        quiet: true

    - name: Read the runtime stamp of a previous apply
      ansible.builtin.slurp:
        src: "{{ crewship_pruner_stamp }}"
      become: "{{ crewship_become_target | bool }}"
      become_user: "{{ crewship_cfg.user }}"
      register: crewship_prune_stamp_raw
      # A first apply has no stamp; that is not a failure, it just means the
      # runtime has to be built.
      failed_when: false
      changed_when: false

    - name: Read the psutil release already installed in the runtime
      ansible.builtin.command:
        argv: ["{{ crewship_pruner_python }}", -c, "import psutil; print(psutil.__version__)"]
      become: "{{ crewship_become_target | bool }}"
      become_user: "{{ crewship_cfg.user }}"
      environment: "{{ crewship_user_env }}"
      register: crewship_prune_installed
      failed_when: false
      changed_when: false

    - name: Decide whether the runtime already matches the resolved psutil
      ansible.builtin.set_fact:
        crewship_prune_runtime_current: >-
          {{ (crewship_prune_installed.rc | default(1)) == 0
             and (crewship_prune_installed.stdout | default('') | trim) == crewship_pruner_psutil_version
             and ((crewship_prune_stamp_raw.content | default('') | b64decode)
                  is search(crewship_pruner_requirements_digest)) }}

    - name: Create the private pruner virtualenv
      ansible.builtin.command:
        argv: ["{{ crewship_uv_bin }}", venv, --python, "{{ crewship_pruner_base_python }}", "{{ crewship_pruner_venv }}"]
        chdir: "{{ crewship_cfg.home }}"
        creates: "{{ crewship_pruner_python }}"
      become: "{{ crewship_become_target | bool }}"
      become_user: "{{ crewship_cfg.user }}"
      environment: "{{ crewship_user_env | combine(crewship_pruner_uv_env) }}"
      notify: restart chrome autoprune timer

    - name: Write the resolved pruner requirements
      ansible.builtin.copy:
        dest: "{{ crewship_pruner_requirements }}"
        content: "{{ crewship_pruner_requirements_text }}\n"
        owner: "{{ crewship_cfg.user }}"
        group: "{{ crewship_group }}"
        mode: "0644"
      become: true
      when: not (crewship_prune_runtime_current | bool)

    - name: Install the hash-verified pruner requirements
      ansible.builtin.command:
        argv:
          - "{{ crewship_uv_bin }}"
          - pip
          - install
          - --require-hashes
          - --python
          - "{{ crewship_pruner_python }}"
          - -r
          - "{{ crewship_pruner_requirements }}"
        chdir: "{{ crewship_cfg.home }}"
      become: "{{ crewship_become_target | bool }}"
      become_user: "{{ crewship_cfg.user }}"
      environment: "{{ crewship_user_env | combine(crewship_pruner_uv_env) }}"
      changed_when: true
      when: not (crewship_prune_runtime_current | bool)
      notify: restart chrome autoprune timer

    - name: Confirm the runtime provides the resolved psutil
      ansible.builtin.command:
        argv: ["{{ crewship_pruner_python }}", -c, "import psutil; print(psutil.__version__)"]
      become: "{{ crewship_become_target | bool }}"
      become_user: "{{ crewship_cfg.user }}"
      environment: "{{ crewship_user_env }}"
      register: crewship_prune_verified
      changed_when: false

    - name: Assert the runtime psutil is the resolved release
      ansible.builtin.assert:
        that:
          - (crewship_prune_verified.stdout | trim) == crewship_pruner_psutil_version
        fail_msg: >-
          {{ crewship_pruner_python }} reports psutil
          "{{ crewship_prune_verified.stdout | trim }}" but this run resolved
          {{ crewship_pruner_psutil_version }}. The pruner needs
          Process.net_connections() (psutil >= 6); it is not run against an
          unexpected build.
        quiet: true

    - name: Record the runtime stamp
      ansible.builtin.copy:
        dest: "{{ crewship_pruner_stamp }}"
        owner: "{{ crewship_cfg.user }}"
        group: "{{ crewship_group }}"
        mode: "0644"
        content: |
          {
            "psutil": "{{ crewship_pruner_psutil_version }}",
            "requirements_sha256": "{{ crewship_pruner_requirements_digest }}"
          }
      become: true

# The unit calls this script with the private runtime interpreter, so the
# script's own `#!/usr/bin/python3` shebang is never the one that runs it.
- name: Install the portable Chrome pruner
  ansible.builtin.copy:
    src: "{{ crewship_pruner_source }}"
    dest: "{{ crewship_pruner_script }}"
    owner: "{{ crewship_cfg.user }}"
    group: "{{ crewship_group }}"
    mode: "0755"
    remote_src: true
  become: true
  notify: restart chrome autoprune timer

- name: Render the Chrome pruner unit and timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ crewship_user_units }}/{{ item }}"
    owner: "{{ crewship_cfg.user }}"
    group: "{{ crewship_group }}"
    mode: "0644"
  become: true
  loop:
    - chrome-autoprune.service
    - chrome-autoprune.timer
  notify:
    - reload user systemd
    - restart chrome autoprune timer

- name: Ensure the user timers.target.wants directory
  ansible.builtin.file:
    path: "{{ crewship_user_units }}/timers.target.wants"
    state: directory
    owner: "{{ crewship_cfg.user }}"
    group: "{{ crewship_group }}"
    mode: "0755"
  become: true

- name: Statically enable the Chrome pruner timer
  ansible.builtin.file:
    src: "{{ crewship_user_units }}/chrome-autoprune.timer"
    dest: "{{ crewship_user_units }}/timers.target.wants/chrome-autoprune.timer"
    state: link
    owner: "{{ crewship_cfg.user }}"
    group: "{{ crewship_group }}"
    force: true
    follow: false
  become: true

- name: Enable and start the Chrome pruner timer
  ansible.builtin.systemd_service:
    scope: user
    name: chrome-autoprune.timer
    enabled: true
    state: started
  become: "{{ crewship_become_target | bool }}"
  become_user: "{{ crewship_cfg.user }}"
  environment: "{{ crewship_user_systemd_env }}"
  when: crewship_manage_services | bool
