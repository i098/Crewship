---
# GitHub webhook receiver (docs/github-webhook.md): builds apps/fm-gh-webhook/ with
# cargo and runs it as a user service on 127.0.0.1:8788. It stays down (exit 78,
# not restarted) until GH_WEBHOOK_SECRET is in ~/super.env. The playbook never
# registers a webhook, opens the funnel or writes the secret.
# The build runs only when the source checksum differs from the last good build.

- name: Ensure the webhook receiver directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ crewship_share_dir }}/fm-gh-webhook/source"
    - "{{ crewship_local_bin }}"
    - "{{ crewship_user_units }}/default.target.wants"

- name: Copy the webhook receiver source
  ansible.builtin.copy:
    src: "{{ crewship_repo }}/apps/fm-gh-webhook/{{ item }}"
    dest: "{{ crewship_share_dir }}/fm-gh-webhook/source/"
    mode: preserve
    remote_src: true
  loop: [Cargo.toml, Cargo.lock, src]

- name: Checksum the webhook receiver source
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail &&
      find Cargo.toml Cargo.lock src -type f -print0 | sort -z
      | xargs -0 sha256sum | sha256sum | cut -d' ' -f1
    chdir: "{{ crewship_repo }}/apps/fm-gh-webhook"
    executable: /bin/bash
  register: crewship_gh_webhook_source
  changed_when: false
  check_mode: false

- name: Read the checksum of the last webhook receiver build
  ansible.builtin.slurp:
    src: "{{ crewship_share_dir }}/fm-gh-webhook/built.sha256"
  register: crewship_gh_webhook_built
  failed_when: false
  check_mode: false

- name: Record whether the webhook receiver needs a build
  ansible.builtin.set_fact:
    crewship_gh_webhook_stale: >-
      {{ crewship_gh_webhook_built.content is not defined
         or (crewship_gh_webhook_built.content | b64decode | trim) != crewship_gh_webhook_source.stdout }}

- name: Build the webhook receiver
  ansible.builtin.command:
    argv:
      - "{{ crewship_cfg.home }}/.cargo/bin/cargo"
      - build
      - --release
      - --locked
      - --target-dir
      - "{{ crewship_share_dir }}/fm-gh-webhook/target"
    chdir: "{{ crewship_share_dir }}/fm-gh-webhook/source"
  environment:
    PATH: "{{ crewship_cfg.home }}/.cargo/bin:/usr/local/bin:/usr/bin:/bin"
  changed_when: true
  when:
    - not ansible_check_mode
    - crewship_gh_webhook_stale | bool

- name: Record the checksum of the webhook receiver build
  ansible.builtin.copy:
    content: "{{ crewship_gh_webhook_source.stdout }}\n"
    dest: "{{ crewship_share_dir }}/fm-gh-webhook/built.sha256"
    mode: "0644"
  when: not ansible_check_mode

- name: Install the webhook receiver command
  ansible.builtin.copy:
    src: "{{ crewship_share_dir }}/fm-gh-webhook/target/release/fm-gh-webhook"
    dest: "{{ crewship_local_bin }}/fm-gh-webhook"
    mode: "0755"
    remote_src: true
  when: not (ansible_check_mode and crewship_gh_webhook_stale | bool)
  register: crewship_gh_webhook_binary

- name: Install the webhook receiver unit
  ansible.builtin.copy:
    dest: "{{ crewship_user_units }}/fm-gh-webhook.service"
    mode: "0644"
    content: |
      {{ ansible_managed | comment }}
      # GitHub webhook receiver (docs/github-webhook.md) on 127.0.0.1:8788 only.
      # GH_WEBHOOK_SECRET comes from ~/super.env; exit 78 means it is not set yet.

      [Unit]
      Description=GitHub webhook receiver for the Firstmate watcher (Crewship managed)

      [Service]
      Type=simple
      EnvironmentFile=-%h/super.env
      ExecStart={{ crewship_local_bin }}/fm-gh-webhook
      Restart=on-failure
      RestartPreventExitStatus=78
      RestartSec=2
      MemoryMax=64M
      Nice=10
      UMask=0077

      [Install]
      WantedBy=default.target
  register: crewship_gh_webhook_unit

- name: Statically enable the webhook receiver
  ansible.builtin.file:
    src: "{{ crewship_user_units }}/fm-gh-webhook.service"
    dest: "{{ crewship_user_units }}/default.target.wants/fm-gh-webhook.service"
    state: link
    force: true
    follow: false

- name: Start the webhook receiver
  ansible.builtin.systemd_service:
    scope: user
    name: fm-gh-webhook.service
    enabled: true
    state: "{{ 'restarted' if (crewship_gh_webhook_binary.changed | default(false) or crewship_gh_webhook_unit.changed) else 'started' }}"
    daemon_reload: true
  environment: "{{ crewship_user_systemd_env }}"
  failed_when: false
  when:
    - crewship_manage_services | bool
    - not ansible_check_mode
