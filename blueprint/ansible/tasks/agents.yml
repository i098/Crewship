---
# Agent harness preferences.
#
# These are sanitized preference files, not credential stores. Harness settings
# are first-write-only. Model overrides merge on every apply without replacing
# user providers or unshipped model keys. Harness binaries come from --npm,
# together with the gh / no-mistakes / treehouse / gws support binaries.

- name: Ensure the harness preference directories
  ansible.builtin.file:
    path: "{{ item.dest | dirname }}"
    state: directory
    owner: "{{ crewship_cfg.user }}"
    group: "{{ crewship_group }}"
    mode: "{{ item.dir_mode }}"
  become: true
  loop: "{{ crewship_agent_config_files }}"
  loop_control:
    label: "{{ item.dest | dirname }}"

- name: Check for existing harness preference files
  ansible.builtin.stat:
    path: "{{ item.dest }}"
    get_checksum: false
  become: true
  loop: "{{ crewship_agent_config_files }}"
  loop_control:
    label: "{{ item.dest }}"
  register: crewship_agent_config_stat
  changed_when: false
  check_mode: false

- name: Write harness preferences that are absent
  ansible.builtin.copy:
    src: "{{ crewship_repo }}/{{ item.item.src }}"
    dest: "{{ item.item.dest }}"
    owner: "{{ crewship_cfg.user }}"
    group: "{{ crewship_group }}"
    mode: "{{ item.item.mode }}"
    remote_src: true
  become: true
  loop: "{{ crewship_agent_config_stat.results }}"
  loop_control:
    label: "{{ item.item.dest }}"
  when:
    - item.item.first_write | bool
    - not (item.stat.exists | default(false))

- name: Report harness preferences left untouched
  ansible.builtin.debug:
    msg: >-
      {{ crewship_agent_config_stat.results
         | selectattr('stat.exists', 'defined')
         | selectattr('stat.exists')
         | selectattr('item.first_write')
         | map(attribute='item.dest') | list | join(', ') | default('none', true) }}
      already exist and were not rewritten (first-write-only inputs).

- name: Merge the omp model overrides
  ansible.builtin.import_tasks: omp_models.yml

# The PR-review gate wrapper; it runs the ponytail plugin's own prompt on omp.
- name: Install ponytail-review
  ansible.builtin.copy:
    src: "{{ crewship_repo }}/maintenance/ponytail-review"
    dest: "{{ crewship_local_bin }}/ponytail-review"
    owner: "{{ crewship_cfg.user }}"
    group: "{{ crewship_group }}"
    mode: "0755"
    remote_src: true
  become: true

# skills/public and skills/private for omp and Claude Code, and rules/public and
# rules/private for omp (docs/omp.md#skills, docs/omp.md#rules). With
# skills.private_source set, the installer first fills skills/private and
# rules/private from it, signed in as the account's own git and GitHub login.
# It replaces or removes only the items its manifest records, and prints one
# JSON object whose `changed` is the only changed signal.
- name: Install the Crewship skills for omp and Claude Code, and its omp rules
  ansible.builtin.command:
    argv: >-
      {{ ['python3', crewship_repo ~ '/scripts/skills.py', '--home', crewship_cfg.home]
         + (['--private-source', crewship_cfg.skills.private_source,
             '--private-ref', crewship_cfg.skills.private_ref | default('HEAD')]
            if crewship_cfg.skills is defined else [])
         + (['--skip-rule', 'drive-the-browser-yourself.md',
             '--skip-rule', 'fleet-browser-default-tier.md']
            if not (crewship_fleet_browsers_enabled | bool) else []) }}
  become: "{{ crewship_become_target | bool }}"
  become_user: "{{ crewship_cfg.user }}"
  register: crewship_skills_run
  changed_when: (crewship_skills_run.stdout_lines | last | from_json).changed | bool
  when: not ansible_check_mode

# config/AGENTS.md as ~/.claude/CLAUDE.md, ~/.omp/agent/AGENTS.md and
# ~/.codex/AGENTS.md (docs/omp.md#global-instructions). A file the user changed
# since the last apply is moved to a timestamped .bak beside it first.
- name: Install the global agent instructions
  ansible.builtin.command:
    argv: [python3, "{{ crewship_repo }}/scripts/instructions.py", --home, "{{ crewship_cfg.home }}"]
  become: "{{ crewship_become_target | bool }}"
  become_user: "{{ crewship_cfg.user }}"
  register: crewship_instructions_run
  changed_when: (crewship_instructions_run.stdout_lines | last | from_json).changed | bool
  when: not ansible_check_mode

- name: Report the global agent instructions backed up
  ansible.builtin.debug:
    msg: "Changed by hand, moved aside: {{ (crewship_instructions_run.stdout_lines | last | from_json).backups | join(', ') }}"
  when:
    - not ansible_check_mode
    - (crewship_instructions_run.stdout_lines | last | from_json).backups | length > 0

# The omp extension that feeds the Herdr agent sidebar layout ($who, the pull
# request parts and the bare topic title; docs/herdr.md). Managed: every apply
# rewrites it.
- name: Ensure the omp extensions directory
  ansible.builtin.file:
    path: "{{ crewship_omp_sidebar_extension | dirname }}"
    state: directory
    owner: "{{ crewship_cfg.user }}"
    group: "{{ crewship_group }}"
    mode: "0755"
  become: true

- name: Install the Herdr sidebar omp extension
  ansible.builtin.copy:
    src: "{{ crewship_repo }}/config/herdr-sidebar.ts"
    dest: "{{ crewship_omp_sidebar_extension }}"
    owner: "{{ crewship_cfg.user }}"
    group: "{{ crewship_group }}"
    mode: "0644"
    remote_src: true
  become: true

# The omp extension that folds the mode and hook indicators into one row of
# icons on the status line (docs/omp.md). Managed: every apply rewrites it.
- name: Install the status icons omp extension
  ansible.builtin.copy:
    src: "{{ crewship_repo }}/config/omp-status-icons.ts"
    dest: "{{ crewship_omp_status_icons_extension }}"
    owner: "{{ crewship_cfg.user }}"
    group: "{{ crewship_group }}"
    mode: "0644"
    remote_src: true
  become: true

# The omp extension that refuses pkill, killall and kill-by-pgrep: every agent
# shares one uid and a worker's brief sits in its argv, so a pattern can match
# other workers (docs/omp.md). Managed: every apply rewrites it.
- name: Install the pattern-kill guard omp extension
  ansible.builtin.copy:
    src: "{{ crewship_repo }}/config/omp-no-pattern-kill.ts"
    dest: "{{ crewship_omp_no_pattern_kill_extension }}"
    owner: "{{ crewship_cfg.user }}"
    group: "{{ crewship_group }}"
    mode: "0644"
    remote_src: true
  become: true

# The omp extension that runs the sentrux and fallow quality gate at the end of
# every agent turn (docs/omp.md#quality-gate). Managed: every apply rewrites it.
- name: Install the quality gate omp extension
  ansible.builtin.copy:
    src: "{{ crewship_repo }}/config/omp-quality-gate.ts"
    dest: "{{ crewship_omp_quality_gate_extension }}"
    owner: "{{ crewship_cfg.user }}"
    group: "{{ crewship_group }}"
    mode: "0644"
    remote_src: true
  become: true

# --- no-mistakes pipeline agent (docs/omp.md#no-mistakes-pipeline-agent) ----
- name: Install omp-as-pi, the wrapper that runs omp as the no-mistakes pi agent
  ansible.builtin.copy:
    src: "{{ crewship_repo }}/config/omp-as-pi/"
    dest: "{{ crewship_omp_as_pi_dir }}/"
    owner: "{{ crewship_cfg.user }}"
    group: "{{ crewship_group }}"
    mode: "u=rwX,go=rX"
    directory_mode: "0755"
    remote_src: true
  become: true

- name: Install the omp overlay that only daemon-spawned omp loads
  ansible.builtin.copy:
    src: "{{ crewship_repo }}/config/no-mistakes-omp.yml"
    dest: "{{ crewship_no_mistakes_omp_overlay }}"
    owner: "{{ crewship_cfg.user }}"
    group: "{{ crewship_group }}"
    mode: "0600"
    remote_src: true
  become: true
  notify: no-mistakes daemon restart required

# no-mistakes names its unit no-mistakes-daemon-<hash>.service and rewrites it
# on `no-mistakes daemon start`; systemd applies a drop-in under the
# "no-mistakes-daemon-" prefix to every such unit, and no-mistakes leaves it be.
- name: Ensure the no-mistakes daemon drop-in directory
  ansible.builtin.file:
    path: "{{ crewship_user_units }}/no-mistakes-daemon-.service.d"
    state: directory
    owner: "{{ crewship_cfg.user }}"
    group: "{{ crewship_group }}"
    mode: "0755"
  become: true

- name: Point daemon-spawned omp at the overlay and pipelines at the data-disk caches
  ansible.builtin.copy:
    content: |
      # Managed by Crewship (docs/omp.md#no-mistakes-pipeline-agent).
      [Service]
      Environment="PI_CONFIG_FILES={{ crewship_no_mistakes_omp_overlay }}"
      {% for key, value in crewship_data_cache_env | dictsort %}
      Environment="{{ key }}={{ value }}"
      {% endfor %}
    dest: "{{ crewship_user_units }}/no-mistakes-daemon-.service.d/crewship.conf"
    owner: "{{ crewship_cfg.user }}"
    group: "{{ crewship_group }}"
    mode: "0644"
  become: true
  notify:
    - reload user systemd
    - no-mistakes daemon restart required

# no-mistakes installs at its latest release, but omp-as-pi translates only the
# argv the pinned pi adapter builds. The adapter sources of the release this run
# installs must match the pins in check-adapter.sh: exit 0 selects pi, exit 1
# (a pin differs or its file is gone) selects acp:omp alone, and any other outcome
# (exit 2, a fetch that could not prove anything) leaves the agent setting as it is.
- name: Check the pi adapter of the no-mistakes release this run installs
  ansible.builtin.command:
    argv:
      - bash
      - "{{ crewship_repo }}/config/omp-as-pi/check-adapter.sh"
      - "v{{ crewship_latest['no-mistakes'].version }}"
  become: true
  register: crewship_pi_adapter
  changed_when: false
  failed_when: false
  check_mode: false

- name: Read the no-mistakes config for the pipeline agent
  ansible.builtin.slurp:
    path: "{{ crewship_cfg.home }}/.no-mistakes/config.yaml"
  become: true
  register: crewship_no_mistakes_config_raw
  failed_when: false
  check_mode: false

# Only Crewship's current and previous agent choices are managed.
# Other agent choices belong to the user and stay.
- name: Set the no-mistakes pipeline agent from the pi adapter check
  vars:
    current: "{{ crewship_no_mistakes_config_raw.content | b64decode | from_yaml }}"
    wanted: >-
      {{ current | combine({
           'agent': 'pi',
           'agent_path_override': {'pi': crewship_omp_as_pi_dir ~ '/omp-as-pi'},
           'agent_config': {'pi': {'model': 'anthropic/claude-sonnet-5-5', 'effort': 'high'}}}, recursive=true)
         if crewship_pi_adapter.rc == 0
         else (current | combine({'agent': ['acp:omp']}) if crewship_pi_adapter.rc == 1 else current) }}
  ansible.builtin.copy:
    content: "{{ wanted | to_nice_yaml(indent=2, sort_keys=false) }}"
    dest: "{{ crewship_cfg.home }}/.no-mistakes/config.yaml"
  become: true
  when:
    - crewship_no_mistakes_config_raw.content is defined
    - current.agent | default([]) in ['pi', ['acp:omp'], ['pi', 'acp:omp']]
    - wanted != current
  notify: no-mistakes daemon restart required

- name: Report why the no-mistakes pipeline agent stays acp:omp
  ansible.builtin.debug:
    msg: >-
      Not switching the no-mistakes pipeline agent to pi: {{
      crewship_pi_adapter.stdout | default('', true) or crewship_pi_adapter.stderr | default('') }}.
      It stays acp:omp until omp-as-pi is re-proven against this release.
  when: crewship_pi_adapter.rc == 1

- name: Warn that the no-mistakes pi adapter could not be verified
  ansible.builtin.debug:
    msg: >-
      WARNING: could not verify the pi adapter of this no-mistakes release: {{
      crewship_pi_adapter.stdout | default('', true) or crewship_pi_adapter.stderr | default('') }}.
      The pipeline agent setting is left as it is; the next apply checks again.
  when: crewship_pi_adapter.rc not in [0, 1]

# The omp config is first-write-only, but the status icons row needs two of its
# keys on every host: `status` in statusLine.leftSegments and no separate hooks
# line (docs/omp.md). omp reads leftSegments only under the custom preset, so
# other presets are left alone. Only those two keys are ensured.
- name: Read the omp config for the status row keys
  ansible.builtin.slurp:
    path: "{{ crewship_omp_config }}"
  become: true
  register: crewship_omp_config_raw
  failed_when: false
  check_mode: false

- name: Ensure the status row keys in the omp config
  vars:
    current: "{{ crewship_omp_config_raw.content | b64decode | from_yaml }}"
    segments: "{{ current.statusLine.leftSegments | default([]) }}"
    wanted: >-
      {{ current | combine({'statusLine': current.statusLine | default({}) | combine({
           'leftSegments': segments + ([] if 'status' in segments else ['status']),
           'showHookStatus': false})}) }}
  ansible.builtin.copy:
    content: "{{ wanted | to_nice_yaml(indent=2, sort_keys=false) }}"
    dest: "{{ crewship_omp_config }}"
  become: true
  when:
    - crewship_omp_config_raw.content is defined
    - (current.statusLine | default({})).preset | default('default') == 'custom'
    - wanted != current

# The acpx config is first-write-only, but codex is no longer installed, so a
# host written before that still names a missing agent as its default. Only
# that one value is rewritten, and only while it is still codex.
- name: Read the acpx config for the default agent
  ansible.builtin.slurp:
    path: "{{ crewship_acpx_config }}"
  become: true
  register: crewship_acpx_config_raw
  failed_when: false
  check_mode: false

- name: Point the acpx default agent at omp when it is still codex
  vars:
    current: "{{ crewship_acpx_config_raw.content | b64decode | from_json }}"
  ansible.builtin.copy:
    content: "{{ current | combine({'defaultAgent': 'omp'}) | to_nice_json(indent=2, sort_keys=false) }}\n"
    dest: "{{ crewship_acpx_config }}"
  become: true
  when:
    - crewship_acpx_config_raw.content is defined
    - current.defaultAgent | default('') == 'codex'
