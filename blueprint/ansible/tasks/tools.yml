---
# Toolchain, installed by the repository installer as the target user: the
# latest releases tasks/preflight.yml resolved.
#
# Contract: python3 <repo>/scripts/provisions.py
#           --home <crewship.home> --tools herdr,node,bun,uv,btop,sentrux,fallow,pyrefly,nvim[,concord,slk]
#           [--npm] [--development]
#           --resolved <crewship_latest as JSON>
# The installer is idempotent and prints a final JSON object
# {"changed": bool, "installed": [...]}, which is the only changed signal this
# task trusts - the exit status alone would report a change on every apply.

- name: Compose the installer command line
  ansible.builtin.set_fact:
    crewship_installer_argv: >-
      {{ ['python3', crewship_installer,
          '--home', crewship_cfg.home,
          '--resolved', crewship_latest | to_json]
         + crewship_installer_selection }}

- name: Show the installer invocation
  ansible.builtin.debug:
    msg: "{{ crewship_installer_argv | join(' ') }}"

# The installer is not check-mode aware, so a plan reports the invocation
# instead of running it.
- name: Report the installer invocation in check mode
  ansible.builtin.debug:
    msg: >-
      check mode: would run the toolchain installer as {{ crewship_cfg.user }};
      Herdr {{ crewship_herdr_version }} would land at {{ crewship_herdr_bin }}{{
      (' and omp ' ~ crewship_omp_version ~ ' at ' ~ crewship_omp_root)
      if (crewship_cfg.profiles.agents | bool) else '' }}.
  when: ansible_check_mode

- name: Install the toolchain as the target user
  ansible.builtin.command:
    argv: "{{ crewship_installer_argv }}"
    chdir: "{{ crewship_repo }}"
  become: "{{ crewship_become_target | bool }}"
  become_user: "{{ crewship_cfg.user }}"
  environment: "{{ crewship_user_env }}"
  register: crewship_installer_run
  failed_when: >-
    crewship_installer_run.rc != 0
    or (crewship_installer_run.stdout_lines | default([])
        | select('match', '^\s*\{.*\}\s*$') | list | length) == 0
  changed_when: >-
    ((crewship_installer_run.stdout_lines | default([])
      | select('match', '^\s*\{.*\}\s*$') | list | last | default('{"changed": false}'))
     | from_json).changed | bool
  when: not ansible_check_mode

- name: Record the installer report
  ansible.builtin.set_fact:
    crewship_installer_report: >-
      {{ (crewship_installer_run.stdout_lines
          | select('match', '^\s*\{.*\}\s*$') | list | last) | from_json }}
  when: not ansible_check_mode

- name: Show the tools the installer reports
  ansible.builtin.debug:
    var: crewship_installer_report.installed
    verbosity: 1
  when: not ansible_check_mode

- name: Stat the resolved Herdr executable
  ansible.builtin.stat:
    path: "{{ crewship_herdr_bin }}"
    get_checksum: false
  become: "{{ crewship_become_target | bool }}"
  become_user: "{{ crewship_cfg.user }}"
  register: crewship_herdr_stat
  changed_when: false
  when: not ansible_check_mode

- name: Assert the installer produced the resolved Herdr executable
  ansible.builtin.assert:
    that:
      - crewship_herdr_stat.stat.exists | default(false)
      - crewship_herdr_stat.stat.executable | default(false)
    fail_msg: >-
      {{ crewship_herdr_bin }} is missing or not executable after the installer
      ran. The user unit ExecStart is computed from the resolved release
      (herdr {{ crewship_herdr_version }}) and the platform directory
      {{ crewship_platform }}; installer and resolution disagree.
    quiet: true
  when: not ansible_check_mode

- name: Stat the managed .local/bin/herdr symlink
  ansible.builtin.stat:
    path: "{{ crewship_local_bin }}/herdr"
    follow: false
    get_checksum: false
  become: "{{ crewship_become_target | bool }}"
  become_user: "{{ crewship_cfg.user }}"
  register: crewship_herdr_link
  changed_when: false
  when: not ansible_check_mode

- name: Assert the managed symlink resolves to the resolved executable
  ansible.builtin.assert:
    that:
      - crewship_herdr_link.stat.exists | default(false)
      - (crewship_herdr_link.stat.lnk_source | default('')) == crewship_herdr_bin
    fail_msg: >-
      {{ crewship_local_bin }}/herdr resolves to
      "{{ crewship_herdr_link.stat.lnk_source | default('(missing)') }}" instead
      of {{ crewship_herdr_bin }}. Interactive CLI and the user service would run
      different builds; the installer owns this symlink.
    quiet: true
  when: not ansible_check_mode

- name: Install the first-write Neovim configuration
  ansible.builtin.import_tasks: nvim.yml
