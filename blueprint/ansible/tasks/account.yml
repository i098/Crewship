---
# Target account, home layout and (optionally) the user manager.
#
# An existing account keeps its home, shell and primary group.
# Modes of pre-existing standard directories are left alone - `mode` is only
# set where this playbook owns the directory outright.

- name: Reject unsafe home paths before privileged account operations
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -c
      - |
        import os, pathlib, stat, sys
        home = pathlib.Path(sys.argv[1])
        for parent in home.parents:
            info = parent.lstat()
            if not stat.S_ISDIR(info.st_mode) or info.st_uid != 0 or info.st_mode & 0o022:
                sys.exit("Home ancestors must be real root-owned, non-writable directories: " + str(parent))
        try:
            info = home.lstat()
        except FileNotFoundError:
            pass
        else:
            if not stat.S_ISDIR(info.st_mode):
                sys.exit("Home must be a real directory, not a symlink")
        for config in (home / ".config", home / ".config/environment.d"):
            if config.is_symlink() and not config.exists():
                sys.exit("Configuration directory link is unavailable: " + str(config))
      - "{{ crewship_cfg.home }}"
  changed_when: false
  check_mode: false

- name: Look up the target account
  ansible.builtin.getent:
    database: passwd
    key: "{{ crewship_cfg.user }}"
    fail_key: false
  check_mode: false

- name: Record whether the target account already exists
  ansible.builtin.set_fact:
    crewship_user_exists: >-
      {{ ((ansible_facts.getent_passwd | default({})).get(crewship_cfg.user) | default(none)) is not none }}
    crewship_account_entry: >-
      {{ (ansible_facts.getent_passwd | default({})).get(crewship_cfg.user) | default([]) }}

- name: Assert an existing account already uses the configured home
  ansible.builtin.assert:
    that:
      - (crewship_account_entry[4] | default('')) == crewship_cfg.home
    fail_msg: >-
      Account {{ crewship_cfg.user }} exists with home
      {{ crewship_account_entry[4] | default('(unknown)') }} but the
      configuration asks for {{ crewship_cfg.home }}. Moving or rewriting an
      existing account is refused; fix crewship.home or the account first.
    quiet: true
  when: crewship_user_exists | bool

- name: Create the target group
  ansible.builtin.group:
    name: "{{ crewship_cfg.user }}"
    state: present
  become: true
  when:
    - not (crewship_user_exists | bool)
    - crewship_create_user | bool

- name: Create the target account
  ansible.builtin.user:
    name: "{{ crewship_cfg.user }}"
    group: "{{ crewship_cfg.user }}"
    home: "{{ crewship_cfg.home }}"
    shell: "{{ crewship_user_shell }}"
    create_home: true
    state: present
  become: true
  when:
    - not (crewship_user_exists | bool)
    - crewship_create_user | bool

- name: Fail when the account is absent and creation is disabled
  ansible.builtin.assert:
    that:
      - (crewship_user_exists | bool) or (crewship_create_user | bool)
    fail_msg: >-
      Account {{ crewship_cfg.user }} does not exist and crewship_create_user is
      false. Create the account first or allow this playbook to create it.
    quiet: true

- name: Resolve the account uid
  ansible.builtin.command:
    argv: [id, -u, "{{ crewship_cfg.user }}"]
  register: crewship_uid_probe
  changed_when: false
  failed_when: false
  check_mode: false

- name: Resolve the account primary group
  ansible.builtin.command:
    argv: [id, -gn, "{{ crewship_cfg.user }}"]
  register: crewship_gid_probe
  changed_when: false
  failed_when: false
  check_mode: false

- name: Record account facts
  ansible.builtin.set_fact:
    crewship_user_uid: "{{ (crewship_uid_probe.stdout | trim) if crewship_uid_probe.rc == 0 else '' }}"
    crewship_group: "{{ (crewship_gid_probe.stdout | trim) if crewship_gid_probe.rc == 0 else crewship_cfg.user }}"
    # False only in check mode on a host where the account does not exist yet:
    # `./ship.sh chart` then reports the account work and skips the file work it
    # cannot preview, instead of failing on an unresolvable owner.
    crewship_account_ready: "{{ crewship_uid_probe.rc == 0 }}"

- name: Migrate an install from before the Crewship rename
  ansible.builtin.import_tasks: rename.yml
  when: crewship_user_exists | bool

- name: Report the truncated plan when the account does not exist yet
  ansible.builtin.debug:
    msg: >-
      Account {{ crewship_cfg.user }} does not exist yet. In check mode the
      per-account file, unit and toolchain steps cannot be previewed and are
      skipped; `./ship.sh launch` creates the account and runs them.
  when:
    - ansible_check_mode
    - not (crewship_account_ready | bool)

- name: Add the account to sudo
  ansible.builtin.user:
    name: "{{ crewship_cfg.user }}"
    groups: sudo
    append: true
  become: true
  when:
    - crewship_user_sudo | bool
    - crewship_account_ready | bool

- name: Ensure the home directory exists and is owned by the account
  ansible.builtin.file:
    path: "{{ crewship_cfg.home }}"
    state: directory
    owner: "{{ crewship_cfg.user }}"
    group: "{{ crewship_group }}"
  become: true
  when: crewship_account_ready | bool

- name: Inspect the home layout
  ansible.builtin.command:
    argv:
      - python3
      - "{{ crewship_path_checker }}"
      - "{{ crewship_home_layout_paths | to_json }}"
      - --owned-by
      - "{{ crewship_cfg.user }}"
      - "{{ crewship_group }}"
  become: "{{ crewship_become_target | bool }}"
  become_user: "{{ crewship_cfg.user }}"
  register: crewship_home_layout_stat
  changed_when: false
  check_mode: false
  when: crewship_account_ready | bool

- name: Ensure the home layout
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ crewship_cfg.user }}"
    group: "{{ crewship_group }}"
  become: "{{ crewship_become_target | bool }}"
  become_user: "{{ crewship_cfg.user }}"
  environment: "{{ crewship_user_env }}"
  check_mode: "{{ ansible_check_mode and item in (crewship_home_layout_stat.stdout | from_json).existing }}"
  loop: >-
    {{ crewship_home_layout_paths
       | reject('in', (crewship_home_layout_stat.stdout | from_json).owned_directories) | list }}
  when: crewship_account_ready | bool

- name: Require a mounted data filesystem before creating bulk directories
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -c
      - |
        import pathlib, sys
        path = pathlib.Path(sys.argv[1])
        if not path.is_dir() or path.stat().st_dev == pathlib.Path('/').stat().st_dev:
            sys.exit("crewship.data_dir must exist on a mounted non-root filesystem")
      - "{{ crewship_data_dir }}"
  changed_when: false
  check_mode: false
  when: crewship_data_dir | length > 0

- name: Inspect the account's bulk directories on the data disk
  ansible.builtin.stat:
    path: "{{ crewship_data_dir }}/{{ item }}"
  become: true
  loop: [cache, .treehouse, tmp, downloads]
  register: crewship_bulk_dirs
  when:
    - crewship_data_dir | length > 0
    - crewship_account_ready | bool

- name: Ensure the account's bulk directories on the data disk
  ansible.builtin.file:
    path: "{{ crewship_data_dir }}/{{ item.item }}"
    state: directory
    owner: "{{ crewship_cfg.user }}"
    group: "{{ crewship_group }}"
    mode: "{{ omit if item.stat.exists else '0700' }}"
  become: true
  loop: "{{ crewship_bulk_dirs.results }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - crewship_data_dir | length > 0
    - crewship_account_ready | bool

- name: Add missing native bulk defaults without replacing user settings
  ansible.builtin.command:
    argv: >-
      {{ ['python3', crewship_repo ~ '/scripts/bulk-defaults.py',
          '--home', crewship_cfg.home, '--data-dir', crewship_data_dir]
         + (['--check'] if ansible_check_mode else []) }}
  become: "{{ crewship_become_target | bool }}"
  become_user: "{{ crewship_cfg.user }}"
  environment: "{{ crewship_user_env }}"
  register: crewship_bulk_defaults
  changed_when: crewship_bulk_defaults.rc == 0 and (crewship_bulk_defaults.stdout | from_json).changed | bool
  check_mode: false
  no_log: true
  when:
    - crewship_data_dir | length > 0
    - crewship_account_ready | bool

- name: Write bulk defaults for future user-manager processes
  ansible.builtin.copy:
    dest: "{{ crewship_cfg.home }}/.config/environment.d/60-crewship-bulk.conf"
    content: |
      {% for key, value in crewship_data_cache_env | dictsort %}
      {{ key }}=${{ '{' }}{{ key }}:-{{ value }}{{ '}' }}
      {% endfor %}
    mode: "0600"
  become: "{{ crewship_become_target | bool }}"
  become_user: "{{ crewship_cfg.user }}"
  notify: reload user systemd
  when:
    - crewship_data_dir | length > 0
    - crewship_account_ready | bool

- name: Remove retired managed user-manager bulk defaults
  ansible.builtin.file:
    path: "{{ crewship_cfg.home }}/.config/environment.d/60-crewship-bulk.conf"
    state: absent
  become: "{{ crewship_become_target | bool }}"
  become_user: "{{ crewship_cfg.user }}"
  notify: reload user systemd
  when:
    - crewship_data_dir | length == 0
    - crewship_account_ready | bool

- name: Remove the retired managed Bash environment block
  ansible.builtin.blockinfile:
    path: "{{ crewship_cfg.home }}/.bashrc"
    create: true
    marker: "# {mark} crewship managed environment"
    state: absent
  become: "{{ crewship_become_target | bool }}"
  become_user: "{{ crewship_cfg.user }}"
  when:
    - crewship_data_dir | length == 0
    - crewship_manage_profile_path | bool
    - crewship_account_ready | bool

- name: Keep the managed bin directory and environment on the interactive shell
  ansible.builtin.blockinfile:
    path: "{{ crewship_cfg.home }}/{{ item }}"
    create: true
    owner: "{{ crewship_cfg.user }}"
    group: "{{ crewship_group }}"
    marker: "# {mark} crewship managed environment"
    block: |
      for dir in "$HOME/.bun/bin" "$HOME/.local/bin"; do
        case ":$PATH:" in
          *":$dir:"*) ;;
          *) PATH="$dir:$PATH" ;;
        esac
      done
      export PATH
      {% if crewship_cfg.profiles.agents | bool %}
      {% for key, value in crewship_managed_shell_env | dictsort %}
      export {{ key }}="{{ value }}"
      {% endfor %}
      {% endif %}
      {% for key, value in crewship_data_cache_env | dictsort %}
      export {{ key }}="${{ '{' }}{{ key }}:-{{ value }}{{ '}' }}"
      {% endfor %}
      {% for key, value in crewship_board_env | dictsort %}
      export {{ key }}="{{ value }}"
      {% endfor %}
  become: "{{ crewship_become_target | bool }}"
  become_user: "{{ crewship_cfg.user }}"
  environment: "{{ crewship_user_env }}"
  loop: "{{ ['.profile'] + (['.bashrc'] if crewship_data_dir else []) }}"
  when:
    - crewship_manage_profile_path | bool
    - crewship_account_ready | bool

- name: Use system CA trust in shell profiles
  ansible.builtin.blockinfile:
    path: "{{ crewship_cfg.home }}/{{ item }}"
    create: true
    owner: "{{ crewship_cfg.user }}"
    group: "{{ crewship_group }}"
    marker: "# {mark} crewship CA trust"
    block: |
      {% for key, value in crewship_trust_env | dictsort %}
      export {{ key }}="{{ value }}"
      {% endfor %}
      # Node rejects --use-openssl-ca beside an enabled --use-system-ca or
      # --use-bundled-ca; the trailing negations switch those off.
      case " ${NODE_OPTIONS-}" in
        *" --no-use-system-ca --no-use-bundled-ca --use-openssl-ca") ;;
        *) NODE_OPTIONS="${NODE_OPTIONS:+$NODE_OPTIONS }--no-use-system-ca --no-use-bundled-ca --use-openssl-ca" ;;
      esac
      export NODE_OPTIONS
  become: "{{ crewship_become_target | bool }}"
  become_user: "{{ crewship_cfg.user }}"
  loop: [".profile", ".bashrc"]
  when: crewship_account_ready | bool

- name: Use system CA trust for future user-manager processes
  ansible.builtin.copy:
    dest: "{{ crewship_cfg.home }}/.config/environment.d/60-crewship-trust.conf"
    content: |
      {% for key, value in crewship_trust_env | dictsort %}
      {{ key }}={{ value }}
      {% endfor %}
      NODE_OPTIONS=${NODE_OPTIONS:+${NODE_OPTIONS} }--no-use-system-ca --no-use-bundled-ca --use-openssl-ca
    mode: "0600"
  become: "{{ crewship_become_target | bool }}"
  become_user: "{{ crewship_cfg.user }}"
  notify: reload user systemd
  when: crewship_account_ready | bool

# --- user manager -----------------------------------------------------------
# Skipped entirely when start_services is false (image builds, containers).

- name: Enable lingering for the account
  ansible.builtin.command:
    argv: [loginctl, enable-linger, "{{ crewship_cfg.user }}"]
    creates: "/var/lib/systemd/linger/{{ crewship_cfg.user }}"
  become: true
  when:
    - crewship_manage_linger | bool
    - crewship_account_ready | bool

- name: Wait for the user manager D-Bus socket
  ansible.builtin.wait_for:
    path: "{{ crewship_user_runtime_dir }}/bus"
    timeout: 60
  become: true
  when:
    - crewship_manage_linger | bool
    - crewship_account_ready | bool
    - not ansible_check_mode

- name: Check for a usable user manager
  ansible.builtin.stat:
    path: "{{ crewship_user_runtime_dir }}/bus"
  become: true
  register: crewship_user_bus
  check_mode: false
  when:
    - crewship_manage_services | bool
    - crewship_account_ready | bool

- name: Assert the user manager is reachable before managing user units
  ansible.builtin.assert:
    that:
      - crewship_user_bus.stat.exists | default(false)
    fail_msg: >-
      No user D-Bus at {{ crewship_user_runtime_dir }}/bus, so `systemctl --user`
      cannot be driven for {{ crewship_cfg.user }}. Set crewship.enable_linger to
      true (or open a login session for the account), or set
      crewship.start_services to false for image builds - unit files are still
      written in that mode.
    quiet: true
  when:
    - crewship_manage_services | bool
    - crewship_account_ready | bool
    - not ansible_check_mode

- name: Load pending user-manager defaults before starting services
  ansible.builtin.meta: flush_handlers
  when:
    - crewship_manage_services | bool
    - crewship_account_ready | bool

# Every agent runs file watchers (LSP servers, bundlers, test runners), and all
# of them run as this one account, so the stock 128 inotify instances per user
# is the first limit a busy host hits. Kernel settings do not apply inside a
# container, so only hosts that start services get it.
- name: Raise the per-user inotify instance limit
  ansible.builtin.copy:
    dest: /etc/sysctl.d/60-agent-host.conf
    content: |
      # Managed by Crewship (docs/capacity.md).
      fs.inotify.max_user_instances = 8192
    owner: root
    group: root
    mode: "0644"
  become: true
  when: crewship_manage_services | bool
  notify: load agent host sysctl

