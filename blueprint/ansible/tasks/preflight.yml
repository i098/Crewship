---
# Fail fast, before anything is touched: configuration shape, supported
# platform, and the presence of every Main-owned input this run consumes.

- name: Resolve the host configuration once
  ansible.builtin.set_fact:
    crewship_cfg: "{{ crewship_cfg }}"

- name: Assert the configuration document matches the contract
  ansible.builtin.assert:
    that:
      - (schema_version | default(1) | int) == 1
      - crewship_cfg.user is string
      - crewship_cfg.user | length > 0
      - crewship_cfg.home is match('^/')
      - crewship_cfg.workspace is match('^/')
      - crewship_cfg.home not in ['/', '/root', '/home']
      - crewship_cfg.profiles is mapping
      - crewship_cfg.herdr is mapping
      - crewship_cfg.browser_prune is mapping
      - crewship_cfg.firstmate is mapping
      - crewship_cfg.desktop is mapping
    fail_msg: >-
      The `crewship` extra vars are not a valid Crewship configuration
      document (schema_version 1, absolute home/workspace, profile mapping).
      Run `./ship.sh inspect` first.
    quiet: true

- name: Assert the host is a supported Ubuntu release
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == 'Ubuntu'
      - ansible_facts['distribution_version'] in crewship_supported_ubuntu_releases
    fail_msg: >-
      Crewship targets Ubuntu {{ crewship_supported_ubuntu_releases | join(' / ') }};
      this host reports {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}.
      Set crewship_allow_unsupported_os=true to override deliberately.
    quiet: true
  when: not (crewship_allow_unsupported_os | bool)

- name: Assert the CPU architecture has toolchain assets
  ansible.builtin.assert:
    that:
      - crewship_platform | length > 0
      - crewship_deb_arch | length > 0
    fail_msg: >-
      Architecture {{ ansible_facts['architecture'] }} is not supported. The toolchain
      ships linux-x86_64 and linux-aarch64 assets only.
    quiet: true

- name: Build the list of Main-owned inputs this run requires
  ansible.builtin.set_fact:
    crewship_required_inputs: >-
      {{ [crewship_installer, crewship_herdr_spaces_source, crewship_koncreet_patch]
         + (crewship_agent_config_files
            | map(attribute='src')
            | map('regex_replace', '^', crewship_repo ~ '/')
            | list
            if (crewship_cfg.profiles.agents | bool) else [])
         + ([crewship_pruner_source]
            if ((crewship_cfg.profiles.agents | bool)
                and (crewship_cfg.browser_prune.enabled | bool)) else [])
         + (crewship_firstmate_config_names
            | map('regex_replace', '^', crewship_blueprint ~ '/config/')
            | list
            if (crewship_cfg.profiles.firstmate | bool) else []) }}

- name: Stat every required input
  ansible.builtin.command:
    argv:
      - python3
      - "{{ crewship_path_checker }}"
      - "{{ crewship_required_inputs | to_json }}"
  register: crewship_input_paths
  changed_when: false
  check_mode: false

- name: Fail when a contract input is missing
  ansible.builtin.assert:
    that:
      - (crewship_input_paths.stdout | from_json).missing | length == 0
    fail_msg: >-
      Missing Main-owned contract inputs:
      {{ (crewship_input_paths.stdout | from_json).missing | join(', ') }}.
      These are supplied by the repository, not by this playbook; provisioning
      stops rather than degrading silently.
    quiet: true

# GHSA-6q48-6c7w-9gw2 removes emSign roots after intermediate key compromise.
- name: Distrust the compromised emSign roots
  ansible.builtin.lineinfile:
    path: /etc/ca-certificates.conf
    regexp: "^!?{{ item | regex_escape }}$"
    line: "!{{ item }}"
    create: true
    mode: "0644"
  loop:
    - mozilla/emSign_ECC_Root_CA_-_C3.crt
    - mozilla/emSign_ECC_Root_CA_-_G3.crt
    - mozilla/emSign_Root_CA_-_C1.crt
    - mozilla/emSign_Root_CA_-_G1.crt
  become: true
  register: crewship_ca_distrust
  when: not ansible_check_mode

- name: Inspect system CA trust before rebuilding
  ansible.builtin.command:
    argv: [python3, "{{ crewship_installer }}", --home, "{{ crewship_cfg.home }}", --check-ca]
  register: crewship_ca_before
  changed_when: false
  failed_when: false
  check_mode: false

- name: Rebuild system CA trust after distrusting emSign
  ansible.builtin.command:
    argv: [update-ca-certificates, --fresh]
  become: true
  when:
    - not ansible_check_mode
    - crewship_ca_distrust is changed or crewship_ca_before.rc != 0

- name: Reject compromised CA roots before network access
  ansible.builtin.command:
    argv: [python3, "{{ crewship_installer }}", --home, "{{ crewship_cfg.home }}", --check-ca]
  changed_when: false
  check_mode: false

- name: Refresh signed apt metadata before updating CA trust
  ansible.builtin.apt:
    update_cache: true
  become: true
  changed_when: false
  when: not ansible_check_mode

- name: Update system CA trust before release lookups
  ansible.builtin.apt:
    name: ca-certificates
    state: latest
  become: true
  when: not ansible_check_mode

- name: Report the CA trust update in check mode
  ansible.builtin.debug:
    msg: "check mode: would update ca-certificates before release lookups; current trust must already be safe."
  when: ansible_check_mode

- name: Reject compromised CA roots before release lookups
  ansible.builtin.command:
    argv: [python3, "{{ crewship_installer }}", --home, "{{ crewship_cfg.home }}", --check-ca]
  changed_when: false
  check_mode: false
  when: not ansible_check_mode

# Resolved once per run, in plan too, so a release landing mid-run cannot
# split what is installed from what the unit runs and verify asserts. Only the
# releases this host installs are resolved (crewship_installer_selection and
# crewship_installer_also), so a source it never uses cannot fail the run. The
# installer refuses a native release whose publisher lists no SHA-256 for the
# asset.
- name: Resolve the latest tool releases
  ansible.builtin.command:
    argv: >-
      {{ ['python3', crewship_installer, '--home', crewship_cfg.home,
          '--also', crewship_installer_also | join(','), '--resolve']
         + crewship_installer_selection }}
  register: crewship_latest_run
  changed_when: false
  check_mode: false

- name: Record the resolved releases
  ansible.builtin.set_fact:
    crewship_latest: "{{ crewship_latest_run.stdout | from_json }}"

- name: Warn about optional tools skipped by the lookup
  ansible.builtin.debug:
    msg: "{{ crewship_latest_run.stderr_lines }}"
  when: crewship_latest_run.stderr | length > 0

- name: Show the resolved provisioning plan
  ansible.builtin.debug:
    msg:
      - "account            : {{ crewship_cfg.user }} (home {{ crewship_cfg.home }}, workspace {{ crewship_cfg.workspace }})"
      - "platform           : {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }} {{ ansible_facts['architecture'] }} -> {{ crewship_platform }} / {{ crewship_deb_arch }}"
      - "herdr              : {{ crewship_herdr_version }} (latest release) at {{ crewship_herdr_bin }}"
      - "omp                : {{ crewship_omp_version if (crewship_cfg.profiles.agents | bool) else 'not installed' }} (latest release)"
      - "profiles           : {{ crewship_cfg.profiles | dict2items | selectattr('value') | map(attribute='key') | list | join(', ') | default('none', true) }}"
      - "services           : start_services={{ crewship_cfg.start_services }} linger={{ crewship_manage_linger }}"
      - "pruner runtime     : {{ ('psutil ' ~ crewship_pruner_psutil_version ~ ' in ' ~ crewship_pruner_venv) if ((crewship_cfg.profiles.agents | bool) and (crewship_cfg.browser_prune.enabled | bool)) else 'disabled' }}"
      - "check mode         : {{ ansible_check_mode }}"
