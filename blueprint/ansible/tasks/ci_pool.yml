# CI pool (crewship.ci_pool, docs/ci-pool.md): just-in-time GitHub Actions
# runners, one job per fresh container, sized from half of the host's CPU and memory.
#
# maintenance/ci-pool.py owns the slots: `apply` writes the one unit template
# ci-runner@.service, enables one instance per configured slot and stops and
# cleans the slots that left the config. Every slot reads the host's gh login
# at run time; no token is written anywhere.
#
# Check-mode safe: `apply --check` prints the same change list and mutates
# nothing. Idempotent: an unchanged config prints no change.

- name: Create the CI pool data directory
  ansible.builtin.file:
    path: "{{ crewship_cfg.ci_pool.data_dir }}"
    state: directory
    owner: "{{ crewship_cfg.user }}"
    group: "{{ crewship_group }}"
    mode: "0755"
  become: true

- name: Install the CI pool script
  ansible.builtin.copy:
    src: "{{ crewship_repo }}/maintenance/ci-pool.py"
    dest: "{{ crewship_local_bin }}/ci-pool.py"
    owner: "{{ crewship_cfg.user }}"
    group: "{{ crewship_group }}"
    mode: "0755"
    remote_src: true
  become: true

# Runs the checkout's copy so check mode works before the first install.
- name: Converge the CI pool slots
  ansible.builtin.command:
    argv: >-
      {{ ['/usr/bin/python3', crewship_repo ~ '/maintenance/ci-pool.py', 'apply']
         + (['--check'] if ansible_check_mode else []) }}
    stdin: "{{ crewship_cfg.ci_pool | to_json }}"
  become: "{{ crewship_become_target | bool }}"
  become_user: "{{ crewship_cfg.user }}"
  environment: "{{ crewship_user_systemd_env | combine({'HOME': crewship_cfg.home}) }}"
  register: crewship_ci_pool_apply
  changed_when: crewship_ci_pool_apply.stdout | length > 0
  check_mode: false
  when: crewship_manage_services | bool
