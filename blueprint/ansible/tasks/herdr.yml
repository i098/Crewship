---
# Herdr static configuration and the per-user service.
#
# The unit runs the resolved release by absolute versioned path, so neither
# $PATH nor a stale /usr/local/bin copy can shadow it (the source host ran a
# 0.8.2 service against a 0.9.0 CLI; that drift is designed out here).

- name: Ensure the Herdr configuration directory
  ansible.builtin.file:
    path: "{{ crewship_herdr_config_dir }}"
    state: directory
    owner: "{{ crewship_cfg.user }}"
    group: "{{ crewship_group }}"
    mode: "0700"
  become: true

- name: Render the Herdr static configuration
  ansible.builtin.template:
    src: herdr.toml.j2
    dest: "{{ crewship_herdr_config }}"
    owner: "{{ crewship_cfg.user }}"
    group: "{{ crewship_group }}"
    mode: "0600"
  become: true
  notify: restart herdr

- name: Render the Herdr user unit
  ansible.builtin.template:
    src: herdr.service.j2
    dest: "{{ crewship_user_units }}/herdr.service"
    owner: "{{ crewship_cfg.user }}"
    group: "{{ crewship_group }}"
    mode: "0644"
  become: true
  notify:
    - reload user systemd
    - restart herdr

- name: Ensure the user default.target.wants directory
  ansible.builtin.file:
    path: "{{ crewship_user_units }}/default.target.wants"
    state: directory
    owner: "{{ crewship_cfg.user }}"
    group: "{{ crewship_group }}"
    mode: "0755"
  become: true

# Static enablement: a plain symlink is exactly what `systemctl --user enable`
# creates for WantedBy=default.target, and it works in an image build where no
# user manager is running. When start_services is true the systemd task below
# sees the unit as already enabled and reports no change.
- name: Statically enable the Herdr user unit
  ansible.builtin.file:
    src: "{{ crewship_user_units }}/herdr.service"
    dest: "{{ crewship_user_units }}/default.target.wants/herdr.service"
    state: link
    owner: "{{ crewship_cfg.user }}"
    group: "{{ crewship_group }}"
    force: true
    follow: false
  become: true

- name: Enable and start the Herdr user service
  ansible.builtin.systemd_service:
    scope: user
    name: herdr.service
    enabled: true
    state: started
  become: "{{ crewship_become_target | bool }}"
  become_user: "{{ crewship_cfg.user }}"
  environment: "{{ crewship_user_systemd_env }}"
  when: crewship_manage_services | bool

- name: Report the deferred service start
  ansible.builtin.debug:
    msg: >-
      start_services is false: herdr.service is written and statically enabled
      at {{ crewship_user_units }}/herdr.service but not started. It comes up on
      the first boot of a host that has lingering enabled for
      {{ crewship_cfg.user }}.
  when: not (crewship_manage_services | bool)

# Spaces sidebar reporter (docs/herdr.md): a stdlib Python script on a 1 s
# user timer. Each run is a fresh process, so a rewritten script needs no
# restart.
- name: Install the Herdr Spaces reporter
  ansible.builtin.copy:
    src: "{{ crewship_herdr_spaces_source }}"
    dest: "{{ crewship_herdr_spaces_script }}"
    owner: "{{ crewship_cfg.user }}"
    group: "{{ crewship_group }}"
    mode: "0755"
    remote_src: true
  become: true

# Run from a viewing machine to copy this host's sidebar layout into its own
# Herdr config (docs/herdr.md).
- name: Install the Herdr sidebar client helper
  ansible.builtin.copy:
    src: "{{ crewship_repo }}/maintenance/herdr-sidebar-to-client.py"
    dest: "{{ crewship_local_bin }}/herdr-sidebar-to-client.py"
    owner: "{{ crewship_cfg.user }}"
    group: "{{ crewship_group }}"
    mode: "0755"
    remote_src: true
  become: true

# The mosh entry point (herdr-patch/README.md): runs herdr, drops herdr's
# opaque background fill (herdr#3773), and paints or serves its images. Each
# mosh login starts a fresh process, so a rewritten script needs no restart.
- name: Install herdr-patch
  ansible.builtin.copy:
    src: "{{ crewship_repo }}/herdr-patch/herdr-patch"
    dest: "{{ crewship_local_bin }}/herdr-patch"
    owner: "{{ crewship_cfg.user }}"
    group: "{{ crewship_group }}"
    mode: "0755"
    remote_src: true
  become: true

# mosh-server and non-interactive SSH commands run with the system PATH, which
# has no ~/.local/bin, so `mosh <host> -- herdr-patch` finds the command, and
# herdr-patch finds herdr, only through these links.
# No owner or group: the file module follows links, so setting root here would
# chown the targets in ~/.local/bin and the next apply could not rewrite them.
- name: Link herdr and herdr-patch into /usr/local/bin
  ansible.builtin.file:
    src: "{{ crewship_local_bin }}/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    state: link
    force: true
  become: true
  become_user: root
  loop:
    - herdr
    - herdr-patch

# herdr-mosh is retired: herdr-patch replaced it. Hosts that applied the
# earlier install keep the old copy and its link until this removes them.
- name: Remove retired herdr-mosh
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  become: true
  become_user: root
  loop:
    - /usr/local/bin/herdr-mosh
    - "{{ crewship_local_bin }}/herdr-mosh"

# btop fitted to its pane (docs/herdr.md#btop): the launcher takes the place of
# the btop command and runs the installer's btop-bin with a preset of this
# config. btop rewrites its config on exit; every apply puts the saved one back.
- name: Install the btop launcher
  ansible.builtin.copy:
    src: "{{ crewship_btop_launcher_source }}"
    dest: "{{ crewship_local_bin }}/btop"
    owner: "{{ crewship_cfg.user }}"
    group: "{{ crewship_group }}"
    mode: "0755"
    remote_src: true
  become: true

- name: Ensure the btop configuration directory
  ansible.builtin.file:
    path: "{{ crewship_btop_config | dirname }}"
    state: directory
    owner: "{{ crewship_cfg.user }}"
    group: "{{ crewship_group }}"
    mode: "0755"
  become: true

- name: Install the btop configuration
  ansible.builtin.copy:
    src: "{{ crewship_repo }}/config/btop.conf"
    dest: "{{ crewship_btop_config }}"
    owner: "{{ crewship_cfg.user }}"
    group: "{{ crewship_group }}"
    mode: "0644"
    remote_src: true
  become: true

- name: Render the Herdr Spaces reporter unit and timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ crewship_user_units }}/{{ item }}"
    owner: "{{ crewship_cfg.user }}"
    group: "{{ crewship_group }}"
    mode: "0644"
  become: true
  loop:
    - herdr-spaces.service
    - herdr-spaces.timer
  notify: reload user systemd

- name: Ensure the user timers.target.wants directory
  ansible.builtin.file:
    path: "{{ crewship_user_units }}/timers.target.wants"
    state: directory
    owner: "{{ crewship_cfg.user }}"
    group: "{{ crewship_group }}"
    mode: "0755"
  become: true

- name: Statically enable the Herdr Spaces reporter timer
  ansible.builtin.file:
    src: "{{ crewship_user_units }}/herdr-spaces.timer"
    dest: "{{ crewship_user_units }}/timers.target.wants/herdr-spaces.timer"
    state: link
    owner: "{{ crewship_cfg.user }}"
    group: "{{ crewship_group }}"
    force: true
    follow: false
  become: true

- name: Enable and start the Herdr Spaces reporter timer
  ansible.builtin.systemd_service:
    scope: user
    name: herdr-spaces.timer
    enabled: true
    state: started
  become: "{{ crewship_become_target | bool }}"
  become_user: "{{ crewship_cfg.user }}"
  environment: "{{ crewship_user_systemd_env }}"
  when: crewship_manage_services | bool

# Herdr's own omp extension reports each omp pane's state (working, blocked,
# idle) to the sidebar; without it every omp agent shows as idle. herdr refuses
# to install it until the omp extensions directory exists. Every apply runs the
# install so a herdr upgrade refreshes it; the checksum comparison reports a
# change only when herdr rewrote the file.
- name: Install Herdr's omp state integration
  when:
    - crewship_cfg.profiles.agents | bool
    - not ansible_check_mode
  block:
    - name: Ensure the omp extensions directory
      ansible.builtin.file:
        path: "{{ crewship_herdr_omp_integration | dirname }}"
        state: directory
        owner: "{{ crewship_cfg.user }}"
        group: "{{ crewship_group }}"
        mode: "0755"
      become: true

    - name: Checksum the Herdr omp integration before install
      ansible.builtin.stat:
        path: "{{ crewship_herdr_omp_integration }}"
      become: true
      register: crewship_herdr_omp_before

    - name: Run herdr integration install omp
      ansible.builtin.command:
        argv: ["{{ crewship_herdr_bin }}", integration, install, omp]
      changed_when: false

    - name: Checksum the Herdr omp integration after install
      ansible.builtin.stat:
        path: "{{ crewship_herdr_omp_integration }}"
      become: true
      register: crewship_herdr_omp_after
      changed_when: >-
        crewship_herdr_omp_after.stat.checksum | default('')
        != crewship_herdr_omp_before.stat.checksum | default('')
