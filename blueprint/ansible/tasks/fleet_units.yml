---
# Only enabled profiles select units for rendering and legacy retirement.
# Disabled profiles leave their units and enablement links unchanged.
# A host without old guard units changes nothing.
# With start_services false, files converge without stopping or starting units.

- name: Ensure the user unit directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ crewship_cfg.user }}"
    group: "{{ crewship_group }}"
    mode: "0755"
  become: true
  loop:
    - "{{ crewship_user_units }}"
    - "{{ crewship_user_units }}/default.target.wants"
    - "{{ crewship_user_units }}/timers.target.wants"

- name: Find the retired flotilla units
  ansible.builtin.stat:
    path: "{{ crewship_user_units }}/{{ item }}"
    get_checksum: false
  become: true
  loop: "{{ crewship_fleet_retired_units }}"
  register: crewship_fleet_retired
  changed_when: false
  check_mode: false

- name: Stop the retired flotilla timers and paths
  ansible.builtin.systemd_service:
    scope: user
    name: "{{ item.item }}"
    state: stopped
  become: "{{ crewship_become_target | bool }}"
  become_user: "{{ crewship_cfg.user }}"
  environment: "{{ crewship_user_systemd_env }}"
  loop: "{{ crewship_fleet_retired.results | selectattr('stat.exists') | selectattr('item', 'match', '.*\\.(timer|path)$') | list }}"
  loop_control:
    label: "{{ item.item }}"
  when: crewship_manage_services | bool

- name: Stop the other retired flotilla units
  ansible.builtin.systemd_service:
    scope: user
    name: "{{ item.item }}"
    state: stopped
  become: "{{ crewship_become_target | bool }}"
  become_user: "{{ crewship_cfg.user }}"
  environment: "{{ crewship_user_systemd_env }}"
  loop: "{{ crewship_fleet_retired.results | selectattr('stat.exists') | rejectattr('item', 'match', '.*\\.(timer|path)$') | list }}"
  loop_control:
    label: "{{ item.item }}"
  when: crewship_manage_services | bool

# Deleting the enablement links is the disable; the links are static.
- name: Delete the retired flotilla units and their enablement links
  ansible.builtin.file:
    path: "{{ crewship_user_units }}/{{ item[1] }}{{ item[0] }}"
    state: absent
  become: true
  loop: "{{ crewship_fleet_retired_units | product(['', 'default.target.wants/', 'timers.target.wants/']) | list }}"
  loop_control:
    label: "{{ item[1] }}{{ item[0] }}"
  notify: reload user systemd

- name: Reload user systemd after deleting the retired units
  ansible.builtin.systemd_service:
    scope: user
    daemon_reload: true
  become: "{{ crewship_become_target | bool }}"
  become_user: "{{ crewship_cfg.user }}"
  environment: "{{ crewship_user_systemd_env }}"
  when:
    - crewship_manage_services | bool
    - crewship_fleet_retired.results | selectattr('stat.exists') | list | length > 0

- name: Delete the retired Docker guard allowlist
  ansible.builtin.file:
    path: "{{ crewship_fleet_doctor_dir }}/docker-guard-allow.txt"
    state: absent
  become: true
  when: crewship_cfg.profiles.fleet_guards | bool

- name: Render the fleet units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ crewship_user_units }}/{{ item }}"
    owner: "{{ crewship_cfg.user }}"
    group: "{{ crewship_group }}"
    mode: "0644"
  become: true
  loop: "{{ crewship_fleet_units }}"
  notify:
    - reload user systemd
    - restart fleet timers

- name: Statically enable the fleet units
  ansible.builtin.file:
    src: "{{ crewship_user_units }}/{{ item.unit }}"
    dest: "{{ crewship_user_units }}/{{ item.wants }}/{{ item.unit }}"
    state: link
    owner: "{{ crewship_cfg.user }}"
    group: "{{ crewship_group }}"
    force: true
    follow: false
  become: true
  loop: "{{ crewship_fleet_enabled_units }}"
  loop_control:
    label: "{{ item.unit }}"

- name: Enable and start the fleet units
  ansible.builtin.systemd_service:
    scope: user
    name: "{{ item.unit }}"
    enabled: true
    state: started
  become: "{{ crewship_become_target | bool }}"
  become_user: "{{ crewship_cfg.user }}"
  environment: "{{ crewship_user_systemd_env }}"
  loop: "{{ crewship_fleet_enabled_units }}"
  loop_control:
    label: "{{ item.unit }}"
  when: crewship_manage_services | bool

- name: Report the deferred fleet start
  ansible.builtin.debug:
    msg: >-
      start_services is false: fleet units are written and statically enabled
      but not started here. Enabled units start at the next user login.
  when: not (crewship_manage_services | bool)
