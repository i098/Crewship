---
# Instagram DM alerts (docs/architecture.md#instagram-dm-alerts): the skill script goes to
# ~/.local/bin, a user timer polls with it, and a thin check in the Firstmate state directory is
# bound to its bytes with bin/fm-check-register.sh. The session file is not written here: log in
# once with `instagram_dm.py login`. The unit stays idle until that file exists.

- name: Ensure the Instagram DM directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ crewship_local_bin }}"
    - "{{ crewship_firstmate_dir }}/state"
    - "{{ crewship_user_units }}/timers.target.wants"

- name: Install the Instagram DM script
  ansible.builtin.copy:
    src: "{{ crewship_blueprint }}/skills/public/instagram-dm/instagram_dm.py"
    dest: "{{ crewship_instagram_dm_script }}"
    mode: "0755"
    remote_src: true

- name: Render the Instagram DM poll unit and timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ crewship_user_units }}/{{ item }}"
    mode: "0644"
  loop: [instagram-dm-poll.service, instagram-dm-poll.timer]
  notify: reload user systemd

- name: Statically enable the Instagram DM poll timer
  ansible.builtin.file:
    src: "{{ crewship_user_units }}/instagram-dm-poll.timer"
    dest: "{{ crewship_user_units }}/timers.target.wants/instagram-dm-poll.timer"
    state: link
    force: true
    follow: false

- name: Enable and start the Instagram DM poll timer
  ansible.builtin.systemd_service:
    scope: user
    name: instagram-dm-poll.timer
    enabled: true
    state: started
  environment: "{{ crewship_user_systemd_env }}"
  when: crewship_manage_services | bool

- name: Write the Instagram DM check
  ansible.builtin.template:
    src: instagram-dms.check.sh.j2
    dest: "{{ crewship_instagram_dm_check }}"
    mode: "0700"

# Firstmate runs only checks whose bytes match their trust file, so a changed check is registered again.
- name: Read the Instagram DM check registration
  ansible.builtin.command:
    argv:
      - bash
      - -c
      - '. bin/fm-pr-lib.sh && . bin/fm-check-lib.sh && fm_custom_check_registered state "$1"'
      - _
      - instagram-dms
    chdir: "{{ crewship_firstmate_dir }}"
  register: crewship_instagram_dm_trust
  changed_when: false
  failed_when: false
  check_mode: false

- name: Register the Instagram DM check with Firstmate
  ansible.builtin.command:
    argv: [bin/fm-check-register.sh, instagram-dms]
    chdir: "{{ crewship_firstmate_dir }}"
  environment:
    FM_HOME: "{{ crewship_firstmate_dir }}"
  changed_when: true
  when:
    - not ansible_check_mode
    - crewship_instagram_dm_trust.rc != 0
