---
# Empty-pane pruner (docs/herdr.md#empty-pane-pruner): a user timer runs
# blueprint/maintenance/herdr-prune-empty.py. Each run is a fresh process, so a rewritten script needs no restart.

- name: Ensure the pruner directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ crewship_local_bin }}"
    - "{{ crewship_user_units }}/timers.target.wants"

- name: Install the empty-pane pruner
  ansible.builtin.copy:
    src: "{{ crewship_blueprint }}/maintenance/herdr-prune-empty.py"
    dest: "{{ crewship_herdr_prune_script }}"
    mode: "0755"
    remote_src: true

- name: Render the empty-pane pruner unit and timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ crewship_user_units }}/{{ item }}"
    mode: "0644"
  loop: [herdr-prune-empty.service, herdr-prune-empty.timer]
  notify: reload user systemd

- name: Statically enable the empty-pane pruner timer
  ansible.builtin.file:
    src: "{{ crewship_user_units }}/herdr-prune-empty.timer"
    dest: "{{ crewship_user_units }}/timers.target.wants/herdr-prune-empty.timer"
    state: link
    force: true
    follow: false

- name: Check for the installed empty-pane pruner timer
  ansible.builtin.stat:
    path: "{{ crewship_user_units }}/herdr-prune-empty.timer"
  register: crewship_herdr_prune_timer
  when: ansible_check_mode

- name: Enable and start the empty-pane pruner timer
  ansible.builtin.systemd_service:
    scope: user
    name: herdr-prune-empty.timer
    enabled: true
    state: started
  environment: "{{ crewship_user_systemd_env }}"
  when:
    - crewship_manage_services | bool
    - not ansible_check_mode or crewship_herdr_prune_timer.stat.exists
