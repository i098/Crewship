---
# Fleet browsers: obscura -> chrome -> vnc tier ladder, shared session jar.
# profiles.fleet_browsers or profiles.fleet_guards turns it on.
# docs/fleet-guards.md owns the design; fleet/browsers/fleet-browser owns the
# runtime. The obscura tier needs its latest binary + unit and the vnc tier its
# apt packages; chrome and vnc are started on demand by the operator or the
# fleet-browser CLI and gc'd after idle_timeout_min. The Herdr unit carries
# the ladder's environment (templates/herdr.service.j2), so this file never
# edits it.

- name: Ensure the journald drop-in directory
  tags: [journald]
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

# A user unit's own LogRateLimit* is ignored (journald rate-limits user-manager
# units as one user@<uid>.service bucket), so the cap lives in journald itself.
# It is host-wide: every service, and all of a user's units together, get 1000
# lines per 30s (scaled up by journald with free disk). A page stuck in a loop
# once logged ~17 MB/s and filled the disk via syslog.
- name: Cap journald intake host-wide
  tags: [journald]
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/50-fleet-ratelimit.conf
    content: |
      {{ ansible_managed | comment }}
      [Journal]
      RateLimitIntervalSec=30s
      RateLimitBurst=1000
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: restart journald

- name: Install the vnc tier packages
  ansible.builtin.apt:
    name: "{{ crewship_fleet_browser_vnc_packages }}"
    state: present
  when: not ansible_check_mode or (crewship_apt_indexes.matched | default(0)) > 0
  become: true

- name: Ensure fleet browser directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ crewship_cfg.user }}"
    group: "{{ crewship_group }}"
    mode: "0755"
  become: true
  loop:
    - "{{ crewship_fleet_dir }}"
    - "{{ crewship_fleet_browsers_dir }}"
    - "{{ crewship_cfg.home }}/.fleet-browser"
    - "{{ crewship_user_units }}/default.target.wants"
    - "{{ crewship_user_units }}/timers.target.wants"

- name: Install the fleet browser scripts
  ansible.builtin.copy:
    src: "{{ crewship_fleet_sources }}/{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: "{{ crewship_cfg.user }}"
    group: "{{ crewship_group }}"
    mode: "{{ item.mode }}"
    remote_src: true
  become: true
  loop:
    - { src: browsers/fleet-browser, dest: "{{ crewship_fleet_browsers_dir }}/fleet-browser", mode: "0755" }
    - { src: browsers/cookie-sync.ts, dest: "{{ crewship_fleet_browsers_dir }}/cookie-sync.ts", mode: "0644" }
    - { src: browsers/env.sh, dest: "{{ crewship_fleet_browsers_dir }}/env.sh", mode: "0644" }

- name: Stat the resolved Obscura release
  ansible.builtin.stat:
    path: "{{ crewship_browser_obscura_dir }}/obscura"
    get_checksum: false
  register: crewship_obscura_stat
  changed_when: false
  check_mode: false

# Each release extracts into its own directory, so an unchanged release is a
# no-op and a new one never overwrites binaries a running tier holds open.
- name: Download and extract the latest Obscura release
  when: not crewship_obscura_stat.stat.exists
  block:
    - name: Create the Obscura release directory
      ansible.builtin.file:
        path: "{{ crewship_browser_obscura_dir }}"
        state: directory
        owner: "{{ crewship_cfg.user }}"
        group: "{{ crewship_group }}"
        mode: "0755"
      become: true

    - name: Fetch the obscura tarball
      ansible.builtin.get_url:
        url: "{{ crewship_browser_obscura.url }}"
        dest: "{{ crewship_browser_obscura_dir }}.tar.gz"
        checksum: "sha256:{{ crewship_browser_obscura.sha256 }}"
        mode: "0600"
        owner: "{{ crewship_cfg.user }}"
      become: true

    - name: Extract obscura binaries
      ansible.builtin.unarchive:
        src: "{{ crewship_browser_obscura_dir }}.tar.gz"
        dest: "{{ crewship_browser_obscura_dir }}"
        remote_src: true
        owner: "{{ crewship_cfg.user }}"
        group: "{{ crewship_group }}"
        mode: "0755"
      become: true

    - name: Clean up the obscura tarball
      ansible.builtin.file:
        path: "{{ crewship_browser_obscura_dir }}.tar.gz"
        state: absent
      become: true

- name: Point the fleet browser at the resolved Obscura release
  ansible.builtin.file:
    src: "{{ crewship_browser_obscura_dir }}/{{ item }}"
    dest: "{{ crewship_fleet_browsers_dir }}/{{ item }}"
    state: link
    force: true
    owner: "{{ crewship_cfg.user }}"
    group: "{{ crewship_group }}"
  become: true
  loop: [obscura, obscura-worker]
  when: not ansible_check_mode

- name: Inject the shared-browser env into shell profiles
  ansible.builtin.lineinfile:
    path: "{{ crewship_cfg.home }}/{{ item }}"
    line: '. "{{ crewship_fleet_browsers_dir }}/env.sh" 2>/dev/null'
    insertbefore: BOF
    create: true
    owner: "{{ crewship_cfg.user }}"
    group: "{{ crewship_group }}"
    mode: "0644"
  become: true
  loop:
    - .profile
    - .bashrc

- name: Render fleet browser units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ crewship_user_units }}/{{ item }}"
    owner: "{{ crewship_cfg.user }}"
    group: "{{ crewship_group }}"
    mode: "0644"
  become: true
  loop: "{{ crewship_fleet_browser_units }}"
  notify:
    - reload user systemd
    - restart fleet browser obscura
    - restart fleet browser timers

- name: Statically enable fleet browser units
  ansible.builtin.file:
    src: "{{ crewship_user_units }}/{{ item.unit }}"
    dest: "{{ crewship_user_units }}/{{ item.wants }}/{{ item.unit }}"
    state: link
    owner: "{{ crewship_cfg.user }}"
    group: "{{ crewship_group }}"
    force: true
    follow: false
  become: true
  loop: "{{ crewship_fleet_browser_enabled_units }}"
  loop_control:
    label: "{{ item.unit }}"

- name: Enable and start fleet browser units
  ansible.builtin.systemd_service:
    scope: user
    name: "{{ item }}"
    enabled: true
    state: started
  become: "{{ crewship_become_target | bool }}"
  become_user: "{{ crewship_cfg.user }}"
  environment: "{{ crewship_user_systemd_env }}"
  loop: "{{ crewship_fleet_browser_enabled_units | map(attribute='unit') | list }}"
  when: crewship_manage_services | bool

- name: Report the deferred fleet browser start
  ansible.builtin.debug:
    msg: >-
      start_services is false: obscura + sync/gc units are written and
      statically enabled but not started here.
  when: not (crewship_manage_services | bool)
