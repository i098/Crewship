---
# Optional iMessage bridge to Firstmate over a Photon Spectrum line or
# self-hosted BlueBubbles relays (docs/imessage.md). Runs only when
# crewship.imessage is set, which belongs in .local/host.yml only.
#
#   * the service runs from a copy of apps/imessage/ under the account's home, with
#     the latest spectrum-ts, so it keeps working without the checkout
#   * the Photon project id and secret, or the relay passwords, are read from
#     ~/super.env when the unit starts; they are never written by this playbook
#   * the unit holds the owner's phone number, so it is mode 0600

- name: Ensure the iMessage bridge directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ crewship_imessage_dir }}"
    - "{{ crewship_local_bin }}"
    - "{{ crewship_user_units }}/default.target.wants"

- name: Install the iMessage bridge service
  ansible.builtin.copy:
    src: "{{ crewship_repo }}/apps/imessage/{{ item }}"
    dest: "{{ crewship_imessage_dir }}/{{ item }}"
    mode: "0644"
    remote_src: true
  loop: [bridge.ts, bluebubbles.ts, cards.ts, desk.ts, image.ts, instagram-webhook.ts, memory.ts, outbox.ts, zoom.ts]
  notify: restart fm-imessage

- name: Install the iMessage commands
  ansible.builtin.copy:
    src: "{{ crewship_repo }}/apps/imessage/{{ item }}"
    dest: "{{ crewship_local_bin }}/{{ item }}"
    mode: "0755"
    remote_src: true
  loop: [fm-imessage, fm-location]

- name: Read the installed spectrum-ts version
  ansible.builtin.slurp:
    src: "{{ crewship_imessage_dir }}/node_modules/spectrum-ts/package.json"
  register: crewship_imessage_sdk
  failed_when: false
  check_mode: false

- name: Record whether spectrum-ts needs the resolved release
  ansible.builtin.set_fact:
    crewship_imessage_sdk_stale: >-
      {{ crewship_imessage_sdk.content is not defined
         or (crewship_imessage_sdk.content | b64decode | from_json).version != crewship_latest['spectrum-ts'] }}

- name: Report the spectrum-ts install that check mode cannot perform
  ansible.builtin.debug:
    msg: "check mode: would run `bun add` in {{ crewship_imessage_dir }} for spectrum-ts {{ crewship_latest['spectrum-ts'] }}."
  when:
    - ansible_check_mode
    - crewship_imessage_sdk_stale | bool

# bun checks the integrity the registry records for the resolved version.
- name: Install the latest spectrum-ts
  ansible.builtin.command:
    argv:
      - "{{ crewship_local_bin }}/bun"
      - add
      - --exact
      - "spectrum-ts@{{ crewship_latest['spectrum-ts'] }}"
    chdir: "{{ crewship_imessage_dir }}"
  changed_when: true
  when:
    - not ansible_check_mode
    - crewship_imessage_sdk_stale | bool
  notify: restart fm-imessage

- name: Render the iMessage bridge unit
  ansible.builtin.template:
    src: fm-imessage.service.j2
    dest: "{{ crewship_user_units }}/fm-imessage.service"
    mode: "0600"
  notify:
    - reload user systemd
    - restart fm-imessage

- name: Statically enable the iMessage bridge
  ansible.builtin.file:
    src: "{{ crewship_user_units }}/fm-imessage.service"
    dest: "{{ crewship_user_units }}/default.target.wants/fm-imessage.service"
    state: link
    force: true
    follow: false

- name: Enable and start the iMessage bridge
  ansible.builtin.systemd_service:
    scope: user
    name: fm-imessage.service
    enabled: true
    state: started
  environment: "{{ crewship_user_systemd_env }}"
  when: crewship_manage_services | bool

# App cards (docs/imessage.md#cards): a named Cloudflare tunnel carries crewship.imessage.cards.url to the
# bridge's card-only port. Its token stays in ~/super.env.
- name: Install the tunnel to the iMessage card pages
  when: crewship_cfg.imessage.cards is defined
  block:
    - name: Render the card tunnel unit
      ansible.builtin.template:
        src: fm-cards-tunnel.service.j2
        dest: "{{ crewship_user_units }}/fm-cards-tunnel.service"
        mode: "0644"
      notify:
        - reload user systemd
        - restart fm-cards-tunnel

    - name: Statically enable the card tunnel
      ansible.builtin.file:
        src: "{{ crewship_user_units }}/fm-cards-tunnel.service"
        dest: "{{ crewship_user_units }}/default.target.wants/fm-cards-tunnel.service"
        state: link
        force: true
        follow: false

    - name: Enable and start the card tunnel
      ansible.builtin.systemd_service:
        scope: user
        name: fm-cards-tunnel.service
        enabled: true
        state: started
      environment: "{{ crewship_user_systemd_env }}"
      when: crewship_manage_services | bool
