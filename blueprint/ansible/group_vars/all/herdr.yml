---
# The system PATH directory for the host-wide herdr links (tasks/herdr_links.yml).
crewship_global_bin: /usr/local/bin
# --- Herdr static config ----------------------------------------------------
# Only the reviewed, non-secret subset is templated. experimental.pane_history
# is deliberately absent: it persists terminal output that can contain tokens.
crewship_herdr_update_channel: stable
crewship_herdr_show_agent_labels: true
crewship_herdr_theme_auto_switch: false
crewship_herdr_status_indicators: symbols
crewship_omp_sidebar_extension: "{{ crewship_cfg.home }}/.omp/agent/extensions/crewship-herdr-sidebar.ts"
# The "aa-" name loads it before the plugins whose status it takes over (docs/omp.md).
crewship_omp_status_icons_extension: "{{ crewship_cfg.home }}/.omp/agent/extensions/aa-mode-icons.ts"
# Blocks pkill/killall/kill-by-pgrep in every omp session (docs/omp.md).
crewship_omp_no_pattern_kill_extension: "{{ crewship_cfg.home }}/.omp/agent/extensions/fm-no-pattern-kill.ts"
crewship_omp_opus_effort_cap_extension: "{{ crewship_cfg.home }}/.omp/agent/extensions/fm-opus-effort-cap.ts"
# The sentrux/fallow quality gate at the end of every omp agent turn (docs/omp.md#quality-gate).
crewship_omp_quality_gate_extension: "{{ crewship_cfg.home }}/.omp/agent/extensions/crewship-quality-gate.ts"
# Herdr's own omp state extension; `herdr integration install omp` writes it (docs/herdr.md).
crewship_herdr_omp_integration: "{{ crewship_cfg.home }}/.omp/agent/extensions/herdr-omp-agent-state.ts"
# omp as the no-mistakes pi agent, and the omp overlay only daemon-spawned omp
# loads (docs/omp.md#no-mistakes-pipeline-agent).
crewship_omp_as_pi_dir: "{{ crewship_cfg.home }}/.no-mistakes/omp-as-pi"
crewship_no_mistakes_omp_overlay: "{{ crewship_cfg.home }}/.no-mistakes/omp-config.yml"
# Stdlib-only reporter that feeds the Spaces sidebar layout, run by herdr-spaces.timer.
crewship_herdr_spaces_source: "{{ crewship_blueprint }}/maintenance/herdr-spaces.py"
crewship_herdr_spaces_script: "{{ crewship_local_bin }}/herdr-spaces.py"
# btop: ~/.local/bin/btop is a launcher that picks a preset of the saved config
# by pane size, so it also loads in a phone's 50-column pane (docs/herdr.md#btop).
crewship_btop_launcher_source: "{{ crewship_blueprint }}/maintenance/btop.sh"
crewship_btop_config: "{{ crewship_cfg.home }}/.config/btop/btop.conf"
