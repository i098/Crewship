---
# Stall nudge: fm-main-stall-nudge.timer types into main Firstmate's herdr pane
# when an operator note, a wake or a Lavish board answer waits too long (docs/architecture.md#stall-nudge).
# Seconds a note, a wake-queue row, a board answer and the gap between nudges. An empty pane
# discovers main's pane in the Firstmate home; set a pane id such as w2:pZ to pin it.
crewship_stall_nudge_script: "{{ crewship_local_bin }}/fm-main-stall-nudge"
crewship_stall_nudge_note_max: 45
crewship_stall_nudge_wake_max: 600
crewship_stall_nudge_board_max: 300
crewship_stall_nudge_gap: 120
crewship_stall_nudge_session: default
crewship_stall_nudge_pane: ""
# Usage card: fm-usage-remind (second ExecStart of the stall nudge service) texts the card from
# fm-usage-brief at most once per this many seconds while the owner is texting. The card shows these mounts.
# The card renders with headless Chrome: the desktop profile or crewship_chrome_install: true provides it.
crewship_usage_remind_every: 3600
crewship_usage_disks: ["/"]
crewship_usage_scripts: [fm-usage-brief, fm-usage-remind, fm-text-card]
