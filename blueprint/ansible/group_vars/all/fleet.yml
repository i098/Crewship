---
# --- Fleet guards -----------------------------------------------------------
# Sources live under fleet/. Installed files stay under the account's home.
# Disabling a profile stops managing its files and units without removing them.
crewship_fleet_sources: "{{ crewship_repo }}/fleet"
crewship_fleet_dir: "{{ crewship_cfg.home }}/oss-fleet"
crewship_fleet_doctor_dir: "{{ crewship_fleet_dir }}/doctor"

# Storage guard (fleet/doctor/storage-guard.sh, every 5 min). Use% of the
# filesystems holding /, /var/log, the home and Docker's data root: WARN alerts
# once per episode, re-armed below WARN - hysteresis; CRIT prunes build cache,
# dangling images and unused images created more than image_age_hours ago
# (creation time, not last use), then alerts at most once per repeat_min. A
# fill rate projecting full within fill_horizon_hours alerts even below WARN.
crewship_storage_guard_warn_pct: 85
crewship_storage_guard_crit_pct: 92
crewship_storage_guard_hysteresis_pct: 3
crewship_storage_guard_image_age_hours: 168
crewship_storage_guard_fill_horizon_hours: 6
crewship_storage_guard_repeat_min: 30

crewship_fleet_guard_units:
  - crewship-docker-guard.service
  - crewship-docker-guard.timer
  - crewship-dev-server-reaper.service
  - crewship-dev-server-reaper.timer
  - crewship-storage-guard.service
  - crewship-storage-guard.timer
  - crewship-devtools-bridge-reaper.service
  - crewship-devtools-bridge-reaper.timer
crewship_fleet_guard_enabled_units:
  - { unit: crewship-docker-guard.timer, wants: timers.target.wants }
  - { unit: crewship-dev-server-reaper.timer, wants: timers.target.wants }
  - { unit: crewship-storage-guard.timer, wants: timers.target.wants }
  - { unit: crewship-devtools-bridge-reaper.timer, wants: timers.target.wants }
# Only selected units reach rendering, retirement, enablement and handlers.
crewship_fleet_units: "{{ crewship_fleet_guard_units if (crewship_cfg.profiles.fleet_guards | bool) else [] }}"
crewship_fleet_enabled_units: "{{ crewship_fleet_guard_enabled_units if (crewship_cfg.profiles.fleet_guards | bool) else [] }}"
# Older releases installed the same units as flotilla-*; apply stops and
# deletes any that remain (tasks/fleet_units.yml).
crewship_fleet_retired_units: "{{ crewship_fleet_units | map('regex_replace', '^crewship-', 'flotilla-') | list }}"
