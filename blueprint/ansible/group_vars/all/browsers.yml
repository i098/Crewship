---
# --- Fleet browsers (profiles.fleet_browsers, or fleet_guards) ---------------
crewship_fleet_browsers_enabled: "{{ (crewship_cfg.profiles.fleet_guards | bool) or (crewship_cfg.profiles.fleet_browsers | bool) }}"
crewship_fleet_browsers_dir: "{{ crewship_fleet_dir }}/browsers"
# The latest Obscura release for this platform, with the SHA-256 GitHub
# publishes for the asset; each release extracts into its own directory.
crewship_browser_obscura: "{{ crewship_latest.obscura.assets[crewship_platform] }}"
crewship_browser_obscura_dir: "{{ crewship_fleet_browsers_dir }}/obscura-{{ crewship_latest.obscura.version }}"
# The latest voxl release, with the SHA-256 GitHub publishes for its crate. The
# release has no binary, so tasks/fleet-browsers.yml builds the verified crate
# with cargo into its own directory per release.
crewship_browser_voxl: "{{ crewship_latest.voxl.assets[crewship_platform] }}"
crewship_browser_voxl_dir: "{{ crewship_fleet_browsers_dir }}/voxl-{{ crewship_latest.voxl.version }}"
# The voxl tier's own packages, so it works without the desktop profile: Xvfb
# (the display voxl streams), xfwm4 (the window manager, so Chrome maximizes and
# its pop-ups can be moved and closed), and what the voxl build links or runs:
# clang for bindgen, x264, libyuv, Opus, PulseAudio, libxcb and esbuild.
crewship_fleet_browser_voxl_packages:
  - xvfb
  - xfwm4
  - clang
  - pkg-config
  - libx264-dev
  - libyuv-dev
  - libopus-dev
  - libxcb1-dev
  - libpulse-dev
  - esbuild
# Unit files of retired tiers; the tasks remove them.
crewship_fleet_browser_retired_units:
  - fleet-browser-vnc.service
crewship_fleet_browser_units:
  - fleet-browser-obscura.service
  - fleet-browser-chrome.service
  - fleet-browser-voxl.service
  - fleet-browser-sync.service
  - fleet-browser-sync.timer
  - fleet-browser-gc.service
  - fleet-browser-gc.timer
crewship_fleet_browser_enabled_units:
  - { unit: fleet-browser-obscura.service, wants: default.target.wants }
  - { unit: fleet-browser-sync.timer, wants: timers.target.wants }
  - { unit: fleet-browser-gc.timer, wants: timers.target.wants }
