---
# runner-up (crewship.runner_up, docs/runner-up.md): one coordinator serves every repository,
# one fresh Docker container per job, for the repositories, slot groups and labels in
# crewship.runner_up.repos (scripts/ship.py requires it).
# Defaults live here, not in blueprint/config/default.yml: the block is opt-in.
crewship_runner_up: "{{ crewship_cfg.runner_up | default({}) }}"

crewship_runner_up_repos: "{{ crewship_runner_up.repos | default([]) }}"
# runner-up refuses pool labels that every self-hosted runner has (internal/config checkLabel).
crewship_runner_up_reserved_labels: [self-hosted, linux, windows, macos, x64, arm64, arm, x86]

crewship_runner_up_job_cpus: "{{ crewship_runner_up.job_cpus | default(4) | int }}"
crewship_runner_up_job_memory_gb: "{{ crewship_runner_up.job_memory_gb | default(8) | int }}"
# Most jobs at one time: `auto` takes half of the host's CPUs and memory.
crewship_runner_up_slots_setting: "{{ crewship_runner_up.total_slots | default('auto') }}"
crewship_runner_up_total_slots: >-
  {{ [1, ([ansible_facts['processor_vcpus'] | default(2) * 0.5 / crewship_runner_up_job_cpus | int,
           ansible_facts['memtotal_mb'] | default(4096) / 1024 * 0.5 / crewship_runner_up_job_memory_gb | int]
          | min) | int] | max
     if crewship_runner_up_slots_setting == 'auto' else crewship_runner_up_slots_setting | int }}

crewship_runner_up_data_dir: "{{ crewship_runner_up.data_dir | default('') }}"
crewship_runner_up_state_dir: >-
  {{ (crewship_runner_up_data_dir ~ '/runner-up') if crewship_runner_up_data_dir
     else crewship_cfg.home ~ '/.local/state/runner-up' }}

# Caps. Weights and nice only matter while the host wants the CPU; the memory cap and the
# disk cap always hold.
crewship_runner_up_cpu_weight: "{{ crewship_runner_up.cpu_weight | default(20) }}"
crewship_runner_up_io_weight: "{{ crewship_runner_up.io_weight | default(20) }}"
crewship_runner_up_nice: "{{ crewship_runner_up.nice | default(10) }}"
crewship_runner_up_memory_max: "{{ crewship_runner_up.memory_max | default('50%') }}"
# The most CPU all of CI uses together: this share of the host's CPUs, as the slice's CPUQuota (100% is one CPU).
crewship_runner_up_cpu_share: "{{ crewship_runner_up.cpu_share | default(50) }}"
crewship_runner_up_cpu_quota: "{{ (ansible_facts['processor_vcpus'] | default(2) | int * crewship_runner_up_cpu_share | int) }}%"
# Write caps of the slice, set only when io_write_device names the disk of the build cache and job
# work directories (for example /dev/sdc). The defaults leave Rust jobs room: 40M and 200 IOPS
# starved cargo builds for hours and left a queue of runs behind busy runners.
crewship_runner_up_io_write_device: "{{ crewship_runner_up.io_write_device | default('') }}"
crewship_runner_up_io_write_mb: "{{ crewship_runner_up.io_write_mb | default(120) | int }}"
crewship_runner_up_io_write_iops: "{{ crewship_runner_up.io_write_iops | default(600) | int }}"
crewship_runner_up_disk_max_gb: "{{ crewship_runner_up.disk_max_gb | default(50) }}"
# At or above the pause level of the data disk the coordinators stop taking jobs; below the resume level they start again.
crewship_runner_up_pause_pct: "{{ crewship_runner_up.pause_pct | default(88) | int }}"
crewship_runner_up_resume_pct: "{{ crewship_runner_up.resume_pct | default(85) | int }}"
# Place logs stay a week; they sit on the same disk as the build cache.
crewship_runner_up_log_keep_days: 7

# The compile cache, cargo registry and package stores that every local job shares
# (docs/runner-up.md#shared-build-cache); sccache caps the compile cache by LRU.
crewship_runner_up_shared_cache: >-
  {{ (crewship_runner_up_data_dir | default(crewship_cfg.home ~ '/.local/share', true)) ~ '/ci-shared-cache' }}
crewship_runner_up_cache_max_gb: >-
  {{ crewship_runner_up.cache_max_gb | default(150, true) | int }}

crewship_runner_up_slice: runnerup.slice
crewship_runner_up_slice_dir: /etc/systemd/system
crewship_runner_up_image: crewship-ci-runner:latest
crewship_runner_up_dir: "{{ crewship_cfg.home }}/.local/share/runner-up"
crewship_runner_up_shim_dir: "{{ crewship_runner_up_dir }}/shim"
crewship_runner_up_dockerfile: "{{ crewship_runner_up_dir }}/ci-runner.Dockerfile"
crewship_runner_up_config_dir: "{{ crewship_cfg.home }}/.config/runner-up"
# One coordinator for each repository: a runner-up pool is global to its coordinator, so one
# coordinator for every repository would open a scale set in each repository for every label.
crewship_runner_up_repo_names: "{{ crewship_runner_up_repos | map(attribute='repo') | unique | list }}"
# The instance name of a repository: its name with every run of other characters turned to a dash.
crewship_runner_up_instances: >-
  {{ crewship_runner_up_repo_names | map('lower') | map('regex_replace', '[^a-z0-9]+', '-')
     | map('regex_replace', '^-|-$', '') | list }}
# Extra machines join one coordinator, because a machine's budget is not shared between coordinators.
crewship_runner_up_machines_repo: >-
  {{ crewship_runner_up.machines_repo | default(crewship_runner_up_repo_names | first | default(''), true) }}
crewship_runner_up_maintain: "{{ crewship_local_bin }}/runner-up-maintain"
crewship_runner_up_build_gate_bin: "{{ crewship_local_bin }}/build-gate"
# Opt in: jobs start only when the host-wide build gate has a free slot (docs/runner-up.md#build-gate).
crewship_runner_up_build_gate: "{{ crewship_runner_up.build_gate | default(false) }}"
crewship_build_gate_dir: /tmp/build-gate
# The one host-wide job count; every build-gate caller reads it. Keep it below runner-up total_slots so the gate limits runner-up.
crewship_build_gate_slots: "{{ crewship_runner_up.build_gate_slots | default(4) | int }}"
# The cargo shim file that sends host builds (workers, mates) through build-gate.
crewship_build_gate_cargo: "{{ crewship_local_bin }}/cargo"
crewship_runner_up_bin: "{{ crewship_local_bin }}/runner-up"
# Validates each config before it replaces the live one; the coordinator ignores a bad file and keeps the old setup.
crewship_runner_up_check: "{{ crewship_runner_up_bin }} check-config --config %s"
# The CI pool's own hourly timer builds the same image, so the second builder runs only without it.
crewship_runner_up_build_image: "{{ crewship_cfg.ci_pool is not defined }}"
crewship_runner_up_units: [runner-up@.service, runner-up-clean.service, runner-up-clean.timer,
  runner-up-guard.service, runner-up-guard.timer]
crewship_runner_up_image_units: [runner-up-image.service, runner-up-image.timer]
