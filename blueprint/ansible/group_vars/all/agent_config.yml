---
# --- Sanitized preference files (Main-owned sources) ------------------------
# first_write: true means the file is written only when it does not exist, so
# an account that already holds provider settings is never overwritten.
crewship_omp_config: "{{ crewship_cfg.home }}/.omp/agent/config.yml"
crewship_acpx_config: "{{ crewship_cfg.home }}/.acpx/config.json"
crewship_agent_config_files:
  - src: blueprint/config/omp.yml
    dest: "{{ crewship_omp_config }}"
    dir_mode: "0700"
    mode: "0600"
    first_write: true
  # Merged on every apply; user providers and unshipped model keys stay.
  - src: blueprint/config/omp-models.yml
    dest: "{{ crewship_cfg.home }}/.omp/agent/models.yml"
    dir_mode: "0700"
    mode: "0600"
    first_write: false
  # marksman costs each omp session about 90 MB for markdown diagnostics that
  # agent work never uses.
  - src: blueprint/config/omp-lsp.json
    dest: "{{ crewship_cfg.home }}/.omp/agent/lsp.json"
    dir_mode: "0700"
    mode: "0600"
    first_write: true
  # See docs/omp.md#no-mistakes-pipeline-agent for agent selection.
  - src: blueprint/config/no-mistakes.yaml
    dest: "{{ crewship_cfg.home }}/.no-mistakes/config.yaml"
    dir_mode: "0700"
    mode: "0600"
    first_write: true
  - src: blueprint/config/acpx.json
    dest: "{{ crewship_acpx_config }}"
    dir_mode: "0700"
    mode: "0600"
    first_write: true

# Firstmate reads these from its own checkout and already gitignores them, so
# the clone stays clean and no .gitignore is edited.
crewship_firstmate_config_names:
  - crew-harness
  - secondmate-harness
  - crew-dispatch.json
  # 1000000 estimated tokens: no practical cap on the startup prompt memory.
  - startup-memory-budget
  # Fresh spawns are refused while host MemAvailable is under this many MB
  # (bin/fm-spawn-memory-floor-lib.sh). Ten live lanes at 5-8 GB each filled
  # 24 GB RAM + 52 GB swap on the source host on 2026-09-17.
  - spawn-memory-floor-mb
  # omp overlay Firstmate layers onto crewmate and scout launches (never
  # secondmates): the fable-5.1 advisor at low thinking. syncBacklog "off"
  # overrides the global "1", so crews never wait on it; turns that land during
  # a review batch into the next call, and it interrupts at most once per 10
  # turns. omp has no every-N-turns setting.
  - omp-crew-overlay.yml
  # "off": crews and scouts use the flat layout, not one Herdr workspace per task.
  - herdr-presentation-spaces
  # A presence flag (empty file): the watcher may also defer a bare turn end
  # on pane-churn evidence.
  - turnend-churn-absorb
crewship_firstmate_config_first_write: false
