schema_version: 1
crewship:
  user: coder
  home: /home/coder
  workspace: /home/coder/Dev
  start_services: true
  enable_linger: true
  # Absolute path on a data disk for Docker's data root and the npm and pip
  # caches. Empty keeps both on the system disk (docs/configuration.md#data-disk).
  data_dir: ""
  profiles:
    agents: true
    development: true
    firstmate: true
    docker: true
    tailscale: false
    desktop: false
    fleet_guards: false
    shared_postgres: false
    fleet_browsers: false
    chat: true
  herdr:
    theme: rose-pine
    # The outer terminal shows Herdr's notifications as desktop notifications.
    toast_delivery: terminal
    agent_panel_sort: spaces
    headless_cols: 120
    headless_rows: 40
    # Sidebar layouts; docs/herdr.md explains each line. The omp extension
    # feeds the Agents $ tokens and the herdr-spaces reporter timer the Spaces
    # ones.
    sidebar_width: 46
    sidebar_max_width: 56
    sidebar_agent_rows: |
      [
        [
          "state_icon",
          { token = "$who", fg = "#cba6f7", bold = true, rules = [{ equals = "firstmate", fg = "#89b4fa", bold = true }, { starts_with = "☾", bold = false }] },
          { token = "terminal_title", fg = "#94e2d5", rules = [{ starts_with = "└" }, { starts_with = "", hide = true }] },
        ],
        [
          { token = "terminal_title", fg = "#cdd6f4", dim = true, rules = [{ starts_with = "└", hide = true }] },
        ],
        [
          { token = "$pr", fg = "#89b4fa" },
          { token = "$issue", fg = "#cba6f7" },
          { token = "$add", fg = "#a6e3a1" },
          { token = "$del", fg = "#f38ba8" },
          { token = "$files", fg = "#f9e2af" },
        ],
      ]
    sidebar_space_rows: |
      [
        [
          "state_icon",
          { token = "$short", fg = "#cba6f7", rules = [{ equals = "firstmate", fg = "#89b4fa", bold = true }, { starts_with = "└", fg = "#94e2d5" }, { starts_with = "☾", fg = "#6c7086" }] },
          { token = "workspace", dim = true, rules = [{ equals = "firstmate", hide = true }, { starts_with = "2ndmate-", hide = true }, { starts_with = "└", hide = true }, { contains = "-afk-daemon-", hide = true }, { equals = "machine", hide = true }] },
          { token = "$decisions", fg = "#f38ba8", bold = true },
          { token = "$crew", fg = "#a6e3a1" },
          { token = "$queue", fg = "#f9e2af" },
          { token = "$machine", fg = "#a6adc8" },
        ],
        [
          { token = "$res", fg = "#a6adc8" },
        ],
        [
          { token = "$host", fg = "#a6adc8" },
        ],
        [
          { token = "$alert", fg = "#fab387" },
        ],
      ]
    # "reset" is Herdr's alias for the terminal's own background, so a transparent terminal shows through.
    sidebar_bg: "reset"
  browser_prune:
    enabled: true
    idle_seconds: 7200
    poll_seconds: 300
    max_gap_seconds: 900
  docker:
    init: true
    live_restore: true
  fleet:
    # Docker guard: remove stopped containers this many hours after they
    # exit; report running ones this old that nothing claims.
    docker_guard:
      stopped_hours: 24
  browsers:
    idle_timeout_min: 30
  firstmate:
    # Upstream Firstmate's main, fetched on every apply and kept as origin/main
    # plus the patch layer in patches/firstmate/, so a host stays current - which
    # is also why it must not be re-pinned to a sha.
    # Override url in .local/host.yml to track a fork instead.
    url: https://github.com/kunchenguid/firstmate.git
  desktop:
    display: 1
    novnc_port: 6080
    geometry: 1440x900
