providers:
  inception:
    baseUrl: https://api.inceptionlabs.ai/v1
    api: openai-completions
    apiKey: "!printenv INCEPTION_API_KEY"
    models:
      - id: mercury-3
        name: Mercury 3
        reasoning: true
        input: [text]
        contextWindow: 1000000
        maxTokens: 131072
  openai-codex:
    # See docs/omp.md for the effective context-window limit.
    modelOverrides:
      gpt-6-astra:
        contextWindow: 272000
        maxContextWindow: 1000000
      gpt-6.1-sol:
        contextWindow: 272000
        maxContextWindow: 1000000
      gpt-6-sol:
        contextWindow: 272000
        maxContextWindow: 1000000
      gpt-6-luna:
        contextWindow: 272000
        maxContextWindow: 1000000
      gpt-5.6-sol:
        contextWindow: 272000
        maxContextWindow: 1000000
      gpt-5.6-luna:
        contextWindow: 272000
        maxContextWindow: 1000000
