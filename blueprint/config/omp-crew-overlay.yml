# Captain-local omp overlay for crewmate and scout launches (bin/fm-spawn.sh).
# Captain order 2026-09-24: every crewmate runs with a fable-5.1 advisor at low thinking
# (its lowest level; `:off` is ignored on this model) that interrupts at most once per 10 turns.
# syncBacklog off overrides the global "1", so crews never wait on it and turns that land
# during a review batch into the next call instead of one call per turn.
modelRoles:
  advisor: anthropic/claude-fable-5-1:low
advisor:
  enabled: true
  immuneTurns: 10
  syncBacklog: "off"
# The global providers.anthropic.serverSideFallback sends claude-opus-5-5 as the Fable fallback
# target, which Anthropic rejects with a 400 on every advisor call (2026-09-26); crews turn it off.
providers:
  anthropic:
    serverSideFallback: false
