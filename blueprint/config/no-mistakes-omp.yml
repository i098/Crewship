# omp settings overlay for omp processes the no-mistakes daemon spawns, and only
# those: the daemon's systemd drop-in sets PI_CONFIG_FILES to this file
# (installed as ~/.no-mistakes/omp-config.yml). It layers over
# ~/.omp/agent/config.yml, and no-mistakes' own gate overlay layers over it.
# See docs/omp.md#no-mistakes-pipeline-agent for agent selection and model pinning.
modelRoles:
  default: anthropic/claude-sonnet-5-5:high
  advisor: anthropic/claude-opus-5-5:medium
advisor:
  enabled: true
# Same fix config/omp-crew-overlay.yml carries: with the global
# serverSideFallback on, Anthropic rejects every advisor call with a 400.
providers:
  anthropic:
    serverSideFallback: false
