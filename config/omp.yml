# NO ROUTERS. These ids reach the providers directly through omp's own provider
# clients; nothing sits between omp and the API. Account rotation is native to
# omp - it pools several accounts of the same provider itself - so needing more
# than one account is never a reason to reintroduce a gateway. A router,
# gateway, or gateway-prefixed model id comes back only by explicit operator
# decision. Keep this note in agreement with config/crew-dispatch.json.
# See config/crew-dispatch.json for Firstmate's crewmate selection policy.
modelRoles:
  designer: anthropic/claude-fable-5-1
  smol: anthropic/claude-sonnet-5-5:off
  slow: anthropic/claude-fable-5-1:xhigh
  vision: anthropic/claude-opus-5-5:auto
  plan: anthropic/claude-fable-5-1
  commit: anthropic/claude-haiku-5-5
  tiny: anthropic/claude-haiku-5-5
  advisor: anthropic/claude-opus-5-5:auto
  Kimi: kimi-code/k3
  task: anthropic/claude-opus-5-5:auto
  subagent: anthropic/claude-opus-5-5:auto
  default: anthropic/claude-opus-5-5:high
  memory: anthropic/claude-haiku-5-5
# Off globally on purpose: Firstmate layers config/omp-crew-overlay.yml onto
# omp crewmate and scout launches, which turns the advisor on for crews only:
# fable 5.1 at low thinking, syncBacklog "off" overriding the '1' below so crews
# never wait on it and turns that land during a review batch into the next
# call, interrupting at most once per 10 turns.
advisor:
  enabled: false
  immuneTurns: 4
  syncBacklog: '1'
theme:
  dark: dark-rose-pine
symbolPreset: nerd
defaultThinkingLevel: auto
hideThinkingBlock: true
extendedContext: true
tier:
  openai: priority
autocompleteMaxVisible: 10
steeringMode: one-at-a-time
followUpMode: all
interruptMode: immediate
includeModelInPrompt: false
readLineNumbers: true
omitThinking: true
textVerbosity: low
cycleOrder:
- smol
- default
- slow
- subagent
colorBlindMode: false
statusLine:
  preset: custom
  compactThinkingLevel: true
  leftSegments:
  - path
  - git
  - model
  - mode
  - status
  rightSegments:
  - context_pct
  - token_rate
  - subagents
  - cost
  - time_spent
  segmentOptions:
    model:
      showThinkingLevel: true
    git:
      showBranch: true
  showHookStatus: false
  sessionAccent: false
  separator: powerline
  transparent: true
composer:
  shape: borderless
mnemopi:
  noEmbeddings: true
  llmMode: smol
  polyphonicRecall: true
  enhancedRecall: true
  proactiveLinking: true
memory:
  backend: mnemopi
task:
  maxConcurrency: 128
tui:
  vimMode: true
  vimModeDisplay: icon
retry:
  fallbackChains:
    anthropic/claude-opus-5-5:
    - anthropic/claude-fable-5-1:medium
    anthropic/claude-fable-5-1:
    - anthropic/claude-opus-5
    anthropic/claude-sonnet-5:
    - anthropic/claude-fable-5-1
    - anthropic/claude-opus-5
  maxDelayMs: 60000
