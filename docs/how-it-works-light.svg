<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 570" width="880" height="570" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">How Crewship works</title>
  <desc id="d">You message Firstmate from a phone or laptop. Firstmate hands work to second mates, who lead workers. Each worker runs in its own isolated copy. Workers use model providers and GitHub issues, pull requests and projects. Guards, the crew board and the secrets file are shared on the server. The server can reach your Mac over optional SSH.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8b949e"/></marker>
  </defs>
  <g stroke="#8b949e" stroke-width="2" fill="none">
    <!-- server and shared band -->
    <rect x="20" y="104" width="840" height="300" rx="14"/>
    <rect x="630" y="136" width="210" height="216" rx="10" stroke-dasharray="6 5"/>
    <!-- flow edges -->
    <path d="M300 72V134" marker-end="url(#a)"/>
    <path d="M300 192V226" marker-end="url(#a)"/>
    <path d="M300 284V318" marker-end="url(#a)"/>
    <path d="M250 386L160 438" marker-end="url(#a)"/>
    <path d="M350 386L440 438" marker-end="url(#a)"/>
    <path d="M735 404V468" stroke-dasharray="6 5" marker-end="url(#a)"/>
    <!-- boxes -->
    <rect x="100" y="16" width="400" height="56" rx="8"/>
    <rect x="180" y="136" width="240" height="56" rx="8" stroke="#0969da"/>
    <rect x="180" y="228" width="240" height="56" rx="8" stroke="#0969da"/>
    <rect x="180" y="320" width="240" height="66" rx="8" stroke="#0969da"/>
    <rect x="40" y="440" width="220" height="60" rx="8"/>
    <rect x="340" y="440" width="220" height="60" rx="8"/>
    <rect x="646" y="154" width="178" height="52" rx="8"/>
    <rect x="646" y="216" width="178" height="52" rx="8" stroke-dasharray="6 5"/>
    <rect x="646" y="278" width="178" height="52" rx="8"/>
    <rect x="635" y="470" width="200" height="60" rx="8" stroke-dasharray="6 5"/>
  </g>
  <g fill="#1f2328" font-size="15" font-weight="600" text-anchor="middle">
    <text x="300" y="40">You</text>
    <text x="300" y="160">Firstmate</text>
    <text x="300" y="252">Second mates</text>
    <text x="300" y="344">Workers</text>
    <text x="150" y="465">Model providers</text>
    <text x="450" y="465">GitHub</text>
    <text x="735" y="177">Guards</text>
    <text x="735" y="239">Crew board</text>
    <text x="735" y="301">Secrets file</text>
    <text x="735" y="496">Your Mac</text>
  </g>
  <g fill="#59636e" font-size="12.5" text-anchor="middle">
    <text x="300" y="60">phone or laptop: terminal, iMessage, Discord, Slack</text>
    <text x="300" y="179">plans and splits the work</text>
    <text x="300" y="271">lead groups of workers</text>
    <text x="300" y="363">one per task, each in its own</text>
    <text x="300" y="379">isolated copy</text>
    <text x="150" y="485">any provider</text>
    <text x="450" y="485">issues, pull requests, projects</text>
    <text x="735" y="194">and quality gates</text>
    <text x="735" y="256">optional</text>
    <text x="735" y="318">credentials in one place</text>
    <text x="735" y="516">optional</text>
  </g>
  <g fill="#59636e" font-size="12.5">
    <text x="36" y="124" font-weight="600">Your server</text>
    <text x="646" y="124" font-weight="600">Shared on the server</text>
    <text x="316" y="92" text-anchor="start">message</text>
  </g>
  <g fill="#59636e" font-size="12.5" text-anchor="end">
    <text x="723" y="424">Optional SSH for every agent</text>
    <text x="723" y="440">on the server: open links,</text>
    <text x="723" y="456">drive apps, relay messages</text>
  </g>
  <text x="20" y="556" fill="#59636e" font-size="12.5">Dashed means optional.</text>
</svg>
