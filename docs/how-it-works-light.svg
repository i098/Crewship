<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1070 806" width="1070" height="806" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">How Crewship works</title>
  <desc id="d">You reach Firstmate from a phone or laptop: a terminal over SSH, or iMessage. Everything else runs on your server. The optional iMessage bridge on the server connects to Firstmate; it uses Photon or an optional BlueBubbles relay on your Mac. Discord and Slack run as terminal chat clients in Herdr tabs on the server, used by Firstmate and agents. Firstmate hands work to second mates, who lead workers. Each worker runs in its own isolated copy. Workers use model providers and GitHub issues, pull requests and projects. The guards (some optional), the optional crew board and the secrets file are shared on the server. Optionally, the agents have full control of your Mac over SSH. The secrets file can optionally come from an external Cloudflare Worker and Secrets Store, which a new host fetches it from. The server installs and calls third-party services: Anthropic and OAI npm / pnpm / bun, no-mistakes, Lavish, Sentrux and fallow, and Google Workspace; and, optionally, Tailscale. Model providers, the chat clients, Photon and BlueBubbles appear only in their own boxes.</desc>
