<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 570" width="880" height="570" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">How Crewship works</title>
  <desc id="d">You message Firstmate from a phone or laptop. Firstmate splits the work across optional second mates and workers, one isolated copy per task. Workers use model providers and GitHub issues, pull requests and projects. Guards, the crew board and the secrets file are shared on the server. Every agent on the server can optionally reach your Mac over SSH.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8b949e"/></marker>
  </defs>
  <g stroke="#8b949e" stroke-width="2" fill="none">
    <!-- server and shared band -->
    <rect x="20" y="104" width="840" height="272" rx="14"/>
    <rect x="630" y="136" width="210" height="216" rx="10" stroke-dasharray="6 5"/>
    <!-- flow edges -->
    <path d="M300 72V140" marker-end="url(#a)"/>
    <path d="M260 196L140 240" marker-end="url(#a)"/>
    <path d="M340 196L440 240" marker-end="url(#a)"/>
    <path d="M240 275H320" marker-end="url(#a)" stroke-dasharray="6 5"/>
    <path d="M380 310L200 420" marker-end="url(#a)"/>
    <path d="M440 310V420" marker-end="url(#a)"/>
    <path d="M735 376V468" stroke-dasharray="6 5" marker-end="url(#a)"/>
    <!-- boxes -->
    <rect x="100" y="16" width="400" height="56" rx="8"/>
    <rect x="200" y="140" width="200" height="56" rx="8" stroke="#0969da"/>
    <rect x="40" y="240" width="200" height="70" rx="8" stroke-dasharray="6 5"/>
    <rect x="320" y="240" width="240" height="70" rx="8" stroke="#0969da"/>
    <rect x="40" y="420" width="220" height="60" rx="8"/>
    <rect x="320" y="420" width="240" height="60" rx="8"/>
    <rect x="646" y="170" width="178" height="52" rx="8"/>
    <rect x="646" y="232" width="178" height="52" rx="8" stroke-dasharray="6 5"/>
    <rect x="646" y="294" width="178" height="52" rx="8"/>
    <rect x="635" y="470" width="200" height="60" rx="8" stroke-dasharray="6 5"/>
  </g>
  <g fill="#1f2328" font-size="15" font-weight="600" text-anchor="middle">
    <text x="300" y="40">You</text>
    <text x="300" y="164">Firstmate</text>
    <text x="140" y="264">Second mates</text>
    <text x="440" y="264">Workers</text>
    <text x="150" y="445">Model providers</text>
    <text x="440" y="445">GitHub</text>
    <text x="735" y="193">Guards</text>
    <text x="735" y="255">Crew board</text>
    <text x="735" y="317">Secrets file</text>
    <text x="735" y="496">Your Mac</text>
  </g>
  <g fill="#59636e" font-size="12.5" text-anchor="middle">
    <text x="300" y="60">phone or laptop: terminal, iMessage, Discord, Slack</text>
    <text x="300" y="183">plans and splits the work</text>
    <text x="140" y="284">optional helpers</text>
    <text x="440" y="283">one per task, each in its own</text>
    <text x="440" y="300">isolated copy</text>
    <text x="150" y="465">any provider</text>
    <text x="440" y="465">issues, pull requests, projects</text>
    <text x="735" y="210">and quality gates</text>
    <text x="735" y="272">optional</text>
    <text x="735" y="334">credentials in one place</text>
    <text x="735" y="516">optional</text>
  </g>
  <g fill="#59636e" font-size="12.5">
    <text x="36" y="124" font-weight="600">Your server</text>
    <text x="646" y="156" font-weight="600">Shared on the server</text>
    <text x="316" y="92" text-anchor="start">message</text>
  </g>
  <g fill="#59636e" font-size="12.5" text-anchor="end">
    <text x="723" y="396">Optional SSH for every agent</text>
    <text x="723" y="412">on the server: open links,</text>
    <text x="723" y="428">drive apps, relay messages</text>
  </g>
  <text x="20" y="556" fill="#59636e" font-size="12.5">Dashed means optional.</text>
</svg>
