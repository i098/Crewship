<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 600" width="880" height="600" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">How Crewship works</title>
  <desc id="d">You reach Firstmate from a phone or laptop: a terminal over SSH, or iMessage. Everything else runs on your server. The optional iMessage bridge on the server connects to Firstmate; it uses Photon or an optional BlueBubbles relay on your Mac. Discord and Slack run as terminal chat clients in Herdr tabs on the server, used by Firstmate and agents. Firstmate hands work to second mates, who lead workers. Each worker runs in its own isolated copy. Workers use model providers and GitHub issues, pull requests and projects. Optional guards, the optional crew board and the secrets file are shared on the server. Optionally, the server has full control of your Mac over SSH.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b949e"/></marker>
  </defs>
  <g stroke="#8b949e" stroke-width="2" fill="none">
    <!-- server and shared band -->
    <rect x="20" y="110" width="840" height="330" rx="14"/>
    <rect x="630" y="146" width="210" height="226" rx="10" stroke-dasharray="6 5"/>
    <!-- flow edges -->
    <path d="M240 72V150" marker-end="url(#a)"/>
    <path d="M500 72V150" stroke-dasharray="6 5" marker-end="url(#a)"/>
    <path d="M400 170H372" stroke-dasharray="6 5" marker-end="url(#a)"/>
    <path d="M400 282H391V195H372" marker-start="url(#a)" marker-end="url(#a)"/>
    <path d="M240 206V236" marker-end="url(#a)"/>
    <path d="M240 292V322" marker-end="url(#a)"/>
    <path d="M180 388L150 480" marker-end="url(#a)"/>
    <path d="M300 388L380 480" marker-end="url(#a)"/>
    <path d="M730 440V480" stroke-dasharray="6 5" marker-start="url(#a)" marker-end="url(#a)"/>
    <path d="M630 330H384" marker-end="url(#a)"/>
    <!-- boxes -->
    <rect x="98" y="140" width="284" height="280" rx="10"/>
    <rect x="80" y="16" width="460" height="56" rx="8"/>
    <rect x="110" y="150" width="260" height="56" rx="8" stroke="#4493f8"/>
    <rect x="110" y="236" width="260" height="56" rx="8" stroke="#4493f8"/>
    <rect x="110" y="322" width="260" height="66" rx="8" stroke="#4493f8"/>
    <rect x="400" y="150" width="210" height="78" rx="8" stroke-dasharray="6 5"/>
    <rect x="400" y="250" width="210" height="64" rx="8"/>
    <rect x="40" y="480" width="220" height="60" rx="8"/>
    <rect x="300" y="480" width="220" height="60" rx="8"/>
    <rect x="646" y="164" width="178" height="52" rx="8" stroke-dasharray="6 5"/>
    <rect x="646" y="226" width="178" height="52" rx="8" stroke-dasharray="6 5"/>
    <rect x="646" y="288" width="178" height="52" rx="8"/>
    <rect x="560" y="480" width="300" height="90" rx="8" stroke-dasharray="6 5"/>
  </g>
  <g fill="#e6edf3" font-size="15" font-weight="600" text-anchor="middle">
    <text x="310" y="40">You: phone or laptop</text>
    <text x="240" y="174">Firstmate</text>
    <text x="240" y="260">Second mates</text>
    <text x="240" y="344">Workers</text>
    <text x="505" y="172">iMessage bridge</text>
    <text x="505" y="272">Chat clients</text>
    <text x="150" y="505">Model providers</text>
    <text x="410" y="505">GitHub</text>
    <text x="735" y="187">Guards</text>
    <text x="735" y="249">Crew board</text>
    <text x="735" y="311">Secrets file</text>
    <text x="710" y="502">Your Mac</text>
  </g>
  <g fill="#9198a1" font-size="12.5" text-anchor="middle">
    <text x="310" y="60">terminal over SSH, or iMessage</text>
    <text x="240" y="193">plans and splits the work</text>
    <text x="240" y="279">lead groups of workers</text>
    <text x="240" y="361">one per task, each in its own</text>
    <text x="240" y="377">isolated copy</text>
    <text x="505" y="189">Photon, or BlueBubbles</text>
    <text x="505" y="203">relay on your Mac</text>
    <text x="505" y="217">optional</text>
    <text x="505" y="291">Discord, Slack: terminal tabs</text>
    <text x="505" y="307">used by Firstmate and agents</text>
    <text x="150" y="525">any provider</text>
    <text x="410" y="525">issues, pull requests, projects</text>
    <text x="735" y="204">optional: quality gates</text>
    <text x="735" y="266">optional</text>
    <text x="735" y="328">credentials in one place</text>
    <text x="710" y="521">optional: full control of your Mac</text>
    <text x="710" y="537">from the server: run commands,</text>
    <text x="710" y="553">drive apps, read and send messages</text>
  </g>
  <g fill="#9198a1" font-size="12.5">
    <text x="36" y="130" font-weight="600">Your server</text>
    <text x="646" y="130" font-weight="600">Shared on the server</text>
    <text x="240" y="412" text-anchor="middle" font-weight="600">Herdr panes</text>
    <text x="507" y="322" text-anchor="middle">shared by every agent</text>
    <text x="252" y="102" text-anchor="start">SSH</text>
    <text x="512" y="102" text-anchor="start">iMessage</text>
  </g>
  <text x="20" y="592" fill="#9198a1" font-size="12.5">Dashed means optional.</text>
</svg>
