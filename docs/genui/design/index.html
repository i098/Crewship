<style>

.cl-hd b{padding:3px 10px;border-radius:99px;color:var(--bg);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase}

.tile{position:absolute;z-index:21;display:flex;flex-direction:column;padding:16px 16px 28px;border-radius:22px;background:hsl(240 24% 7% / .95);box-shadow:inset 0 1px 0 hsl(0 0% 100% / .08);transform-origin:0 0;transform:scale(var(--s,1));transition:left .9s var(--spring),top .9s var(--spring),width .9s var(--spring),height .9s var(--spring),transform .9s var(--spring),opacity .5s,filter .6s,background .3s,box-shadow .3s,translate .45s var(--spring);cursor:pointer}

.tile:not(.away):hover .tgrip,.cluster:hover .cgrip,body.sizing .tgrip,body.sizing .cgrip{opacity:1}@media (hover:none){.tile:not(.away) .tgrip,.cluster:not(.away) .cgrip{opacity:.7}}

.txt{max-height:320px;overflow:auto;padding:12px;border-radius:12px;background:hsl(240 30% 2% / .6);font:12px/1.5 var(--font);color:var(--ink);white-space:pre-wrap;word-break:break-word;-webkit-user-select:text;user-select:text}

.ans{display:grid;gap:8px}.ar{display:grid;grid-template-columns:minmax(0,1fr) 45%;gap:10px;align-items:center;font-size:13px}.ar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ar i{height:10px;border-radius:5px;background:linear-gradient(90deg,var(--vio),var(--cyan));transform-origin:left;animation:gx .9s var(--spring) both}

.logp li{display:grid;grid-template-columns:46px 10px 1fr auto;gap:8px;align-items:baseline;padding:7px 4px;font-size:13px;border-radius:8px;animation:qin .6s var(--spring) both}
.logp li.rwd span{text-decoration:line-through;color:var(--dim)}
.rw{padding:2px 9px;border-radius:99px;border:1px solid var(--hair);background:var(--glass);color:var(--ink);font-size:12px}.rw:hover{border-color:var(--cyan)}
.logp li time{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}.logp li i{width:7px;height:7px;border-radius:50%}
/* full view: a card opened large and fully usable */
.full{position:fixed;z-index:7;inset:0;display:grid;place-items:center;padding:4vmin;background:hsl(240 24% 3% / .6);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);opacity:0;pointer-events:none;transition:opacity .35s}
.full.open{opacity:1;pointer-events:auto}
/* the full view is a window: drag it by any empty spot, resize it from the grip in its corner; the preview grows with its height (--fh) */
.fullc{position:relative;display:flex;flex-direction:column;width:min(1200px,100%);max-width:100%;max-height:100%;min-width:320px;min-height:180px;overflow:hidden;padding:22px;border-radius:26px;background:hsl(240 24% 7% / .9);box-shadow:inset 0 1px 1px hsl(0 0% 100% / .15),0 40px 120px -20px hsl(0 0% 0% / .8);transform:scale(.96);transition:transform .45s var(--spring);cursor:grab}
.fullc>.core{flex:1;min-height:0;overflow:auto}
.fullc.mv{cursor:grabbing}.fullc :is(button,input,textarea,a,label,.mw,.media){cursor:auto}.fullc button,.fullc label{cursor:pointer}
.grip{position:absolute;right:8px;bottom:8px;width:22px;height:22px;cursor:nwse-resize;touch-action:none;border-radius:0 0 14px 0;background:linear-gradient(135deg,transparent 45%,var(--mute) 45% 52%,transparent 52% 64%,var(--mute) 64% 71%,transparent 71%);opacity:.6}.grip:hover{opacity:1}
.full.open .fullc{transform:none}
/* full view keeps the preview's ratio: as wide as fits, never taller than the screen allows */
.fullc .core{display:grid}.fullc .mw{width:min(100%,calc(var(--fh,min(72vh,760px)) * var(--r,1.6)));justify-self:center;resize:none}.fullc .viz svg{max-height:60vh}.fullc .term{height:60vh;font-size:14px}.fullc .fork{height:50vh}
/* in full view the window's own ✕ closes; the card's expand and remove buttons would be a second ✕, so they hide */
.fullc>.ib{position:absolute;right:14px;top:21px;z-index:1}.fullc [data-act=full],#fullBody>.hd [data-act=drop]{display:none}.fullc .core>.hd{margin-right:36px}
/* the ask box stays on top of the full view, so you can keep asking about what is open; answers sit under the card */
body.fullon .bottom{z-index:8}body.fullon .full{padding-bottom:calc(4vmin + 130px)}body.fullon .chips{display:none}
.thr{margin-top:14px;padding-top:14px;border-top:1px solid var(--hair);display:flex;flex-direction:column;gap:8px}
a{color:var(--cyan)}
@media (max-width:1100px){.top{flex-wrap:wrap}.line{flex-basis:calc(100% - 50px)}.stats{max-width:none;flex:1 1 auto;min-width:0}}
@media (max-width:640px){.bottom .hint{display:none}.top{flex-wrap:wrap;padding:12px 12px 8px}.stats{max-width:none;flex-basis:100%}.bottom{padding:8px 10px 12px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.draw{stroke-dashoffset:0}}
</style></head>

<div class="top" id="top"><div class="orb"></div><div class="line" id="line"></div><div class="stats" id="stats"></div><button class="st" id="navBtn" aria-label="Navigation: hotkeys or buttons"></button><button class="st logbtn" id="logBtn" aria-controls="logp" aria-expanded="false"><b>log</b><span id="logN"></span></button></div>
<div class="canvas drag boot" id="canvas"><div class="world" id="world"><svg class="ink" id="ink"></svg></div><svg class="links" id="links"><g id="lnL"></g><g id="lbL"></g></svg></div>

 <form class="bar" id="ask"><button class="pen" id="pen" type="button" aria-pressed="false" aria-label="Draw on the board">✎</button><button class="pen" id="attach" type="button" aria-label="Upload images, video, audio or files">＋</button><input type="file" id="file" multiple hidden><button class="pen" id="recenter" type="button" aria-label="Back to what matters">◎</button><button class="pen" id="spread" type="button" aria-pressed="false" aria-label="Spread out all boards">⊞</button><input id="q" autocomplete="off" aria-label="Ask"><button class="go" aria-label="Send">↑</button></form>
 <div class="queue" id="queue" aria-label="Up next"><span class="ql">Up next</span></div>
</div>


<script>
const $ = id => document.getElementById(id);
const PROJ = { swap: ['swapapp', 'hsl(188 95% 58%)'], crew: ['crewship', 'hsl(262 92% 70%)'], bill: ['billing', 'hsl(320 90% 66%)'], all: ['all projects', 'hsl(152 72% 56%)'], plan: ['build plan', 'hsl(38 98% 62%)'], host: ['this host', 'hsl(210 90% 68%)'], me: ['you added', 'hsl(48 96% 60%)'] };
const now = () => performance.now() / 1000;
const S = { tiles: [], swapDb: null, shipDay: 'Fri', pipeStage: 2, sel: new Set(), addAt: null, ink: [], rect: {}, n: 0, tick: 0, shipped: 67, sys: { cpu: [], mem: [], disk: [], net: [] }, logs: {}, clock: 0, log: [], lock: {}, loc: {}, csize: {}, cpos: {}, cord: {}, gIds: {} };
const esc = s => String(s).replace(/[&<>"]/g, c => `&#${c.charCodeAt(0)};`);
const name = t => t.q || t.title || { crew: 'Crew right now', shipped: 'Shipped in 14 days', timeline: 'When things land' }[t.kind] || t.kind;
// the action log keeps everything that happened, timed from when you opened the app
const logA = (text, proj, undo) => S.log.push({ at: now(), text, proj, undo });
// rewind: an action you took keeps a copy of the item it changed (none if it made the item), so you can take it back from the log or with z
const undoOf = id => ({ id, before: tile(id) ? structuredClone(tile(id)) : null, sc: { swapDb: S.swapDb, shipDay: S.shipDay, c1: S.c1 } });
function rewind(e) {
 if (!e || !e.undo || e.rwd) return; e.rwd = true; const { id, before, sc } = e.undo, i = S.tiles.findIndex(t => t.id === id);
 if (before) { const c = structuredClone(before); i >= 0 ? S.tiles[i] = c : S.tiles.push(c); } else if (i >= 0) S.tiles.splice(i, 1);
 Object.assign(S, sc); S.sel.clear(); S.addAt = null; logA('Rewound: ' + e.text, e.proj); busy(600); render();
}
const rewindLast = () => rewind(S.log.findLast(e => e.undo && !e.rwd));
const T = (o) => { S.tiles.push({ boost: 0, ask: 0, done: false, ...o }); logA('New: ' + name(o), o.proj); };
const stage = k => { S.pipeStage = k; logA('#209 moved to ' + stages()[Math.min(k, stages().length - 1)].toLowerCase(), 'swap'); };
// while you hover an option, the cards it changes show that outcome (S.hov), and animate back when you leave
const pv = k => S.hov && k in S.hov ? S.hov[k] : S[k];
const stages = () => { const st = ['Code', 'Build', 'Tests', 'Preview', 'Merge']; if (pv('swapDb') === 'pg') st.splice(3, 0, 'Migrate'); return st; };
const shipAt = () => pv('shipDay') === 'Mon' ? 'Mon 10:00' : pv('swapDb') === 'pg' ? 'Sat 14:00' : 'Fri 14:00';
// ---------- initial world ----------
T({ id: 'd1', kind: 'decision', proj: 'swap', base: 90, need: true, q: 'Store swaps in Postgres or SQLite?', why: 'Blocks the swap feed migration',
  opts: [{ k: 'pg', b: 'Postgres', s: 'Safe at scale · +1 day before ship', rec: true }, { k: 'lite', b: 'SQLite', s: 'Ship today · migrate later (~6 h)' }] });
T({ id: 'c1', kind: 'conflict', proj: 'crew', base: 84, need: true, title: '#212 auth refresh hit a conflict', files: ['auth.ts', 'middleware.ts'] });
T({ id: 'p1', kind: 'pipeline', proj: 'swap', base: 55, title: '#209 swap feed' });
T({ id: 't1', kind: 'timeline', proj: 'all', base: 42, title: 'When things land' });
T({ id: 'k1', kind: 'crew', proj: 'all', base: 34, title: 'Crew right now' });
T({ id: 'sh', kind: 'shipped', proj: 'all', base: 20 });
T({ id: 'pl', kind: 'plan', proj: 'plan', base: 60, need: true, q: 'Plan the build' });
// any media fits in a box: a site, an image, a video, a board
T({ id: 'e1', kind: 'embed', type: 'site', proj: 'swap', base: 50, title: '#209 preview', src: 'mock.html' });
// known media carry their shape, so the first layout already fits and nothing moves when they load
T({ id: 'e2', kind: 'embed', type: 'image', proj: 'plan', base: 25, title: 'Build stack', src: 'media/stack.svg', nat: '640/300' });
T({ id: 'e3', kind: 'embed', type: 'video', proj: 'plan', base: 20, title: 'This board, rounds 3–7', src: 'media/rounds.mp4', nat: '1280/720' });
// a Mermaid diagram the server drew to SVG with mmdr (mermaid-rs-renderer: native Rust, no browser): media/flow.mmd → media/flow.svg
T({ id: 'e5', kind: 'embed', type: 'diagram', proj: 'plan', base: 22, title: 'How it works', src: 'media/flow.svg', nat: '866/276' });
// ---------- renderers ----------
// the cluster header already names the project; only items outside a cluster carry their own label
// ⤢ opens any card large and usable; every card has ✕ to remove it (↶ rewind in the log brings it back)
const hd = (t, flag, cls = '', kpi = '') => `<div class="hd">${t.pin ? `<span class="proj" style="background:${PROJ[t.proj][1]}">${PROJ[t.proj][0]}</span>` : ''}${flag ? `<span class="flag ${cls}">${flag}</span>` : ''}${kpi ? `<span class="kpi">${kpi}</span>` : ''}${t.kind !== 'plan' ? `<button class="ib" data-act="full" data-id="${t.id}" aria-label="Open full view">⤢</button>` : ''}<button class="ib" data-act="drop" data-id="${t.id}" aria-label="Remove">✕</button></div>`;
const K = (v, unit) => `${v}<small>${unit}</small>`;
// things a word would only label are drawn as icons (stroke in the text colour)
const ic = (d, label) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="${label}"><title>${label}</title>${d}</svg>`;
const ICON = {
 image: ic('<rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/>', 'image'),
 video: ic('<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9l5 3-5 3z"/>', 'video'),
 audio: ic('<path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/>', 'audio'),
 site: ic('<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>', 'site'),
 board: ic('<rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/>', 'board'),
 pdf: ic('<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/>', 'pdf'),
 diagram: ic('<rect x="3" y="4" width="6" height="5" rx="1.5"/><rect x="15" y="4" width="6" height="5" rx="1.5"/><rect x="9" y="15" width="6" height="5" rx="1.5"/><path d="M6 9v3h12V9M12 12v3"/>', 'diagram'),
 file: ic('<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/>', 'file')
};
const AR = ['auto', '16/9', '4/3', '1/1', '9/16'];
// auto ratio: take the media's own shape once it loads
function arAuto(m, id) { const t = tile(id), w = m.naturalWidth || m.videoWidth, h = m.naturalHeight || m.videoHeight; if (t && w && h && t.nat !== w + '/' + h) { t.nat = w + '/' + h; render(); } }
// a new ratio grows the preview to its new shape instead of jumping; the card around it is laid out again every frame
function arTween(id, set) {
 const ms = [...document.querySelectorAll(`.mw[data-id="${id}"]`)], from = ms.map(m => m.offsetWidth / m.offsetHeight);
 set(); render();
 const to = ms.map(m => parseFloat(m.style.getPropertyValue('--r'))), els = ms.map(m => m.closest('.tile')).filter(Boolean), t0 = performance.now();
 ms.forEach(m => m._tw = true); els.forEach(e => e.classList.add('tw'));
 const step = () => {
  const e = ease(Math.min(1, (performance.now() - t0) / 500));
  ms.forEach((m, i) => { const a = isFinite(from[i]) ? from[i] : to[i], r = a + (to[i] - a) * e; m.style.aspectRatio = r; m.style.setProperty('--r', r); });
  if (e < 1) { layout(); requestAnimationFrame(step); } else { ms.forEach(m => m._tw = false); els.forEach(e => e.classList.remove('tw')); render(); }
 };
 requestAnimationFrame(step);
}
const R = {
 decision(t) {
  const n = t.opts.length, ys = t.opts.map((_, i) => (i + .5) / n * 100);
  return `${hd(t, t.done ? 'decided' : 'needs you', t.done ? 'g' : '')}<div class="title">${t.q}</div>
  <div class="fork"><svg viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M8 50h0" stroke="hsl(38 98% 62%)" stroke-width="14" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
   ${ys.map((y, i) => { const o = t.opts[i], on = t.pick === o.k, lost = t.done && !on; return `<path class="draw" d="M8 50 C 55 50, 45 ${y}, 100 ${y}" fill="none" stroke="${on ? 'hsl(188 95% 58%)' : lost ? 'hsl(0 0% 100% / .1)' : 'hsl(38 98% 62% / .7)'}" stroke-width="${on ? 3 : 1.6}" vector-effect="non-scaling-stroke" style="animation-delay:${i * .15}s"/>`; }).join('')}</svg>
   <div class="opts">${t.opts.map(o => `<button class="opt ${o.rec && !t.done ? 'rec' : ''} ${t.pick === o.k ? 'chosen' : t.done ? 'lost' : ''}" data-act="pick" data-id="${t.id}" data-k="${o.k}"><b>${o.b}</b></button>`).join('')}</div></div>`;
 },
 conflict(t, full) {
  const wd = full || t._wide;
  const merged = t.done;
  return `${hd(t, merged ? 'merged' : 'needs you', merged ? 'g' : '')}<div class="title">${merged ? '#212 is merged' : t.title}</div>
  <div class="viz"><svg viewBox="0 0 400 130" preserveAspectRatio="xMidYMid meet">
   <path class="draw" d="M10 65 H120 C160 65 160 25 200 25 H${merged ? '300' : '250 C280 25 280 65 294 65'}" fill="none" stroke="hsl(232 12% 64%)" stroke-width="2.5"/>
   <path class="draw" d="M120 65 C160 65 160 105 200 105 H${merged ? '260 C 290 105 290 65 330 65 H390' : '250 C280 105 280 65 294 65'}" fill="none" stroke="hsl(262 92% 70%)" stroke-width="2.5" style="animation-delay:.2s"/>
   ${merged ? '<path class="draw" d="M300 25 C 315 25 315 65 330 65" fill="none" stroke="hsl(232 12% 64%)" stroke-width="2.5"/><circle cx="330" cy="65" r="7" fill="hsl(152 72% 56%)"/><text x="345" y="55" class="m">merged</text>' :
   `<circle cx="314" cy="65" r="18" fill="hsl(38 98% 62% / .15)" stroke="hsl(38 98% 62%)" stroke-width="2"/><text x="314" y="72" text-anchor="middle" style="font-size:20px;font-weight:800;fill:hsl(38 98% 62%)">!</text><text x="342" y="70" class="m" style="fill:hsl(38 98% 62%)">${t.files.length} files</text>`}
   ${[40, 80, 212, 240].map(x => `<circle cx="${x}" cy="${x < 120 ? 65 : 25}" r="4.5" fill="hsl(232 12% 64%)"/>`).join('')}${[212, 240].map(x => `<circle cx="${x}" cy="105" r="4.5" fill="hsl(262 92% 70%)"/>`).join('')}
   <text x="200" y="14" class="m">main</text><text x="200" y="127" class="m">#212</text>
  </svg></div>
  ${merged ? '' : wd ? `<div class="files">${t.files.map(f => `<span class="file">${ICON.file}${f}</span>`).join('')}</div>` : `<div class="files"><span class="file">${ICON.file}${t.files.length} files clash</span></div>`}
  ${merged ? '' : `<div class="acts"><button class="act pri" data-act="merge" data-id="${t.id}" data-k="ai">Keep both</button><button class="act" data-act="merge" data-id="${t.id}" data-k="theirs">Take main</button><button class="act" data-act="merge" data-id="${t.id}" data-k="mine">Keep mine</button></div>`}`;
 },
 pipeline(t, full) {
  const wd = full || t._wide;
  const st = stages();
  const k = Math.min(S.pipeStage, st.length - 1), eta = Math.max(1, (st.length - 1 - k) * 12 + (pv('swapDb') === 'pg' ? 25 : 0) - S.tick % 2 * 6);
  const W = 400, step = (W - 40) / (st.length - 1);
  return `${hd(t, t.done ? 'merged' : '', 'g', t.done ? '' : K('~' + eta, 'min'))}<div class="title">${t.title}: ${t.done ? 'merged' : st[k].toLowerCase()}</div>
  <div class="viz"><svg viewBox="0 0 ${W} 90" preserveAspectRatio="xMidYMid meet">
   <line x1="20" y1="45" x2="${W - 20}" y2="45" stroke="hsl(0 0% 100% / .1)" stroke-width="6" stroke-linecap="round"/>
   <line x1="20" y1="45" x2="${20 + step * k}" y2="45" stroke="url(#pg)" stroke-width="6" stroke-linecap="round" class="draw"/>
   <defs><linearGradient id="pg"><stop offset="0" stop-color="hsl(152 72% 56%)"/><stop offset="1" stop-color="hsl(188 95% 58%)"/></linearGradient></defs>
   ${st.map((s, i) => `<circle cx="${20 + step * i}" cy="45" r="${i === k ? 10 : 7}" fill="${i < k ? 'hsl(152 72% 56%)' : i === k ? 'hsl(188 95% 58%)' : 'hsl(240 20% 14%)'}" stroke="${i > k ? 'hsl(0 0% 100% / .2)' : 'none'}"/>${wd || i === k ? `<text x="${20 + step * i}" y="78" text-anchor="middle" class="${i === k ? '' : 'm'}">${s}</text>` : ''}`).join('')}
  </svg></div>`;
 },
 timeline(t) {
  // one day is one column (25 units): Postgres's migrate day moves the ship from Fri to Sat; waiting for Monday covers it
  const shift = pv('shipDay') === 'Mon' ? 46 : pv('swapDb') === 'pg' ? 25 : 0;
  const rows = [['crewship', 'hsl(262 92% 70%)', 0, 28 + (S.c1 ? -6 : 0)], ['swapapp', 'hsl(188 95% 58%)', 8, 46 + shift], ['billing', 'hsl(320 90% 66%)', 20, 40 + (S.i1fixed === false ? 10 : 0)]];
  const ship = shipAt();
  return `${hd(t)}<div class="title">swapapp ships <span style="color:var(--cyan)">${ship}</span></div>
  <div class="viz"><svg viewBox="0 0 400 150" preserveAspectRatio="xMidYMid meet">
   ${['Wed', 'Thu', 'Fri', 'Sat', 'Mon'].map((d, i) => `<text x="${90 + i * 75}" y="12" class="m">${d}</text><line x1="${90 + i * 75}" y1="18" x2="${90 + i * 75}" y2="140" stroke="hsl(0 0% 100% / .05)"/>`).join('')}
   ${rows.map(([n, c, x, w], i) => `<text x="0" y="${45 + i * 38}" class="m">${n}</text><rect y="${33 + i * 38}" height="16" rx="8" fill="${c}" style="x:${90 + x * 3}px;width:${w * 3}px;transition:x .8s var(--spring),width .8s var(--spring)"/>`).join('')}
   <line x1="${130 + Math.min(70, S.tick * 2)}" y1="18" x2="${130 + Math.min(70, S.tick * 2)}" y2="140" stroke="hsl(188 95% 58%)" stroke-width="1.5"/><text x="${134 + Math.min(70, S.tick * 2)}" y="146" class="m" style="fill:hsl(188 95% 58%)">now</text>
   <text x="0" y="66" text-anchor="end" class="m" style="fill:hsl(188 95% 58%);transform:translateX(${90 + (54 + shift) * 3}px);transition:transform .8s var(--spring)">ships</text>
  </svg></div>`;
 },
 crew(t, full) {
  const c = [['cf-auth', 'hsl(262 92% 70%)'], ['cf-feed', 'hsl(188 95% 58%)'], ['cf-bill', 'hsl(320 90% 66%)'], ['cf-ops', 'hsl(152 72% 56%)']], wd = full || t._wide;
  // a wide box also lists what each agent is doing right now beside the graph
  return `${hd(t, '', '', K(c.length, 'active'))}<div class="title">${t.title}</div><div class="viz"><svg viewBox="0 0 ${wd ? 700 : 300} 200" preserveAspectRatio="xMidYMid meet">
   <circle cx="150" cy="100" r="20" fill="hsl(262 92% 70% / .2)" stroke="hsl(262 92% 70%)"/><text x="150" y="104" text-anchor="middle">you</text>
   ${c.map(([n, col], i) => { const a = i / c.length * 2 * Math.PI - Math.PI / 4, x = 150 + 74 * Math.cos(a), y = 100 + 74 * Math.sin(a); return `<line x1="${150 + 22 * Math.cos(a)}" y1="${100 + 22 * Math.sin(a)}" x2="${x}" y2="${y}" stroke="${col}" stroke-opacity=".4"/><circle cx="${x}" cy="${y}" r="8" fill="${col}"/><text x="${x}" y="${y + (y > 100 ? 24 : -14)}" text-anchor="middle" style="font-size:11px">${n}</text>`; }).join('')}
   ${wd ? c.map(([n, col], i) => `<circle cx="330" cy="${40 + i * 40}" r="5" fill="${col}"/><text x="345" y="${45 + i * 40}">${n}</text><text x="430" y="${45 + i * 40}" class="m">${esc(((S.logs[n] || []).at(-1) || 'idle').replace(/^\S+\s+/, '').slice(0, 30))}</text>`).join('') : ''}
  </svg></div>`;
 },
 incident(t) {
  const fixed = t.done;
  const p = fixed ? 1 : Math.min(.9, (t.att || 1) * .3);
  return `${hd(t, fixed ? 'fixed' : 'claimed · ' + t.claim, fixed ? 'g' : 'c')}<div class="title">${fixed ? 'Refunds test is green again' : t.title}</div>

 const n = near()[0], s = v.replace(/[?.!]+$/, ''), parts = s.replace(/^(should|shall|do|can|would|will)\s+(we|i|you|it)\s+/i, '').split(/,?\s+or\s+/i).map(p => p.trim()).filter(Boolean);
 const yn = /^(should|shall)\s+(we|i)\b/i.test(s), vague = !n && !S.addAt && !ASK.some(a => a[0].test(v));
 if (parts.length < 2 && !yn && !vague) return false;
 const opts = parts.length > 1 ? parts.slice(0, 4).map((p, i) => ({ k: 'o' + i, b: p[0].toUpperCase() + p.slice(1, 40), rec: !i }))
  : yn ? [{ k: 'y', b: 'Yes', rec: true }, { k: 'n', b: 'No' }] : ASK.slice(0, 4).map((a, i) => ({ k: String(i), b: a[1], rec: !i }));
 const t = { id: 'q' + ++S.n, kind: 'decision', proj: n ? n.proj : 'me', base: 95, gen: true, need: true, ai: true, clarify: !(parts.length > 1 || yn), q: vague && !yn && parts.length < 2 ? `Which did you mean by “${s.slice(0, 40)}”?` : v, opts };
 if (S.full) t.of = S.full; else { S.tiles.forEach(x => x.ask = 0); t.ask = now() + 30; focus(); }
 logA('You asked: ' + v, t.proj); T(t); S.sel.clear(); busy(900); render();

}

 if (a) t.pin = { x: a.x + a.w + 24, y: a.y }; else if (S.full) t.of = S.full; else { S.tiles.forEach(x => x.ask = 0); t.ask = now() + 30; focus(); }

}

{

  if (d.size) { const r = fc.getBoundingClientRect(), w = Math.max(320, Math.min(innerWidth - 8 - r.left, d.w + dx)), h = Math.max(180, Math.min($('bottom').getBoundingClientRect().top - 8 - r.top, d.h + dy)); Object.assign(fc.style, { width: w + 'px', height: h + 'px', maxHeight: 'none', translate: `${d.x + (w - d.w) / 2}px ${d.y + (h - d.h) / 2}px` }); fc.style.setProperty('--fh', Math.max(160, h - 170) + 'px'); return; }
  const r = fc.getBoundingClientRect(), [x0, y0] = tr(), bx = r.left - x0, by = r.top - y0, floor = $('bottom').getBoundingClientRect().top - 8;
  fc.style.translate = `${Math.max(60 - bx - r.width, Math.min(innerWidth - 60 - bx, d.x + dx))}px ${Math.max(-by, Math.min(floor - by - r.height, d.y + dy))}px`; });
