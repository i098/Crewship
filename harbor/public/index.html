<html lang="en">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crewship: a reproducible AI-agent coding host</title>
<meta name="description" content="Orchestrate hundreds of agents effortlessly - hardware is the limit.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://crewship.si/">
<meta property="og:title" content="Crewship">
<meta property="og:description" content="Orchestrate hundreds of agents effortlessly - hardware is the limit.">
<meta property="og:image" content="https://crewship.si/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script>
document.documentElement.classList.add("js");
function plainFallback() {
  document.documentElement.classList.remove("js");
  const stage = document.getElementById("stage");
  if (stage) stage.hidden = true;
}
// Only the scene's own errors show the plain page: browser add-ons add failing resources and promises too.
addEventListener("error", (e) => (e.filename || e.target.src || "").endsWith("/harbor.js") && plainFallback(), true);
addEventListener("unhandledrejection", (e) => String(e.reason?.stack).includes("/harbor.js") && plainFallback());
</script>
<link rel="stylesheet" href="harbor.css">
<script type="module" src="harbor.js"></script>
</head>
<body>
<div id="page" class="page">
<header class="top">
  <h1>Crewship</h1>
  <p class="tagline">A reproducible host for AI coding agents.</p>
  <nav aria-label="Project links">
    <a target="_blank" rel="noopener" href="https://github.com/i098/Crewship">GitHub</a>
    <a target="_blank" rel="noopener" href="https://github.com/i098/Crewship/releases">Releases</a>
    <a target="_blank" rel="noopener" href="https://github.com/i098/Crewship#quick-start">Install</a>
  </nav>
</header>
<main>
  <section id="manifest" class="manifest" aria-labelledby="manifest-title">
    <h2 id="manifest-title">Ship's manifest</h2>
    <ul>
<!-- points: harbor/build.py fills this list from README.md and CHANGELOG.md -->
    </ul>
  </section>
</main>
<footer class="foot">
  <p>Crewship is built in the open at <a target="_blank" rel="noopener" href="https://github.com/i098/Crewship">github.com/i098/Crewship</a>. This page draws the scene as text, in your browser.</p>
</footer>
</div>
<section id="stage" class="stage" hidden tabindex="0" role="application" aria-roledescription="3D harbor" aria-label="The ship at the dock, a walkable 3D scene. The feature list before it has the same content.">
  <canvas id="scene" aria-hidden="true"></canvas>
  <div id="card" class="sr-only" aria-live="polite"></div>
  <div id="pad" class="pad" aria-hidden="true"><span></span></div>
</section>
</body>
</html>
