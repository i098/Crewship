[project]
name = "crewship"
version = "1.0.0"
description = "Repeatable Herdr development host provisioning"
requires-python = ">=3.12"
dependencies = [
  "ansible-core==2.21.4",
  "jsonschema==4.26.0",
  "PyYAML==6.0.3",
]

[dependency-groups]
dev = ["pytest==9.0.3", "pytest-xdist==3.8.0", "ruff==0.16.3", "towncrier==26.9.0"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

# Changelog fragments: changelog.d/<issue>.<type>.md, assembled at release time
# by `uv run towncrier build --version X.Y.Z` (CONTRIBUTING.md).
[tool.towncrier]
directory = "changelog.d"
filename = "CHANGELOG.md"
template = "changelog.d/template.md"
start_string = "## [Unreleased]\n"
title_format = "## [{version}] - {project_date}"
issue_format = "[#{issue}](https://github.com/i098/Crewship/issues/{issue})"

# Keep a Changelog sections, in its order.
type = [
  { directory = "added", name = "Added" },
  { directory = "changed", name = "Changed" },
  { directory = "deprecated", name = "Deprecated" },
  { directory = "removed", name = "Removed" },
  { directory = "fixed", name = "Fixed" },
  { directory = "security", name = "Security" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
