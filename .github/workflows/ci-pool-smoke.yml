# Real-job proof for the self-hosted CI pool (docs/ci-pool.md).
#
# Only manual runs are allowed: this public repository must never let a pull
# request from a fork reach the host. Action pins and the read-only token match ci.yml.
name: ci-pool-smoke

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  config-and-python:
    name: configuration and python checks (CI pool)
    runs-on: [self-hosted, crewship]
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install latest uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest
          enable-cache: true

      - name: Sync locked dependencies
        run: uv sync --locked --group dev

      - name: Install latest Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Lint
        run: uv run ruff check .

      - name: Install fakeroot
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends fakeroot

      - name: Python tests
        run: uv run pytest

      - name: herdr-patch tests on Python 3.9
        run: uvx --python 3.9 pytest tests/test_herdr_patch.py

      - name: omp-as-pi tests
        run: bash blueprint/config/omp-as-pi/test.sh

      - name: Validate default configuration
        run: ./ship.sh inspect --config blueprint/config/default.yml

      - name: Validate container configuration
        run: ./ship.sh inspect --config blueprint/containers/crewship.container.yml
