# Real-job proof for the self-hosted runners (docs/runner-up.md, docs/ci-pool.md).
#
# Only manual runs are allowed: this public repository must never let a pull
# request from a fork reach the host. Action pins and the read-only token match ci.yml.
name: ci-pool-smoke

on:
  workflow_dispatch:
    inputs:
      dind_pool:
        description: 'Optional runner-up pool label for a docker: dind entry'
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  config-and-python:
    if: inputs.dind_pool == ''
    name: configuration and python checks (runner-up)
    runs-on: crewship
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check runner write access to the cache parents
        run: test -w /home/runner/.cargo && test -w /home/runner/.cache

      - name: Install latest uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: latest
          enable-cache: true

      - name: Sync locked dependencies
        run: uv sync --locked --group dev

      - name: Install latest Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Lint
        run: uv run ruff check .

      - name: Install fakeroot
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends fakeroot

      - name: Python tests
        run: uv run pytest

      - name: herdr-patch tests on Python 3.9
        run: uvx --python 3.9 pytest tests/test_herdr_patch.py

      - name: omp-as-pi tests
        run: bash blueprint/config/omp-as-pi/test.sh

      - name: Validate default configuration
        run: ./ship.sh inspect --config blueprint/config/default.yml

      - name: Validate container configuration
        run: ./ship.sh inspect --config blueprint/containers/crewship.container.yml

  docker-in-docker:
    if: inputs.dind_pool != ''
    runs-on: ${{ inputs.dind_pool }}
    timeout-minutes: 20
    outputs:
      daemon_id: ${{ steps.smoke.outputs.id }}
      place: ${{ steps.smoke.outputs.place }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build with Buildx and run a Compose service
        id: smoke
        run: |
          test "$RUNNER_ENVIRONMENT" = self-hosted
          [[ "$RUNNER_NAME" =~ ^runner-up-(.+)-[0-9]+$ ]]
          printf 'place=%s\n' "${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          sh tests/runner-up-dind-smoke.sh

  docker-in-docker-isolation:
    needs: docker-in-docker
    runs-on: ${{ inputs.dind_pool }}
    timeout-minutes: 5
    steps:
      - name: Require an independent empty Docker daemon
        env:
          FIRST_DAEMON_ID: ${{ needs.docker-in-docker.outputs.daemon_id }}
          FIRST_PLACE: ${{ needs.docker-in-docker.outputs.place }}
        run: |
          test "$RUNNER_ENVIRONMENT" = self-hosted
          test -n "$FIRST_PLACE"
          [[ "$RUNNER_NAME" =~ ^runner-up-(.+)-[0-9]+$ ]]
          test "${BASH_REMATCH[1]}" = "$FIRST_PLACE"
          daemon=$(docker info --format '{{.ID}}')
          containers=$(docker ps -aq)
          test -n "$FIRST_DAEMON_ID"
          test -n "$daemon"
          test "$daemon" != "$FIRST_DAEMON_ID"
          test -z "$containers"
          printf 'daemon=%s\n' "$daemon"
