# Continuous integration for Crewship.
#
# Runs the repository's real interfaces: locked Python dependency sync, the
# project's own lint/test commands, schema validation of both configuration
# documents through `./ship.sh inspect`, and a full worker image build plus the
# behavior smoke in tests/container-smoke.sh.
#
# Supply chain: least-privilege token, no write permissions anywhere, and every
# third-party action pinned to the commit SHA of its latest release, with the
# tag in a trailing comment (verified 2026-10-01 via the GitHub REST API).
# .github/dependabot.yml moves the pins to each new release weekly.
# uv and Bun are not pinned: like every ./ship.sh launch, CI installs their
# latest releases.
name: ci

on:
  push:
    branches: [main]
  # labeled/unlabeled: the changelog fragment check reads the `no changelog` label.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

# Read-only by default; no job requests more.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: classify changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - name: Checkout PR merge
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Classify changed paths
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          code=true
          if [[ "$EVENT_NAME" == pull_request ]]; then
            code=false
            # Disable rename detection so both the old and new paths count.
            git diff --name-only --no-renames -z HEAD^1 HEAD > "$RUNNER_TEMP/changed-files"
            while IFS= read -r -d '' path; do
              case "$path" in
                skills/*|rules/*|config/*) code=true; break ;;
                README*|docs/*|changelog.d/*|*.md) ;;
                *) code=true; break ;;
              esac
            done < "$RUNNER_TEMP/changed-files"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  changelog:
    name: changelog fragment
    if: >-
      github.event_name == 'pull_request' &&
      !contains(github.event.pull_request.labels.*.name, 'no changelog')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # On a pull request HEAD is the merge commit; HEAD^1 is the base.
          fetch-depth: 2

      - name: Install latest uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: latest
          enable-cache: true

      - name: Changelog fragment
        run: uv run --locked --only-group dev towncrier check --compare-with HEAD^1

  config-and-python:
    name: configuration and python checks
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install latest uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: latest
          enable-cache: true

      - name: Sync locked dependencies
        run: uv sync --locked --group dev

      # Bun tracks its latest release, the same as every ./ship.sh launch.
      - name: Install latest Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Lint
        run: uv run ruff check .

      # tests/test_configuration.py runs koncreet.yml under fakeroot when not root.
      - name: Install fakeroot
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends fakeroot

      - name: Python tests
        run: uv run pytest

      - name: Shared Postgres disposable service smoke
        run: bash tests/shared-postgres-smoke.sh

      # herdr-patch also runs on the operator's computer: macOS ships Python 3.9.
      - name: herdr-patch tests on Python 3.9
        run: uvx --python 3.9 pytest tests/test_herdr_patch.py

      # Offline: a stub omp records the argv omp-as-pi builds.
      - name: omp-as-pi tests
        run: bash config/omp-as-pi/test.sh

      - name: Validate default configuration
        run: ./ship.sh inspect --config config/default.yml

      - name: Validate container configuration
        run: ./ship.sh inspect --config containers/crewship.container.yml

  # crewboard/ is a Rust crate; its Cargo.lock stays locked like uv.lock.
  # Rust tracks its latest stable release through the runner's rustup.
  crewboard:
    name: crewboard rust checks
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: crewboard
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install latest stable Rust
        run: rustup toolchain install stable --profile minimal --component clippy && rustup default stable

      - name: Build
        run: cargo build --locked

      - name: Test
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  # harbor/ (crewship.si) as an iPhone in WebKit: harbor/webkit-check.mjs fails on a crash,
  # an uncaught error, or text drawn in a way that grows iOS Safari until it kills the tab.
  # harbor/chromium-check.mjs loads it in desktop Chromium in a large DPR 2 window and fails on
  # the plain-page fallback, a black canvas after 3 s, or a console error.
  # Playwright tracks its latest release, like the other tools.
  harbor-webkit:
    name: harbor webkit iphone check
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the page
        run: python3 harbor/build.py

      - name: Install Playwright WebKit and Chromium
        working-directory: harbor
        run: npm install --no-save --no-package-lock --prefix . playwright && npx playwright install --with-deps webkit chromium

      - name: WebKit iPhone check
        run: node harbor/webkit-check.mjs

      - name: Chromium desktop high-DPR check
        run: node harbor/chromium-check.mjs

  # The repository's own quality gate (docs/omp.md#quality-gate): the same
  # blocking rule the omp extension applies at turn end, against the committed
  # .sentrux/baseline.json, plus fallow audit on the changed files as a warning.
  quality-gate:
    name: quality gate
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install latest Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      # The recipe's own verified installer; the sentrux binary links GTK 3.
      - name: Install the latest sentrux and fallow
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libgtk-3-0t64
          python3 scripts/provisions.py --home "$HOME" --tools sentrux,fallow
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: sentrux gate
        run: bun config/omp-quality-gate.ts

      - name: fallow audit (advisory)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          fallow audit --changed-since "origin/${BASE_REF}" ||
            echo "::warning title=fallow audit::the changed JS/TS has findings (advisory, see the log)"

  container-smoke:
    name: worker image behavior smoke
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      DOCKER_BUILDKIT: "1"
      COMPOSE_DOCKER_CLI_BUILD: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Smoke script syntax
        run: bash -n tests/container-smoke.sh

      - name: Audit image bases in the Dockerfile
        run: |
          set -euo pipefail
          python3 - Dockerfile <<'PY'
          import re
          import sys

          text = open(sys.argv[1], encoding="utf-8").read()
          args = dict(re.findall(r"^ARG\s+([A-Za-z_][A-Za-z0-9_]*)=(\S+)", text, re.M))

          def expand(ref):
              return re.sub(r"\$\{([A-Za-z_][A-Za-z0-9_]*)\}", lambda m: args.get(m.group(1), ""), ref)

          stages, problems = set(), []
          for line in text.splitlines():
              match = re.match(r"^FROM\s+(?:--platform=\S+\s+)?(\S+)(?:\s+[Aa][Ss]\s+(\S+))?", line)
              if not match:
                  continue
              ref, alias = expand(match.group(1)), match.group(2)
              # The base tracks the newest Ubuntu LTS from mirror.gcr.io (no pull limit).
              if ref not in stages and ref != "mirror.gcr.io/library/ubuntu:latest":
                  problems.append(f"FROM {ref} is neither a previous stage nor mirror.gcr.io/library/ubuntu:latest")
              if alias:
                  stages.add(alias)

          if not stages:
              problems.append("no build stage found; the audit would pass vacuously")
          if problems:
              print("Dockerfile audit failed:")
              for problem in problems:
                  print(f"  - {problem}")
              raise SystemExit(1)

          print("Dockerfile audit passed for stages: " + ", ".join(sorted(stages)))
          PY

      - name: Audit the devcontainer definition
        run: |
          set -euo pipefail
          python3 - .devcontainer/devcontainer.json <<'PY'
          import json
          import sys

          raw = open(sys.argv[1], encoding="utf-8").read()

          # devcontainer.json is JSONC: drop comments that are not inside strings.
          out, index, in_string = [], 0, False
          while index < len(raw):
              char = raw[index]
              if in_string:
                  out.append(char)
                  if char == "\\" and index + 1 < len(raw):
                      out.append(raw[index + 1])
                      index += 2
                      continue
                  in_string = char != '"'
                  index += 1
                  continue
              if char == '"':
                  in_string = True
                  out.append(char)
                  index += 1
                  continue
              if raw.startswith("//", index):
                  while index < len(raw) and raw[index] != "\n":
                      index += 1
                  continue
              if raw.startswith("/*", index):
                  end = raw.find("*/", index + 2)
                  index = len(raw) if end < 0 else end + 2
                  continue
              out.append(char)
              index += 1

          doc = json.loads("".join(out))
          problems = []

          if doc.get("build", {}).get("target") != "worker":
              problems.append("build.target must be the worker stage")
          for key in ("containerUser", "remoteUser"):
              if doc.get(key) in (None, "root"):
                  problems.append(f"{key} must name the non-root Crewship account")

          run_args = doc.get("runArgs", [])
          forbidden = ("--privileged", "--pid=host", "--network=host", "--ipc=host", "--userns=host")
          for arg in run_args:
              if arg in forbidden or arg.startswith(("--volume", "-v", "--device", "--mount")):
                  problems.append(f"runArgs entry {arg!r} breaks the container boundary")
          for cap in ("--memory=", "--cpus=", "--pids-limit="):
              if not any(arg.startswith(cap) for arg in run_args):
                  problems.append(f"runArgs is missing a {cap.rstrip('=')} cap")

          for mount in doc.get("mounts", []):
              problems.append(f"unexpected extra mount {mount!r}")

          workspace_mount = doc.get("workspaceMount", "")
          if "type=volume" not in workspace_mount or "type=bind" in workspace_mount or "${localWorkspaceFolder}" in workspace_mount:
              problems.append("workspaceMount must be a named volume, not a host checkout bind")

          if problems:
              print("devcontainer audit failed:")
              for problem in problems:
                  print(f"  - {problem}")
              raise SystemExit(1)

          print(f"devcontainer audit passed: {doc.get('name')!r} -> {doc['build']['target']} stage")
          PY

      - name: Create throwaway compose secret
        run: |
          set -euo pipefail
          secret_dir="$RUNNER_TEMP/crewship-secrets"
          install -d -m 700 "$secret_dir"
          echo "CREWSHIP_SECRET_DIR=$secret_dir" >> "$GITHUB_ENV"
          umask 077
          openssl rand -base64 32 | tr -d '\n' > "$secret_dir/postgres_password"

      - name: Render and audit compose definitions
        run: |
          set -euo pipefail
          docker compose --profile worker --profile data config --format json > /tmp/compose-rendered.json
          python3 - /tmp/compose-rendered.json <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as fh:
              doc = json.load(fh)

          problems = []
          for name, svc in sorted(doc.get("services", {}).items()):
              if svc.get("privileged"):
                  problems.append(f"{name}: privileged container")
              if svc.get("network_mode") == "host":
                  problems.append(f"{name}: host network namespace")
              if svc.get("pid") == "host":
                  problems.append(f"{name}: host PID namespace")
              if svc.get("ipc") == "host":
                  problems.append(f"{name}: host IPC namespace")
              if not svc.get("build") and "@sha256:" not in str(svc.get("image", "")):
                  problems.append(f"{name}: image is not digest-pinned ({svc.get('image')!r})")

              for volume in svc.get("volumes", []):
                  if isinstance(volume, dict):
                      vtype, source = volume.get("type"), str(volume.get("source", ""))
                  else:
                      parts = str(volume).split(":")
                      vtype = "bind" if parts[0].startswith(("/", ".", "~")) else "volume"
                      source = parts[0]
                  if vtype == "bind":
                      problems.append(f"{name}: host bind mount {source}")
                  if "docker.sock" in source:
                      problems.append(f"{name}: docker socket mount {source}")

              for port in svc.get("ports", []):
                  host_ip = port.get("host_ip") if isinstance(port, dict) else None
                  if host_ip not in ("127.0.0.1", "::1"):
                      problems.append(f"{name}: port published on {host_ip or 'all interfaces'}")

              limits = {
                  "mem_limit": svc.get("mem_limit"),
                  "cpus": svc.get("cpus") or svc.get("deploy", {}).get("resources", {}).get("limits", {}).get("cpus"),
                  "pids_limit": svc.get("pids_limit"),
              }
              missing = [key for key, value in limits.items() if not value]
              if missing:
                  problems.append(f"{name}: missing resource caps {missing}")

          for secret_name, secret in sorted(doc.get("secrets", {}).items()):
              if "environment" in secret:
                  problems.append(f"secret {secret_name}: sourced from the environment, expected a file")

          if problems:
              print("compose audit failed:")
              for problem in problems:
                  print(f"  - {problem}")
              raise SystemExit(1)

          print(f"compose audit passed for {len(doc.get('services', {}))} service(s)")
          PY

      # The job's read-only GITHUB_TOKEN authenticates the latest-herdr lookup:
      # shared runner IPs exhaust the unauthenticated API budget. It enters
      # builds only as a BuildKit secret.
      - name: Build worker image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: docker build --secret id=github_token,env=GITHUB_TOKEN --target worker --tag crewship/worker:ci .

      - name: Behavior smoke in the worker image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CF_SMOKE_MEMORY: 6g
          CF_SMOKE_CPUS: 2
          CF_SMOKE_TIMEOUT: "2700"
        run: tests/container-smoke.sh

      - name: Remove throwaway secret and images
        if: always()
        run: |
          rm -rf "${RUNNER_TEMP:?}/crewship-secrets"
          docker image rm -f crewship/worker:ci >/dev/null 2>&1 || true
