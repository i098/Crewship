# Builds site/ (the crewship.si landing page) from the repository and deploys it to
# Cloudflare Workers static assets, on every push to main and on each published
# release, so the page follows Crewship as it changes.
#
# Each run is a GitHub deployment in the crewship.si environment, with
# https://crewship.si as its URL. The environment accepts only main and v* release tags and
# holds the deploy token, which can edit the one crewship Worker. Never runs on
# pull requests.
#
# The action is pinned to the commit SHA of its latest release, with the tag in a
# trailing comment (verified 2026-10-09 via the GitHub REST API). wrangler is not
# pinned: like every ./ship.sh launch, it is the latest. It needs Node 22 or
# later, which the ubuntu-24.04 runner image ships.
name: harbor

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harbor

jobs:
  deploy:
    name: deploy crewship.si
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: crewship.si
      url: https://crewship.si
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the page from README.md and CHANGELOG.md
        run: python3 site/build.py

      - name: Deploy
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy
