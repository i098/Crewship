# Keeps the sponsor list in the README Sponsors section up to date.
#
# Daily, it reads the public GitHub Sponsors of i098 and writes them between
# the <!-- sponsors --> markers in README.md with scripts/sponsors.py. When
# that changes README.md, it opens or updates one pull request on the
# docs/sponsor-list branch; an unchanged list opens no pull request.
#
# Token: the default GITHUB_TOKEN reads the public sponsorships of a named
# user (user(login:), not viewer). The Sponsors API is GraphQL only.
# To open the pull request, the repository setting "Allow GitHub Actions to
# create and approve pull requests" is on (since 2026-10-09); the default
# workflow permissions stay read-only.
#
# Required checks: a pull request opened with GITHUB_TOKEN starts no
# workflows, so the last step starts ci.yml on the branch with
# workflow_dispatch (the one event GITHUB_TOKEN may trigger). Its jobs report
# the required checks on the branch head; the pull-request-only quality gate
# reports as skipped.
#
# Every action is pinned to the commit SHA of its latest release (verified
# 2026-10-09 via the GitHub REST API); .github/dependabot.yml moves the pins.
name: sponsors

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  sponsor-list:
    name: update the sponsor list
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # push the docs/sponsor-list branch
      pull-requests: write # open or update its pull request
      actions: write # start ci.yml on that branch
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Write the sponsors into README.md
        env:
          GH_TOKEN: ${{ github.token }}
        # ponytail: first 100 sponsors only; paginate when there are more.
        run: |
          gh api graphql -f query='
            query {
              user(login: "i098") {
                sponsorshipsAsMaintainer(first: 100, activeOnly: true,
                    orderBy: {field: CREATED_AT, direction: ASC}) {
                  nodes { sponsorEntity { ... on User { login } ... on Organization { login } } }
                }
              }
            }' | python3 scripts/sponsors.py README.md

      - name: Open or update the pull request
        id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: docs/sponsor-list
          delete-branch: true
          sign-commits: true
          commit-message: "docs(readme): update the sponsor list"
          title: "docs(readme): update the sponsor list"
          body: The daily `sponsors` workflow found a change in the GitHub Sponsors of i098.

      - name: Start the required checks on the branch
        if: steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref docs/sponsor-list
