# Attaches the install artifact to a DRAFT release, started by hand with its tag.
#
# Releases here are immutable: once a release is published, no asset can be added, so the
# artifact has to be on the draft before it is published (CONTRIBUTING.md, "Changelog and
# releases"). There is no `published` trigger for that reason. --clobber lets a failed
# run be re-driven.
#
# The job checks out the workflow's own ref (it has the build script, which an old tag
# lacks) with all tags; the script archives the tag.
#
# See docs/install.md for archive verification and installation behavior.
# Action pins match npm-publish.yml.
name: release-artifact

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag (vX.Y.Z or vX.Y.Z-rc.N) of the draft release
        required: true
        type: string
      stable:
        description: Prepare a stable release only with the owner's explicit approval
        required: false
        default: false
        type: boolean

permissions: {}

jobs:
  artifact:
    name: attach the install artifact
    if: startsWith(inputs.tag, 'v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Check the release channel and draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          STABLE: ${{ inputs.stable }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "::error title=release tag::$TAG is not vX.Y.Z or vX.Y.Z-rc.N"
            exit 1
          fi
          prerelease=false
          [[ "$TAG" != *-* ]] || prerelease=true
          if [[ "$prerelease" == "$STABLE" ]]; then
            echo "::error title=release channel::Stable tags require stable=true and owner approval; prerelease tags require stable=false"
            exit 1
          fi
          draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
          if [ "$draft" != true ]; then
            echo "::error title=release not a draft::$TAG is already published and releases are immutable; create the release as a draft, run this workflow, then publish it"
            exit 1
          fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease="$prerelease" --latest="$STABLE"

      - name: Build the artifact and its checksum
        env:
          TAG: ${{ inputs.tag }}
        run: |
          scripts/build-release-artifact.sh "$TAG" dist
          git show "$TAG:scripts/install.sh" > dist/install.sh
          (cd dist && sha256sum install.sh > install.sh.sha256)

      - name: Attach to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
