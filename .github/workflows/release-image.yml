# Publishes the worker image to the GitHub Container Registry on each release.
#
# Each release pushes its exact version tag. Only stable releases also push
# :latest. The org.opencontainers.image.source label links the package here.
# The build job runs installers with a read-only token and hands the image to
# the push job as an artifact; only the push job holds packages: write. The
# push job runs in the `ghcr` environment, so Deployments lists each push.
# A pull request that changes this file runs the build job alone.
# The action pins match ci.yml where shared; .github/dependabot.yml moves them.
name: release-image

on:
  release:
    types: [published]
  pull_request:
    paths: [.github/workflows/release-image.yml]

permissions: {}

jobs:
  build:
    name: build worker image
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A pull request checks the tag rule against a placeholder release tag.
      - name: Build worker image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || 'v0.0.0' }}
          PRERELEASE: ${{ github.event.release.prerelease || false }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?)$ ]]; then
            echo "::error title=release tag::$TAG is not vX.Y.Z or vX.Y.Z-rc.N"
            exit 1
          fi
          version=${BASH_REMATCH[1]}
          prerelease=false
          [[ "$version" != *-* ]] || prerelease=true
          if [[ "$prerelease" != "$PRERELEASE" ]]; then
            echo "::error title=release channel::The tag and GitHub prerelease flag must match"
            exit 1
          fi
          image=ghcr.io/i098/crewship
          docker build --secret id=github_token,env=GITHUB_TOKEN --target worker \
            --tag "$image:$version" .
          images=("$image:$version")
          if [[ "$PRERELEASE" == false ]]; then
            docker tag "$image:$version" "$image:latest"
            images+=("$image:latest")
          fi
          docker save "${images[@]}" | gzip > worker-image.tar.gz

      - name: Upload worker image
        if: github.event_name == 'release'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: worker-image
          path: worker-image.tar.gz
          compression-level: 0
          retention-days: 1

  push:
    name: push worker image
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: ghcr
      url: https://github.com/i098/Crewship/pkgs/container/crewship
    permissions:
      packages: write
    steps:
      - name: Download worker image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: worker-image

      - name: Push to the GitHub Container Registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          docker load < worker-image.tar.gz
          docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<<"$GITHUB_TOKEN"
          docker push --all-tags ghcr.io/i098/crewship
