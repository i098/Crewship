<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bridge mock</title>
<style>
@font-face{font-family:Geist;src:url(fonts/geist-sans.woff2) format("woff2");font-weight:100 900}
@font-face{font-family:GeistMono;src:url(fonts/geist-mono.woff2) format("woff2");font-weight:100 900}
:root{--bg:hsl(240 24% 4%);--ink:hsl(230 30% 96%);--mute:hsl(232 12% 62%);--dim:hsl(232 10% 42%);--glass:hsl(240 30% 100% / .045);--glass2:hsl(240 30% 100% / .075);--hair:hsl(240 40% 100% / .09);--vio:hsl(262 92% 70%);--cyan:hsl(188 95% 58%);--pink:hsl(320 90% 66%);--ok:hsl(152 72% 56%);--amber:hsl(38 98% 62%);--red:hsl(0 90% 68%);--spring:cubic-bezier(.32,.72,0,1);--pop:cubic-bezier(.34,1.56,.64,1)}
*{box-sizing:border-box;margin:0}
body{font:14px/1.45 Geist,system-ui,sans-serif;color:var(--ink);background:var(--bg);height:100vh;overflow:hidden;letter-spacing:-.005em}
/* aurora */
.aurora{position:fixed;inset:-20%;z-index:0;pointer-events:none;filter:blur(70px);opacity:.75}
.aurora i{position:absolute;border-radius:50%;width:46vmax;height:46vmax;mix-blend-mode:screen;animation:drift 18s var(--spring) infinite alternate}
.aurora i:nth-child(1){background:radial-gradient(circle,hsl(262 90% 55% / .55),transparent 65%);left:5%;top:0}
.aurora i:nth-child(2){background:radial-gradient(circle,hsl(188 95% 45% / .40),transparent 65%);right:0;top:30%;animation-duration:22s;animation-delay:-6s}
.aurora i:nth-child(3){background:radial-gradient(circle,hsl(320 90% 55% / .28),transparent 65%);left:35%;bottom:-10%;animation-duration:26s;animation-delay:-12s}
@keyframes drift{to{transform:translate(8vmax,-6vmax) scale(1.15)}}
.grid-bg{position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(hsl(0 0% 100% / .025) 1px,transparent 1px),linear-gradient(90deg,hsl(0 0% 100% / .025) 1px,transparent 1px);background-size:44px 44px;mask-image:radial-gradient(ellipse at 50% 30%,hsl(0 0% 0%),transparent 75%)}
.app{position:relative;z-index:1;display:grid;height:100vh;grid-template-columns:290px minmax(0,1fr) 310px;grid-template-rows:64px minmax(0,1fr);gap:0}
/* header island */
header{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:0 20px}
.orb{width:30px;height:30px;border-radius:50%;background:conic-gradient(from 0deg,var(--vio),var(--cyan),var(--pink),var(--vio));animation:spin 6s linear infinite;box-shadow:0 0 24px hsl(262 92% 70% / .55);position:relative}
.orb::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--bg)}
.thinking .orb{animation-duration:1.1s;box-shadow:0 0 34px hsl(188 95% 58% / .8)}
@keyframes spin{to{transform:rotate(1turn)}}
.brand{font-weight:650;font-size:16px;letter-spacing:-.02em}
.sp{flex:1}
.pill{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 8px;border-radius:99px;background:var(--glass);border:1px solid var(--hair);font-size:12px;color:var(--mute);backdrop-filter:blur(18px)}
.live{display:none;color:var(--ink)}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 0 0 hsl(188 95% 58% / .6);animation:ping 1.4s var(--spring) infinite}
@keyframes ping{to{box-shadow:0 0 0 9px hsl(188 95% 58% / 0)}}
/* thread */
.thread{padding:8px 16px 18px;display:flex;flex-direction:column;gap:10px;min-height:0}
.msgs{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:10px;overflow:hidden;mask-image:linear-gradient(transparent,hsl(0 0% 0%) 18%)}
.me{align-self:flex-end;background:linear-gradient(135deg,hsl(262 80% 58%),hsl(230 85% 58%));padding:9px 13px;border-radius:16px 16px 5px 16px;max-width:88%;box-shadow:0 10px 30px -12px hsl(262 90% 60% / .7);animation:rise .6s var(--spring) both}
.ai{display:flex;gap:8px;align-items:flex-start;color:var(--mute);font-size:13px;animation:rise .6s var(--spring) both}
.ai .dot{flex:none;margin-top:3px;width:14px;height:14px;border-radius:50%;background:conic-gradient(var(--vio),var(--cyan),var(--vio))}
.ai b{color:var(--ink);font-weight:600}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.97);filter:blur(4px)}}
.composer{display:flex;align-items:center;gap:10px;padding:6px 6px 6px 16px;border-radius:99px;background:var(--glass2);border:1px solid var(--hair);backdrop-filter:blur(20px);color:var(--dim);font-size:13.5px;min-height:46px;box-shadow:inset 0 1px 0 hsl(0 0% 100% / .06)}
.composer .txt{flex:1;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.composer .txt:empty::before{content:"Ask anything…";color:var(--dim)}
.caret{display:inline-block;width:1.5px;height:15px;background:var(--cyan);vertical-align:-2px;margin-left:1px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.send{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--vio),var(--cyan));color:var(--bg);font-weight:800}
.c-main{display:none}
/* stage */
.stage{padding:8px 24px 18px;display:flex;flex-direction:column;gap:16px;min-width:0;min-height:0}
.eyebrow{font:500 10.5px GeistMono,monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--cyan)}
.q{font-size:clamp(21px,2.3vw,34px);font-weight:600;letter-spacing:-.035em;line-height:1.12;min-height:28px}
/* only the view may shrink; a long question pushes the picker down instead of running over it */
.stage>*{flex-shrink:0}.stage>.view{flex-shrink:1}
.wide{grid-column:1/-1}
.core.spark{flex-direction:row;gap:22px;align-items:center}
.spark svg{flex:1;height:96px;min-width:0}
.spark path.l{fill:none;stroke:url(#lg);stroke-width:2.5;stroke-dasharray:900;stroke-dashoffset:900;animation:draw 1.8s var(--spring) .9s forwards}
.spark path.a{fill:url(#ag);opacity:0;animation:fade 1s ease-out 1.6s forwards}
.spark circle{fill:var(--cyan);filter:drop-shadow(0 0 6px var(--cyan));opacity:0;animation:popin .5s var(--pop) 2.4s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{to{opacity:.9}}
.stat b{display:block;font-size:30px;font-weight:650;letter-spacing:-.04em}
.spark .stat{flex:none}
.q.in{animation:rise .7s var(--spring) both}
.picker{position:relative;display:inline-flex;align-self:flex-start;padding:4px;border-radius:99px;background:var(--glass);border:1px solid var(--hair);font-size:12.5px}
.picker span{position:relative;z-index:1;padding:6px 14px;color:var(--mute);transition:color .3s}
.picker span.on{color:var(--bg);font-weight:600}
.ind{position:absolute;z-index:0;top:4px;bottom:4px;border-radius:99px;background:linear-gradient(135deg,var(--vio),var(--cyan));transition:left .22s var(--spring),width .22s var(--spring);box-shadow:0 0 22px hsl(262 92% 70% / .6)}
.picker.lock .ind{animation:lockflash .7s var(--spring)}
@keyframes lockflash{40%{box-shadow:0 0 0 6px hsl(188 95% 58% / .25),0 0 40px hsl(188 95% 58% / .9)}}
.why{font:12px GeistMono,monospace;color:var(--dim);margin-left:10px;align-self:center}
.toprow{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.view{position:relative;flex:1;min-height:0;overflow:hidden;padding:4px;margin:-4px;mask-image:linear-gradient(hsl(0 0% 0%) 88%,transparent)}
.view.out>*{animation:out .45s var(--spring) both}
@keyframes out{to{opacity:0;transform:translateY(-10px) scale(.96);filter:blur(8px)}}
/* glass card, double bezel */
.shell{padding:5px;border-radius:22px;background:hsl(0 0% 100% / .03);border:1px solid var(--hair);animation:card .8s var(--pop) both;animation-delay:calc(var(--i,0) * 110ms)}
.core{border-radius:17px;background:linear-gradient(180deg,hsl(240 30% 100% / .07),hsl(240 30% 100% / .025));box-shadow:inset 0 1px 0 hsl(0 0% 100% / .08);padding:14px;display:flex;flex-direction:column;gap:10px;height:100%}
@keyframes card{from{opacity:0;transform:translateY(26px) scale(.92) rotate(-1.2deg);filter:blur(10px)}}
.board{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:12px}
.h{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.h .n{color:var(--mute);font-weight:400}
.conf .core{background:linear-gradient(180deg,hsl(38 98% 62% / .14),hsl(38 98% 62% / .03))}
.conf{border-color:hsl(38 98% 62% / .35);animation:card .8s var(--pop) both,glow 2.4s ease-in-out 1s infinite}
@keyframes glow{50%{box-shadow:0 0 34px -6px hsl(38 98% 62% / .55)}}
.meta{font-size:12px;color:var(--mute)}
.diff{font:12px/1.65 GeistMono,monospace;border-radius:10px;background:hsl(240 30% 2% / .55);padding:8px 10px;overflow:hidden;white-space:nowrap}
.diff div{overflow:hidden;width:0;animation:type .9s steps(26) forwards}
.diff div:nth-child(2){animation-delay:.5s}
@keyframes type{to{width:100%}}
.m{color:var(--red)}.p{color:var(--ok)}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.btn{font:600 12px Geist;padding:7px 12px;border-radius:99px;background:var(--glass2);border:1px solid var(--hair)}
.btn.pri{background:linear-gradient(135deg,var(--vio),var(--cyan));color:var(--bg);border:0;position:relative;overflow:hidden}
.btn.pri::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,hsl(0 0% 100% / .55) 50%,transparent 70%);transform:translateX(-120%);animation:sheen 2.6s 1.4s infinite}
@keyframes sheen{40%,100%{transform:translateX(120%)}}
.checks{display:flex;flex-wrap:wrap;gap:5px}
.ck{font:600 11px GeistMono,monospace;padding:3px 8px;border-radius:99px;background:hsl(152 72% 56% / .14);color:var(--ok);animation:popin .5s var(--pop) both;animation-delay:calc(.6s + var(--j,0) * 180ms)}
.ck.run{background:hsl(188 95% 58% / .14);color:var(--cyan)}
@keyframes popin{from{opacity:0;transform:scale(.4)}}
.bar{height:6px;border-radius:9px;background:hsl(0 0% 100% / .07);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--ok),var(--cyan));transform-origin:left;animation:grow 1.3s var(--spring) .7s both}
@keyframes grow{from{transform:scaleX(0)}}
.next{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.next span{font-size:12.5px;padding:7px 13px;border-radius:99px;border:1px solid var(--hair);background:var(--glass);color:var(--mute);animation:rise .6s var(--spring) both;animation-delay:calc(1s + var(--i) * 120ms)}
/* timeline view */
.tl .core{gap:14px}
.big{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.big b{font-size:34px;font-weight:650;letter-spacing:-.04em;background:linear-gradient(90deg,var(--ink),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
.rows{position:relative;display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px 14px;align-items:center;font-size:13px}
.track{position:relative;height:18px;border-radius:9px;background:hsl(0 0% 100% / .05)}
.track i{position:absolute;top:0;bottom:0;border-radius:9px;transform-origin:left;animation:grow 1s var(--spring) both;animation-delay:calc(.4s + var(--i) * 160ms)}
.ms{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;background:var(--pink);transform:rotate(45deg) scale(0);border-radius:3px;box-shadow:0 0 18px var(--pink);animation:ms .6s var(--pop) 1.6s forwards}
@keyframes ms{to{transform:rotate(45deg) scale(1)}}
.today{position:absolute;top:-6px;bottom:-6px;width:1.5px;background:var(--cyan);box-shadow:0 0 12px var(--cyan);left:0;animation:sweep 1.6s var(--spring) .3s forwards}
@keyframes sweep{to{left:34%}}
.days{display:flex;justify-content:space-between;font:11px GeistMono,monospace;color:var(--dim)}
/* skeleton */
.skel{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:12px}
.skel div{height:150px;border-radius:20px;background:linear-gradient(100deg,hsl(0 0% 100% / .03) 30%,hsl(0 0% 100% / .09) 50%,hsl(0 0% 100% / .03) 70%);background-size:300% 100%;animation:shim 1s linear infinite}
@keyframes shim{from{background-position:100% 0}to{background-position:0 0}}
/* rail */
.rail{padding:8px 18px 18px;display:flex;flex-direction:column;gap:12px;min-height:0}
.rail h3,.crewh{font:500 10.5px GeistMono,monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.steps{display:flex;flex-direction:column;gap:4px;position:relative}
.step{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:14px;font-size:13px;animation:slide .55s var(--spring) both}
.step.now{background:var(--glass);border:1px solid var(--hair)}
@keyframes slide{from{opacity:0;transform:translateX(18px)}}
.step small{display:block;color:var(--dim);font:11px GeistMono,monospace;margin-top:1px}
.ic{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;margin-top:1px}
.now .ic{background:conic-gradient(var(--cyan) var(--pct,30%),hsl(0 0% 100% / .08) 0);animation:spin 1s linear infinite;-webkit-mask:radial-gradient(circle,transparent 5.5px,hsl(0 0% 0%) 6px);mask:radial-gradient(circle,transparent 5.5px,hsl(0 0% 0%) 6px)}
.ok .ic{background:hsl(152 72% 56% / .16);color:var(--ok);animation:popin .45s var(--pop) both}
.crew{display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.crew div{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;background:var(--glass);border:1px solid var(--hair)}
.crew em{font-style:normal;margin-left:auto;font:11px GeistMono,monospace;color:var(--mute)}
.av{width:20px;height:20px;border-radius:50%;background:linear-gradient(135deg,var(--pink),var(--vio))}
.av.b{background:linear-gradient(135deg,var(--cyan),var(--ok))}
.strip{display:none;align-items:center;gap:8px;font-size:12.5px;padding:9px 12px;border-radius:14px;background:var(--glass);border:1px solid var(--hair)}
/* tablet */
@media (max-width:1100px){
 .app{grid-template-columns:minmax(0,1fr) 270px}
 .thread{display:none}.c-main{display:flex}
 .board,.skel{grid-template-columns:1fr 1fr}.board>.shell:first-child,.skel>div:first-child{grid-column:1/-1}
}
/* phone */
@media (max-width:600px){
 body{font-size:13.5px}
 .app{grid-template-columns:minmax(0,1fr)}
 header{padding:0 14px}.live{display:flex}.who{display:none}
 .rail{display:none}.strip{display:flex}
 .stage{padding:6px 14px 14px;gap:12px}
 .q{font-size:21px}
 .picker{font-size:11.5px}.picker span{padding:5px 10px}.why{display:none}
 .board,.skel{grid-template-columns:1fr}.wide{display:none}
 .skel div{height:96px}
 .rows{grid-template-columns:80px minmax(0,1fr)}
 .big b{font-size:28px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition:none!important}}
</style></head>
<body>
<div class="aurora"><i></i><i></i><i></i></div><div class="grid-bg"></div>
<div class="app" id="app">
<header><div class="orb"></div><span class="brand">Bridge</span><span class="sp"></span>
 <span class="pill live"><span class="pulse"></span><span id="liveTxt">Listening</span></span>
 <span class="pill who"><span class="pulse"></span>firstmate · 2 crew online</span></header>

<aside class="thread"><div class="msgs" id="msgs"></div>
 <div class="composer"><span class="txt" id="c1"></span><span class="send">↑</span></div></aside>

<main class="stage">
 <div class="eyebrow" id="eb">Generated view</div>
 <div class="q" id="q"></div>
 <div class="toprow"><div class="picker" id="picker"><i class="ind" id="ind"></i><span>Table</span><span>Board</span><span>Timeline</span><span>Chart</span></div><span class="why" id="why"></span></div>
 <div class="strip"><span class="pulse"></span><span id="stripTxt">Waiting for you</span></div>
 <div class="view" id="view"></div>
 <div class="composer c-main"><span class="txt" id="c2"></span><span class="send">↑</span></div>
</main>

<aside class="rail"><h3>Working on</h3><div class="steps" id="steps"></div>
 <div class="crewh">Crew</div>
 <div class="crew"><div><span class="av"></span>cf-auth<em>tests 2/4</em></div><div><span class="av b"></span>cf-feed<em>preview</em></div></div></aside>
</div>

<script>
const $ = id => document.getElementById(id), sleep = ms => new Promise(r => setTimeout(r, ms));
const OPTS = ['Table', 'Board', 'Timeline', 'Chart'];
const VIEWS = {
 Board: () => `<div class="board">
  <div class="shell conf" style="--i:0"><div class="core"><div class="h">⚠ #212 <span class="n">auth refresh</span></div>
   <div class="meta">main moved · 2 files conflict</div>
   <div class="diff"><div class="m">- const ttl = 900</div><div class="p">+ const ttl = keys.ttl</div></div>
   <div class="btns"><span class="btn pri">Take theirs</span><span class="btn">Open diff</span></div></div></div>
  <div class="shell" style="--i:1"><div class="core"><div class="h">#209 <span class="n">swap feed</span></div>
   <div class="checks"><span class="ck" style="--j:0">tests</span><span class="ck" style="--j:1">lint</span><span class="ck run" style="--j:2">preview…</span></div>
   <div class="bar"><i style="width:80%"></i></div><div class="meta">Ready in ~20 min</div></div></div>
  <div class="shell" style="--i:2"><div class="core"><div class="h">#205 <span class="n">billing</span></div>
   <div class="checks"><span class="ck" style="--j:0">tests</span><span class="ck" style="--j:1">lint</span><span class="ck" style="--j:2">types</span></div>
   <div class="bar"><i style="width:100%"></i></div><div class="btns"><span class="btn pri">Merge</span></div></div></div>
  <div class="shell wide" style="--i:3"><div class="core spark"><div class="stat"><span class="meta">Merged this week</span><b>14 PRs</b><span class="meta" style="color:var(--ok)">+40% vs last</span></div>
   <svg viewBox="0 0 600 96" preserveAspectRatio="none"><defs><linearGradient id="lg"><stop offset="0" stop-color="hsl(262 92% 70%)"/><stop offset="1" stop-color="hsl(188 95% 58%)"/></linearGradient><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="hsl(188 95% 58% / .35)"/><stop offset="1" stop-color="hsl(188 95% 58% / 0)"/></linearGradient></defs>
   <path class="a" d="M0 80 C60 70 90 74 140 60 S230 66 280 44 S380 50 430 30 S520 26 600 10 V96 H0Z"/><path class="l" d="M0 80 C60 70 90 74 140 60 S230 66 280 44 S380 50 430 30 S520 26 600 10"/></svg></div></div></div>
  <div class="next"><span style="--i:0">Fix #212 for me</span><span style="--i:1">Merge #205</span><span style="--i:2">Ping me when #209 is green</span></div>`,
 Timeline: () => `<div class="shell tl" style="--i:0"><div class="core">
  <div class="big"><b>Fri 14:00</b><span class="meta">swap app ships · 2 days left</span></div>
  <div class="rows"><span></span><div class="days"><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span></div>
   ${[['Auth fix #212', 0, 30, 'var(--amber)'], ['Swap feed #209', 10, 38, 'var(--cyan)'], ['Billing #205', 0, 14, 'var(--ok)'], ['Launch', 46, 26, 'var(--vio)']]
     .map(([l, x, w, c], i) => `<span class="meta">${l}</span><div class="track"><i style="--i:${i};left:${x}%;width:${w}%;background:linear-gradient(90deg,${c},hsl(0 0% 100% / .35))"></i>${i === 3 ? '<span class="ms" style="left:72%"></span>' : ''}${i === 0 ? '<span class="today"></span>' : ''}</div>`).join('')}
  </div></div></div>
  <div class="next"><span style="--i:0">Move launch to Monday</span><span style="--i:1">What blocks Friday?</span></div>`
};
const SCENES = [
 { q: 'How are my PRs doing? Anything blocked?', view: 'Board', why: '3 items with status → board',
   steps: [['Reading 3 open PRs', 'gh · 2 s'], ['Choosing a view', 'items have status'], ['Running tests on #212', 'cf-auth · 2/4']],
   reply: 'Picked a <b>board</b>. #212 needs you.' },
 { q: 'When does the swap app ship?', view: 'Timeline', why: 'dates + dependencies → timeline',
   steps: [['Reading plan + ETAs', 'ledger · 1 s'], ['Choosing a view', 'question is about time'], ['Watching #209 preview', 'cf-feed · building']],
   reply: 'Picked a <b>timeline</b>. Friday, if #212 lands.' }
];
const SCENE_MS = 9000;
function msg(cls, html) { const d = document.createElement('div'); d.className = cls; d.innerHTML = cls === 'ai' ? `<span class="dot"></span><span>${html}</span>` : html; const m = $('msgs'); m.append(d); while (m.children.length > 6) m.firstChild.remove(); }
function setStep(i, state, s) {
 let el = $('steps').children[i];
 if (!el) { el = document.createElement('div'); $('steps').append(el); }
 el.className = 'step ' + state; el.innerHTML = `<span class="ic">${state === 'ok' ? '✓' : ''}</span><div>${s[0]}<small>${s[1]}</small></div>`;
 $('liveTxt').textContent = state === 'ok' ? 'Working' : s[0]; $('stripTxt').textContent = s[0] + ' · ' + s[1];
}
function moveInd(k) { const sp = $('picker').querySelectorAll('span'); sp.forEach((x, j) => x.classList.toggle('on', j === k)); $('ind').style.left = sp[k].offsetLeft + 'px'; $('ind').style.width = sp[k].offsetWidth + 'px'; }
async function type(text) { for (let n = 0; n <= text.length; n++) { for (const c of ['c1', 'c2']) $(c).innerHTML = text.slice(0, n) + '<span class="caret"></span>'; await sleep(26); } await sleep(250); for (const c of ['c1', 'c2']) $(c).innerHTML = ''; }
async function play(s) {
 const t0 = performance.now(), view = $('view');
 view.classList.add('out'); $('steps').querySelectorAll('.step').forEach(e => e.style.animation = 'out .4s var(--spring) both');
 await sleep(420); view.innerHTML = ''; view.classList.remove('out'); $('steps').innerHTML = ''; $('why').textContent = ''; $('picker').classList.remove('lock');
 await type(s.q);
 msg('me', s.q); const q = $('q'); q.classList.remove('in'); void q.offsetWidth; q.textContent = s.q; q.classList.add('in');
 $('app').classList.add('thinking');
 setStep(0, 'now', s.steps[0]); await sleep(750); setStep(0, 'ok', s.steps[0]);
 setStep(1, 'now', s.steps[1]); view.innerHTML = '<div class="skel"><div></div><div></div><div></div></div>';
 const target = OPTS.indexOf(s.view); for (const k of [0, 1, 2, 3, 2, 1, 0, 1, 2, 3].slice(0, 7 + target)) { moveInd(k); await sleep(110); }
 moveInd(target); $('picker').classList.add('lock'); $('why').textContent = s.why; setStep(1, 'ok', s.steps[1]);
 await sleep(250); view.innerHTML = VIEWS[s.view](); $('app').classList.remove('thinking');
 setStep(2, 'now', s.steps[2]); msg('ai', s.reply);
 await sleep(Math.max(0, SCENE_MS - (performance.now() - t0)));
}
(async () => {
 await document.fonts.ready; moveInd(1);
 if (matchMedia('(prefers-reduced-motion: reduce)').matches || location.hash === '#still') {
  const s = SCENES[0]; msg('me', s.q); msg('ai', s.reply); $('q').textContent = s.q; moveInd(1); $('why').textContent = s.why;
  s.steps.forEach((x, i) => setStep(i, i < 2 ? 'ok' : 'now', x)); $('view').innerHTML = VIEWS.Board(); return;
 }
 for (;;) for (const s of SCENES) await play(s);
})();
</script>
