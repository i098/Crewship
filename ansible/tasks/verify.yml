---
# Read-only verification of what this run produced.
#
# Nothing here mutates the host: every command is read-only and marked
# changed_when: false, so verification can never make a second apply report a
# change. Individual task files already assert their own outputs; this file
# checks the wiring that crosses them - the Herdr and omp releases this run
# resolved, Herdr's omp integration, the static enablement symlinks, the managed shell environment, the pruner runtime, the
# Firstmate revision this run resolved and the loopback-only desktop listeners.
#
# A check-mode run cannot observe files it did not create, so verification
# reports what it would check instead of failing a plan.

- name: Report that check mode cannot verify provisioning outputs
  ansible.builtin.debug:
    msg: >-
      check mode: skipping output verification. `./ship.sh launch` verifies the
      resolved Herdr and omp releases, unit wiring, pruner runtime, the Firstmate revision it
      resolved and the loopback-only desktop listeners.
  when: ansible_check_mode or not (crewship_account_ready | bool)

- name: Verify provisioning outputs
  when:
    - not ansible_check_mode
    - crewship_account_ready | bool
  block:

    # --- files that must exist ---------------------------------------------

    - name: Build the inventory of outputs this configuration must have
      ansible.builtin.set_fact:
        crewship_expected_outputs: >-
          {{ [crewship_herdr_bin,
              crewship_local_bin ~ '/herdr',
              crewship_herdr_config,
              crewship_user_units ~ '/herdr.service',
              crewship_user_units ~ '/default.target.wants/herdr.service',
              crewship_herdr_spaces_script,
              crewship_local_bin ~ '/herdr-sidebar-to-client.py',
              crewship_local_bin ~ '/herdr-patch',
              crewship_local_bin ~ '/btop',
              crewship_local_bin ~ '/btop-bin',
              crewship_btop_config,
              crewship_local_bin ~ '/sentrux',
              crewship_local_bin ~ '/fallow',
              crewship_local_bin ~ '/pyrefly',
              crewship_local_bin ~ '/nvim',
              crewship_cfg.home ~ '/.config/nvim',
              crewship_user_units ~ '/herdr-spaces.service',
              crewship_user_units ~ '/herdr-spaces.timer',
              crewship_user_units ~ '/timers.target.wants/herdr-spaces.timer',
              crewship_cfg.home ~ '/.profile']
             + ([crewship_chrome_devtools_mcp_path, crewship_omp_sidebar_extension,
                 crewship_omp_status_icons_extension, crewship_omp_no_pattern_kill_extension,
                 crewship_omp_quality_gate_extension,
                 crewship_omp_as_pi_dir ~ '/omp-as-pi', crewship_no_mistakes_omp_overlay,
                 crewship_user_units ~ '/no-mistakes-daemon-.service.d/crewship.conf']
                if (crewship_cfg.profiles.agents | bool) else [])
             + ([crewship_pruner_script,
                 crewship_pruner_python,
                 crewship_pruner_stamp,
                 crewship_user_units ~ '/chrome-autoprune.service',
                 crewship_user_units ~ '/chrome-autoprune.timer',
                 crewship_user_units ~ '/timers.target.wants/chrome-autoprune.timer']
                if ((crewship_cfg.profiles.agents | bool)
                    and (crewship_cfg.browser_prune.enabled | bool)) else [])
             + ([crewship_firstmate_dir ~ '/.git']
                + (crewship_firstmate_config_names
                   | map('regex_replace', '^', crewship_firstmate_dir ~ '/config/')
                   | list)
                if (crewship_cfg.profiles.firstmate | bool) else [])
             + ([crewship_vnc_dir ~ '/xstartup',
                 crewship_vnc_password_file,
                 crewship_vnc_chrome_profile,
                 crewship_local_bin ~ '/vnc-chrome',
                 crewship_user_units ~ '/crewship-vnc.service',
                 crewship_user_units ~ '/crewship-novnc.service',
                 crewship_user_units ~ '/default.target.wants/crewship-vnc.service',
                 crewship_user_units ~ '/default.target.wants/crewship-novnc.service']
                if (crewship_cfg.profiles.desktop | bool) else [])
             + ([crewship_local_bin ~ '/crewship-db',
                 crewship_cfg.home ~ '/.local/state/code-factory/shared-postgres/compose.json',
                 crewship_cfg.home ~ '/.local/state/code-factory/shared-postgres/projects-dir',
                 crewship_cfg.home ~ '/.local/state/code-factory/secrets/shared-postgres/superuser',
                 crewship_user_units ~ '/crewship-postgres-env-seed.service',
                 crewship_user_units ~ '/crewship-postgres-env-seed.timer',
                 crewship_user_units ~ '/timers.target.wants/crewship-postgres-env-seed.timer']
                if (crewship_cfg.profiles.shared_postgres | default(false) | bool) else [])
             + ([crewship_fleet_doctor_dir ~ '/docker-guard.sh',
                 crewship_fleet_doctor_dir ~ '/dev-server-reaper.sh',
                 crewship_fleet_doctor_dir ~ '/storage-guard.sh',
                 crewship_fleet_doctor_dir ~ '/devtools-bridge-reaper.sh']
                if (crewship_cfg.profiles.fleet_guards | bool) else [])
             + ((crewship_fleet_units
                   | map('regex_replace', '^', crewship_user_units ~ '/')
                   | list)
                + (crewship_fleet_enabled_units | map(attribute='wants')
                   | zip(crewship_fleet_enabled_units | map(attribute='unit'))
                   | map('join', '/')
                   | map('regex_replace', '^', crewship_user_units ~ '/')
                   | list))
             + ([crewship_fleet_browsers_dir ~ '/fleet-browser',
                 crewship_fleet_browsers_dir ~ '/cookie-sync.ts',
                 crewship_fleet_browsers_dir ~ '/env.sh']
                + (crewship_fleet_browser_units
                   | map('regex_replace', '^', crewship_user_units ~ '/')
                   | list)
                + (crewship_fleet_browser_enabled_units | map(attribute='wants')
                   | zip(crewship_fleet_browser_enabled_units | map(attribute='unit'))
                   | map('join', '/')
                   | map('regex_replace', '^', crewship_user_units ~ '/')
                   | list)
                if (crewship_fleet_browsers_enabled | bool) else [])
             + ([crewship_local_bin ~ '/concord',
                 crewship_local_bin ~ '/slk',
                 crewship_cfg.home ~ '/.config/concord/config.toml',
                 crewship_cfg.home ~ '/.config/slk/config.toml']
                if (crewship_cfg.profiles.chat | bool) else [])
             + ([crewship_local_bin ~ '/crewboard',
                 crewship_user_units ~ '/crewboard.service',
                 crewship_user_units ~ '/default.target.wants/crewboard.service']
                if (crewship_cfg.board is defined) else []) }}

    - name: Stat every expected output
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
        get_checksum: false
      become: true
      loop: "{{ crewship_expected_outputs }}"
      loop_control:
        label: "{{ item | relpath(crewship_cfg.home) }}"
      register: crewship_output_stat
      changed_when: false
      check_mode: false

    - name: Assert every expected output exists
      ansible.builtin.assert:
        that:
          - crewship_output_stat.results | rejectattr('stat.exists') | list | length == 0
        fail_msg: >-
          Provisioning finished but these outputs are missing:
          {{ crewship_output_stat.results | rejectattr('stat.exists')
             | map(attribute='item') | list | join(', ') }}.
        quiet: true

    # --- desktop units are enabled through the managed symlinks -------------

    - name: Stat the desktop static-enablement symlinks
      ansible.builtin.stat:
        path: "{{ crewship_user_units }}/default.target.wants/{{ item }}"
        follow: false
        get_checksum: false
      become: true
      loop:
        - crewship-vnc.service
        - crewship-novnc.service
      register: crewship_verify_desktop_links
      changed_when: false
      check_mode: false
      when:
        - crewship_cfg.profiles.desktop | bool
        - crewship_desktop_strict_symlink_check | bool

    - name: Assert the desktop units are enabled through the managed unit files
      ansible.builtin.assert:
        that:
          - crewship_verify_desktop_links.results
            | map(attribute='stat.lnk_source', default='')
            | list
            == (['crewship-vnc.service', 'crewship-novnc.service']
                | map('regex_replace', '^', crewship_user_units ~ '/') | list)
        fail_msg: >-
          The default.target.wants entries for the desktop must be symlinks to
          the managed units in {{ crewship_user_units }}. Found:
          {{ crewship_verify_desktop_links.results
             | map(attribute='stat.lnk_source', default='(not a symlink)')
             | list | join(', ') }}.
        quiet: true
      when:
        - crewship_cfg.profiles.desktop | bool
        - crewship_desktop_strict_symlink_check | bool

    # --- the Herdr release this run resolved is the one that runs ----------

    - name: Stat the managed Herdr symlink
      ansible.builtin.stat:
        path: "{{ crewship_local_bin }}/herdr"
        follow: false
        get_checksum: false
      become: true
      register: crewship_verify_herdr_link
      changed_when: false
      check_mode: false

    - name: Read the rendered Herdr unit
      ansible.builtin.slurp:
        src: "{{ crewship_user_units }}/herdr.service"
      become: true
      register: crewship_verify_herdr_unit
      changed_when: false

    - name: Assert CLI and service run the resolved Herdr release
      ansible.builtin.assert:
        that:
          - (crewship_verify_herdr_link.stat.lnk_source | default('')) == crewship_herdr_bin
          - (crewship_verify_herdr_unit.content | b64decode) is search('ExecStart=' ~ (crewship_herdr_bin | regex_escape))
        fail_msg: >-
          The interactive `herdr` command and herdr.service must both resolve to
          {{ crewship_herdr_bin }} (Herdr {{ crewship_herdr_version }}, the latest
          release this run resolved). The symlink points at
          "{{ crewship_verify_herdr_link.stat.lnk_source | default('(missing)') }}".
        quiet: true

    # mosh-server and non-interactive SSH run commands with the system PATH,
    # which has no ~/.local/bin; the /usr/local/bin links make both resolve.
    - name: Resolve herdr and herdr-patch with the mosh-server PATH
      ansible.builtin.command:
        argv: [env, -i, "PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin",
               sh, -c, "command -v herdr && command -v herdr-patch"]
      become: "{{ crewship_become_target | bool }}"
      become_user: "{{ crewship_cfg.user }}"
      register: crewship_verify_mosh_path
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Assert herdr and herdr-patch resolve through /usr/local/bin
      ansible.builtin.assert:
        that:
          - crewship_verify_mosh_path.stdout_lines == ['/usr/local/bin/herdr', '/usr/local/bin/herdr-patch']
        fail_msg: >-
          With the mosh-server PATH, `herdr` and `herdr-patch` resolve to
          "{{ crewship_verify_mosh_path.stdout_lines | join(', ') | default('(nothing)', true) }}",
          not /usr/local/bin/herdr and /usr/local/bin/herdr-patch, so
          `mosh <host> -- herdr-patch` fails.
        quiet: true

    # --- the omp release this run resolved is the one installed ------------

    - name: Stat the managed omp symlink
      ansible.builtin.stat:
        path: "{{ crewship_local_bin }}/omp"
        follow: false
        get_checksum: false
      become: true
      register: crewship_verify_omp_link
      changed_when: false
      check_mode: false
      when: crewship_cfg.profiles.agents | bool

    - name: Read the installed omp package manifest
      ansible.builtin.slurp:
        src: "{{ crewship_omp_root }}/node_modules/@oh-my-pi/pi-coding-agent/package.json"
      become: true
      register: crewship_verify_omp_package
      changed_when: false
      when: crewship_cfg.profiles.agents | bool

    - name: Assert omp is the release this run resolved
      ansible.builtin.assert:
        that:
          - (crewship_verify_omp_link.stat.lnk_source | default('')).startswith(crewship_omp_root ~ '/')
          - (crewship_verify_omp_package.content | b64decode | from_json).version == crewship_omp_version
        fail_msg: >-
          `omp` must be omp {{ crewship_omp_version }}, the latest release this run
          resolved, installed under {{ crewship_omp_root }}. The symlink points at
          "{{ crewship_verify_omp_link.stat.lnk_source | default('(missing)') }}".
        quiet: true
      when: crewship_cfg.profiles.agents | bool

    # Every omp flag omp-as-pi relies on is still in the installed omp's --help,
    # and its gate overlay matches the pinned sha256.
    - name: Run the omp-as-pi preflight
      ansible.builtin.command:
        argv: ["{{ crewship_omp_as_pi_dir }}/omp-as-pi", --omp-as-pi-check]
      become: true
      changed_when: false
      check_mode: false
      when: crewship_cfg.profiles.agents | bool

    # Without Herdr's omp integration every omp pane shows as idle in the sidebar.
    - name: Read the Herdr integration status
      ansible.builtin.command:
        argv: ["{{ crewship_herdr_bin }}", integration, status]
      register: crewship_verify_herdr_integrations
      changed_when: false
      check_mode: false
      when: crewship_cfg.profiles.agents | bool

    - name: Assert Herdr's omp integration is current
      ansible.builtin.assert:
        that:
          - "crewship_verify_herdr_integrations.stdout is search('(?m)^omp: current')"
        fail_msg: >-
          `herdr integration status` does not report `omp: current`, so Herdr
          shows every omp agent as idle:
          {{ crewship_verify_herdr_integrations.stdout_lines | select('match', 'omp:') | join(' ') }}
        quiet: true
      when: crewship_cfg.profiles.agents | bool

    # --- managed shell environment -----------------------------------------

    - name: Read the account profile
      ansible.builtin.slurp:
        src: "{{ crewship_cfg.home }}/.profile"
      become: true
      register: crewship_verify_profile
      changed_when: false
      when: crewship_manage_profile_path | bool

    - name: Assert the managed environment block is present
      ansible.builtin.assert:
        that:
          - (crewship_verify_profile.content | b64decode) is search('crewship managed environment')
          - (crewship_verify_profile.content | b64decode) is search('\.local/bin')
          - not (crewship_cfg.profiles.agents | bool)
            or ((crewship_verify_profile.content | b64decode) is search('CHROME_DEVTOOLS_AXI_MCP_PATH'))
        fail_msg: >-
          {{ crewship_cfg.home }}/.profile has no managed block exporting
          ~/.local/bin{{ ' and CHROME_DEVTOOLS_AXI_MCP_PATH' if (crewship_cfg.profiles.agents | bool) else '' }}.
          A login shell would not see the managed toolchain.
        quiet: true
      when: crewship_manage_profile_path | bool

    # --- data disk (crewship.data_dir) --------------------------------------

    - name: Assert the login shell sends the npm and pip caches to the data disk
      ansible.builtin.assert:
        that:
          - (crewship_verify_profile.content | b64decode) is search('export ' ~ item.key ~ '="' ~ (item.value | regex_escape) ~ '"')
        fail_msg: "{{ crewship_cfg.home }}/.profile does not export {{ item.key }}={{ item.value }}."
        quiet: true
      loop: "{{ crewship_data_cache_env | dict2items }}"
      when: crewship_manage_profile_path | bool

    - name: Read the Docker daemon configuration
      ansible.builtin.slurp:
        src: "{{ crewship_docker_daemon_json }}"
      become: true
      register: crewship_verify_docker_daemon
      changed_when: false
      when:
        - crewship_cfg.profiles.docker | bool
        - crewship_docker_data_root | length > 0

    - name: Assert Docker's data root is on the data disk
      ansible.builtin.assert:
        that:
          - ((crewship_verify_docker_daemon.content | b64decode | from_json)['data-root'] | default('')) == crewship_docker_data_root
        fail_msg: "{{ crewship_docker_daemon_json }} does not set data-root to {{ crewship_docker_data_root }}."
        quiet: true
      when:
        - crewship_cfg.profiles.docker | bool
        - crewship_docker_data_root | length > 0

    # --- pruner runtime and unit -------------------------------------------

    - name: Read the pruner unit
      ansible.builtin.slurp:
        src: "{{ crewship_user_units }}/chrome-autoprune.service"
      become: true
      register: crewship_verify_prune_unit
      changed_when: false
      when:
        - crewship_cfg.profiles.agents | bool
        - crewship_cfg.browser_prune.enabled | bool

    - name: Assert the pruner runs the private runtime with --apply
      ansible.builtin.assert:
        that:
          - (crewship_verify_prune_unit.content | b64decode)
            is search('ExecStart=' ~ (crewship_pruner_python | regex_escape) ~ ' ' ~ (crewship_pruner_script | regex_escape))
          - (crewship_verify_prune_unit.content | b64decode) is search('\s--apply(\s|$)')
          - (crewship_verify_prune_unit.content | b64decode) is not search(crewship_repo | regex_escape)
        fail_msg: >-
          chrome-autoprune.service must start
          "{{ crewship_pruner_python }} {{ crewship_pruner_script }} --apply ...".
          Without --apply the pruner neither records observations nor stops
          anything, and the unit must not reference {{ crewship_repo }}: the
          timer has to keep working without this checkout.
        quiet: true
      when:
        - crewship_cfg.profiles.agents | bool
        - crewship_cfg.browser_prune.enabled | bool

    # --- Firstmate is on main at the revision this run resolved + patches ----

    - name: Assert this run resolved a Firstmate target revision
      ansible.builtin.assert:
        that:
          - crewship_firstmate_target is defined
        fail_msg: >-
          No Firstmate target revision was resolved in this run, so there is
          nothing to verify against. tasks/firstmate.yml resolves it from
          origin/main; verify as part of a full apply, or with
          `--tags firstmate,verify`.
        quiet: true
      when: crewship_cfg.profiles.firstmate | bool

    - name: Read the Firstmate origin URL
      ansible.builtin.command:
        argv: [git, -C, "{{ crewship_firstmate_dir }}", config, --get, remote.origin.url]
      become: "{{ crewship_become_target | bool }}"
      become_user: "{{ crewship_cfg.user }}"
      environment: "{{ crewship_user_env }}"
      register: crewship_verify_fm_origin
      changed_when: false
      failed_when: false
      check_mode: false
      when: crewship_cfg.profiles.firstmate | bool

    - name: Assert Firstmate fetches the configured repository
      ansible.builtin.assert:
        that:
          - (crewship_verify_fm_origin.stdout | trim) == crewship_cfg.firstmate.url
        fail_msg: >-
          {{ crewship_firstmate_dir }} fetches origin
          {{ crewship_verify_fm_origin.stdout | default('') | trim | default('(none)', true) }},
          not crewship.firstmate.url {{ crewship_cfg.firstmate.url }}, so this
          run updated the wrong repository. Provisioning never rewrites the
          remote or discards local commits; follow "Moving off the old
          Firstmate fork" in docs/configuration.md.
        quiet: true
      when: crewship_cfg.profiles.firstmate | bool

    - name: Verify Firstmate is on main at the resolved revision plus the patch layer
      ansible.builtin.command:
        argv:
          - bash
          - "{{ crewship_repo }}/scripts/firstmate-patch-layer.sh"
          - verify
          - "{{ crewship_firstmate_dir }}"
          - "{{ crewship_firstmate_target }}"
          - "{{ crewship_firstmate_patch_dir }}"
      become: "{{ crewship_become_target | bool }}"
      become_user: "{{ crewship_cfg.user }}"
      environment: "{{ crewship_user_env }}"
      register: crewship_verify_fm_head
      changed_when: false
      check_mode: false
      when: crewship_cfg.profiles.firstmate | bool

    # A host that cannot name the Firstmate it installed is how a fleet ends up
    # running a revision nobody can identify, so the sha is reported, not only
    # asserted.
    - name: Report the Firstmate revision this run installed
      ansible.builtin.debug:
        msg: >-
          Firstmate in {{ crewship_firstmate_dir }} is on main at
          {{ crewship_verify_fm_head.stdout | trim }}: {{ crewship_firstmate_target }},
          the revision origin/main of {{ crewship_cfg.firstmate.url }} resolved to
          during this run, plus the patch layer in patches/firstmate/.
      when: crewship_cfg.profiles.firstmate | bool

    # --- runtime state, only where services are managed ---------------------

    - name: Read the state of the managed user units
      ansible.builtin.command:
        argv: [systemctl, --user, is-active, "{{ item }}"]
      become: "{{ crewship_become_target | bool }}"
      become_user: "{{ crewship_cfg.user }}"
      environment: "{{ crewship_user_systemd_env }}"
      loop: >-
        {{ ['herdr.service', 'herdr-spaces.timer']
           + (['chrome-autoprune.timer']
              if ((crewship_cfg.profiles.agents | bool)
                  and (crewship_cfg.browser_prune.enabled | bool)) else [])
           + (['crewship-vnc.service', 'crewship-novnc.service']
              if (crewship_cfg.profiles.desktop | bool) else [])
           + (['crewboard.service'] if (crewship_cfg.board is defined) else []) }}
      register: crewship_verify_units
      changed_when: false
      failed_when: false
      check_mode: false
      when: crewship_manage_services | bool

    - name: Assert the managed user units are running
      ansible.builtin.assert:
        that:
          - crewship_verify_units.results
            | rejectattr('stdout', 'in', ['active', 'activating'])
            | list | length == 0
        fail_msg: >-
          These managed user units are not running:
          {{ crewship_verify_units.results
             | rejectattr('stdout', 'in', ['active', 'activating'])
             | map(attribute='item') | list | join(', ') }}.
          Inspect them with `systemctl --user status <unit>` and
          `journalctl --user -u <unit>` as {{ crewship_cfg.user }}.
        quiet: true
      when: crewship_manage_services | bool

    - name: Report the units that were written but not started
      ansible.builtin.debug:
        msg: >-
          start_services is false: unit files and their *.target.wants symlinks
          exist under {{ crewship_user_units }}, nothing was started, and no
          linger was enabled. This is the image-build and container mode.
      when: not (crewship_manage_services | bool)

    # --- the desktop stays on loopback --------------------------------------

    - name: Read the listening TCP sockets
      ansible.builtin.command:
        argv: [ss, -H, -l, -t, -n]
      become: true
      register: crewship_verify_listeners
      changed_when: false
      check_mode: false
      when:
        - crewship_cfg.profiles.desktop | bool
        - crewship_manage_services | bool

    - name: Collect desktop listeners that are not on loopback
      ansible.builtin.set_fact:
        crewship_desktop_public_listeners: >-
          {{ crewship_verify_listeners.stdout_lines
             | select('search', ':(' ~ crewship_vnc_rfb_port ~ '|' ~ crewship_cfg.desktop.novnc_port ~ ')\s')
             | reject('search', '(127\.0\.0\.1|\[::1\]):(' ~ crewship_vnc_rfb_port ~ '|' ~ crewship_cfg.desktop.novnc_port ~ ')\s')
             | list }}
      when:
        - crewship_cfg.profiles.desktop | bool
        - crewship_manage_services | bool

    - name: Assert the desktop listeners are loopback only
      ansible.builtin.assert:
        that:
          - crewship_desktop_public_listeners | length == 0
        fail_msg: >-
          The review desktop must never leave loopback, and these sockets do:
          {{ crewship_desktop_public_listeners | join(' | ') }}.
          VNC requires authentication as well as loopback binding; use an SSH
          tunnel instead of publishing the desktop directly.
        quiet: true
      when:
        - crewship_cfg.profiles.desktop | bool
        - crewship_manage_services | bool

    # --- what provisioning deliberately did not do --------------------------

    - name: Report the manual prerequisites provisioning never performs
      ansible.builtin.debug:
        msg: >-
          {{ ['Verified outputs for profiles: '
              ~ (crewship_cfg.profiles | dict2items | selectattr('value')
                 | map(attribute='key') | list | join(', ') | default('none', true))
              ~ '.']
             + ['Manual: authenticate every CLI interactively as '
                ~ crewship_cfg.user
                ~ ' (gh auth login, OMP provider sign-in); no credential was copied.']
             + (['Manual: join the tailnet with `sudo tailscale up`; Tailscale SSH and the tailnet ACL stay separate decisions.']
                if (crewship_cfg.profiles.tailscale | bool) else [])
             + (['Manual: add accounts to the docker group yourself (crewship_docker_group_users); it grants host root.']
                if ((crewship_cfg.profiles.docker | bool) and (crewship_docker_group_users | length == 0)) else [])
             + (['Manual: sign in once inside the single persistent profile '
                 ~ crewship_vnc_chrome_profile
                 ~ ' via `vnc-chrome`, reached through `ssh -N -L '
                 ~ crewship_cfg.desktop.novnc_port ~ ':127.0.0.1:'
                 ~ crewship_cfg.desktop.novnc_port ~ ' ' ~ crewship_cfg.user ~ '@<host>`.']
                if (crewship_cfg.profiles.desktop | bool) else [])
