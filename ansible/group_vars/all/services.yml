---
# systemd/service switches. start_services=false (image builds, containers)
# suppresses every linger, daemon-reload, enable-at-runtime and start action;
# unit files and their static *.target.wants symlinks are still written.
crewship_manage_services: "{{ crewship_cfg.start_services | bool }}"
crewship_manage_linger: "{{ (crewship_cfg.start_services | bool) and (crewship_cfg.enable_linger | bool) }}"

# Escalate to the target account only when we are not already that account.
crewship_become_target: "{{ (ansible_user_id | default('')) != crewship_cfg.user }}"
crewship_user_runtime_dir: "/run/user/{{ crewship_user_uid | default('') }}"
crewship_user_systemd_env:
  XDG_RUNTIME_DIR: "{{ crewship_user_runtime_dir }}"
  DBUS_SESSION_BUS_ADDRESS: "unix:path={{ crewship_user_runtime_dir }}/bus"
  PATH: "{{ crewship_local_bin }}:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"

crewship_user_env:
  HOME: "{{ crewship_cfg.home }}"
  USER: "{{ crewship_cfg.user }}"
  LOGNAME: "{{ crewship_cfg.user }}"
  PATH: "{{ crewship_local_bin }}:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"

# --- Account policy (conservative by default) -------------------------------
crewship_create_user: true
crewship_user_shell: /bin/bash
# Never granted implicitly. Add the account to sudo only by explicit choice.
crewship_user_sudo: false
# Marker-delimited PATH block in the account's ~/.profile.
crewship_manage_profile_path: true
