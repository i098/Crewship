---
# Crewship - native provisioning variables.
#
# The CLI passes the whole validated configuration document as extra vars, so
# `crewship` (and `schema_version`) arrive from config/default.yml or
# .local/host.yml. Extra vars replace a variable wholesale, so the defaults of
# the contract document are kept separately in `crewship_defaults` and merged
# recursively into `crewship_cfg`. Task files consume `crewship_cfg.*`, which is
# `crewship.*` with contract defaults filled in for keys the caller omitted.
#
# Nothing in this file may contain a secret, a token, a host identity or a
# /home/ubuntu literal.

crewship_defaults: "{{ (lookup('ansible.builtin.file', crewship_repo ~ '/config/default.yml') | from_yaml).crewship }}"

crewship_cfg: "{{ crewship_defaults | combine(crewship | default({}, true), recursive=True) }}"

# --- Repository layout (Main-owned inputs) ----------------------------------
# Override crewship_repo if the CLI ever invokes the playbook from outside
# the checkout.
crewship_repo: "{{ playbook_dir | dirname }}"
crewship_installer: "{{ crewship_repo }}/scripts/provisions.py"
crewship_pruner_source: "{{ crewship_repo }}/maintenance/chrome-autoprune.py"

# Nothing is pinned: tasks/preflight.yml resolves every tool's latest release
# once per run into crewship_latest, and that is what the run installs and
# tasks/verify.yml asserts for herdr and omp.
crewship_herdr_version: "{{ crewship_latest.herdr.version }}"
crewship_omp_version: "{{ crewship_latest.omp }}"

# --- Platform ---------------------------------------------------------------
crewship_platform_map:
  x86_64: linux-x86_64
  amd64: linux-x86_64
  aarch64: linux-aarch64
  arm64: linux-aarch64
crewship_platform: "{{ crewship_platform_map[ansible_architecture] | default('') }}"
crewship_deb_arch_map:
  x86_64: amd64
  amd64: amd64
  aarch64: arm64
  arm64: arm64
crewship_deb_arch: "{{ crewship_deb_arch_map[ansible_architecture] | default('') }}"
crewship_supported_ubuntu_releases: ["24.04", "26.04"]
crewship_allow_unsupported_os: false

# --- Derived paths ----------------------------------------------------------
crewship_local_bin: "{{ crewship_cfg.home }}/.local/bin"
crewship_share_dir: "{{ crewship_cfg.home }}/.local/share/crewship"
crewship_tools_root: "{{ crewship_share_dir }}/tools"
crewship_omp_root: "{{ crewship_share_dir }}/omp/{{ crewship_omp_version }}"
# AXI must launch the chrome-devtools MCP build the installer installed (the
# latest release) instead of resolving `npx ...@latest` at runtime. The
# installer re-points `current` at that release, so this text, and with it the
# Herdr unit and the profile block, stays the same between releases. Exported
# to the managed shell environment and to the Herdr service environment.
crewship_chrome_devtools_mcp_path: "{{ crewship_share_dir }}/chrome-devtools-mcp/current/node_modules/chrome-devtools-mcp/build/src/bin/chrome-devtools-mcp.js"
# Environment shared by the interactive shell profile and the Herdr unit.
# Consumed only when the agents profile is on, because the npm set that
# provides the MCP entrypoint is installed by `--npm`. Nothing here may be a
# process-wide runtime limit (NODE_OPTIONS, BUN_OPTIONS): it would also reach
# the chrome-devtools-axi bridge, chrome-devtools-mcp and acpx.
crewship_managed_shell_env:
  CHROME_DEVTOOLS_AXI_MCP_PATH: "{{ crewship_chrome_devtools_mcp_path }}"
# The board is opt-in; share its socket with shells and new Herdr agents.
crewship_board_env: >-
  {{ {'CREWBOARD_SOCKET': crewship_user_runtime_dir ~ '/crewboard.sock'}
     if crewship_cfg.board is defined else {} }}
# crewship.data_dir: Docker's data root and the caches that never hardlink into
# a worktree. Exported next to crewship_managed_shell_env on every profile.
# bun, pnpm and uv stay on the system disk on purpose: they hardlink packages
# into each worktree, which only works on one filesystem
# (docs/configuration.md#data-disk).
crewship_data_dir: "{{ crewship_cfg.data_dir | default('', true) }}"
crewship_docker_data_root: "{{ (crewship_data_dir ~ '/docker') if crewship_data_dir else '' }}"
crewship_data_cache_env: >-
  {{ {'npm_config_cache': crewship_data_dir ~ '/cache/npm',
      'PIP_CACHE_DIR': crewship_data_dir ~ '/cache/pip'} if crewship_data_dir else {} }}
# Contract: compute the unit ExecStart directly, never /usr/local/bin or $PATH.
crewship_herdr_bin: "{{ crewship_tools_root }}/herdr/{{ crewship_herdr_version }}/{{ crewship_platform }}/herdr"
crewship_herdr_config_dir: "{{ crewship_cfg.home }}/.config/herdr"
crewship_herdr_config: "{{ crewship_herdr_config_dir }}/config.toml"
crewship_user_units: "{{ crewship_cfg.home }}/.config/systemd/user"
crewship_firstmate_dir: "{{ crewship_cfg.workspace }}/firstmate"
# One local commit per patch on top of origin/main (tasks/firstmate.yml).
crewship_firstmate_patch_dir: "{{ crewship_repo }}/patches/firstmate"
crewship_vnc_dir: "{{ crewship_cfg.home }}/.vnc"
# Exactly one persistent Chrome profile for the VNC desktop. Never seeded,
# copied, cloned or duplicated (docs/security.md).
crewship_vnc_chrome_profile: "{{ crewship_cfg.home }}/.vnc-chrome-profile"
# Generated on the host for `ssh mac` (tasks/mac_ssh.yml), never copied.
crewship_mac_ssh_key: "{{ crewship_cfg.home }}/.ssh/id_ed25519_mac"
# iMessage bridge (crewship.imessage, tasks/imessage.yml, docs/imessage.md).
# The service runs from this copy of imessage/ with the latest spectrum-ts,
# resolved once per run (crewship_latest). Photon and relay credentials stay in ~/super.env.
crewship_imessage_dir: "{{ crewship_share_dir }}/imessage"
crewship_imessage_desk_model: "{{ crewship_cfg.imessage.desk_model | default('claude-haiku-5-5') }}"
crewship_imessage_supervisor_model: "{{ crewship_cfg.imessage.supervisor_model | default('') }}"
crewship_imessage_owner_name: "{{ crewship_cfg.imessage.owner_name | default('the owner') }}"
# Crew board (crewship.board, tasks/board.yml, docs/board.md): cargo's target
# directory and the source checksum of the last build.
crewship_board_dir: "{{ crewship_share_dir }}/crewboard"

# Private runtime for the Chrome pruner. The exported pruner calls
# psutil.Process.net_connections(), which exists from psutil 6 onwards, while
# Ubuntu 24.04 ships python3-psutil 5.9. Instead of shimming the deprecated
# API or pip-installing into the distribution interpreter, the pruner runs on
# an account-owned virtualenv built by the managed uv and filled with the latest
# psutil, --require-hashes against the digests PyPI publishes for that release
# (crewship_latest.psutil). The unit references only
# paths under the account's home, so the timer keeps working after the
# repository checkout is gone.
crewship_uv_bin: "{{ crewship_local_bin }}/uv"
crewship_pruner_script: "{{ crewship_local_bin }}/chrome-autoprune.py"
crewship_pruner_venv: "{{ crewship_share_dir }}/pruner-venv"
crewship_pruner_python: "{{ crewship_pruner_venv }}/bin/python"
# Written after a successful install; carries the digest of the requirements
# that produced the runtime, so a new psutil release reinstalls and an
# unchanged one is a no-op on the second apply.
crewship_pruner_stamp: "{{ crewship_pruner_venv }}/.crewship-runtime.json"
crewship_pruner_requirements: "{{ crewship_share_dir }}/pruner-requirements.txt"
crewship_pruner_psutil_version: "{{ crewship_latest.psutil.version }}"
crewship_pruner_requirements_text: >-
  psutil=={{ crewship_pruner_psutil_version }}
  {{ crewship_latest.psutil.sha256 | map('regex_replace', '^', '--hash=sha256:') | join(' ') }}
crewship_pruner_requirements_digest: "{{ crewship_pruner_requirements_text | hash('sha256') }}"
# The base interpreter of that virtualenv. Pinned to the distribution
# interpreter so no managed Python is downloaded behind the operator's back.
crewship_pruner_base_python: /usr/bin/python3
crewship_pruner_uv_env:
  UV_PYTHON_DOWNLOADS: never
  UV_NO_CONFIG: "1"

# systemd/service switches. start_services=false (image builds, containers)
# suppresses every linger, daemon-reload, enable-at-runtime and start action;
# unit files and their static *.target.wants symlinks are still written.
crewship_manage_services: "{{ crewship_cfg.start_services | bool }}"
crewship_manage_linger: "{{ (crewship_cfg.start_services | bool) and (crewship_cfg.enable_linger | bool) }}"

# Escalate to the target account only when we are not already that account.
crewship_become_target: "{{ (ansible_user_id | default('')) != crewship_cfg.user }}"
crewship_user_runtime_dir: "/run/user/{{ crewship_user_uid | default('') }}"
crewship_user_systemd_env:
  XDG_RUNTIME_DIR: "{{ crewship_user_runtime_dir }}"
  DBUS_SESSION_BUS_ADDRESS: "unix:path={{ crewship_user_runtime_dir }}/bus"
  PATH: "{{ crewship_local_bin }}:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"

crewship_user_env:
  HOME: "{{ crewship_cfg.home }}"
  USER: "{{ crewship_cfg.user }}"
  LOGNAME: "{{ crewship_cfg.user }}"
  PATH: "{{ crewship_local_bin }}:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"

# --- Account policy (conservative by default) -------------------------------
crewship_create_user: true
crewship_user_shell: /bin/bash
# Never granted implicitly. Add the account to sudo only by explicit choice.
crewship_user_sudo: false
# Marker-delimited PATH block in the account's ~/.profile.
crewship_manage_profile_path: true

# --- apt package sets -------------------------------------------------------
crewship_apt_cache_valid_time: 3600
crewship_base_packages:
  - ca-certificates
  - curl
  - git
  - gnupg
  - jq
  - tar
  - unzip
  - xz-utils
  - zstd
  - procps
  - acl
  - python3
  - python3-venv
  - openssl
  - rsync
  # The only sentrux release binary links GTK 3 (its GUI), even for `sentrux gate`.
  - libgtk-3-0t64
  # mosh-server, for `mosh <host>` from the operator's devices (docs/security.md#from-a-mac-to-the-host).
  - mosh
# Shared libraries and a font the chrome-headless-shell that omp's browser tool and
# puppeteer download needs on a minimal Ubuntu; installed without recommends.
# The t64 names exist on 24.04 and 26.04.
crewship_headless_browser_packages:
  - libxcomposite1
  - libxdamage1
  - libxfixes3
  - libxrandr2
  - libasound2t64
  - libatk1.0-0t64
  - libatk-bridge2.0-0t64
  - libatspi2.0-0t64
  - libgbm1
  - libnss3
  - libnspr4
  - libxkbcommon0
  - fonts-dejavu-core
# Shared libraries the Concord release binary links or loads (its README's
# Debian list, without xdg-desktop-portal, which only screen capture uses);
# installed without recommends. libasound2t64 is in the headless set above.
crewship_chat_packages:
  - libegl1
  - libpipewire-0.3-0t64
  - libva2
  - libva-drm2
crewship_development_packages:
  - build-essential
  - pkg-config
  - libssl-dev
  - python3-dev
  - cmake
  - ripgrep
# No python3-psutil here on purpose: the pruner runs on its own hash-verified
# virtualenv (crewship_pruner_venv), not on the distribution interpreter.
crewship_docker_packages:
  - docker.io
  - docker-compose-v2
crewship_desktop_packages:
  - xfce4
  - xfce4-terminal
  - dbus-x11
  - xauth
  - x11-xserver-utils
  - fonts-dejavu-core
  - tigervnc-standalone-server
  - tigervnc-common
  - tigervnc-tools
  - novnc
  - websockify
  # `ss` is how tasks/verify.yml proves both listeners stayed on loopback.
  - iproute2

# --- Tool installer ---------------------------------------------------------
crewship_core_tools: [herdr, node, bun, uv, btop, sentrux, fallow, pyrefly]
# The terminal chat clients of the chat profile (docs/chat.md).
crewship_chat_tools: [concord, slk]
# The installer flags that choose which tools a run covers. tasks/preflight.yml
# resolves exactly this set (plus the sources Ansible installs itself) and
# tasks/tools.yml installs it, so a host never resolves, and never fails on, a
# release it does not install.
crewship_installer_selection: >-
  {{ ['--tools', (crewship_core_tools
                  + (crewship_chat_tools if (crewship_cfg.profiles.chat | bool) else []))
                 | join(',')]
     + (['--npm'] if (crewship_cfg.profiles.agents | bool) else [])
     + (['--development'] if (crewship_cfg.profiles.development | bool) else []) }}
crewship_installer_also: >-
  {{ (['koncreet'] if (crewship_cfg.start_services | bool) else [])
     + (['psutil'] if ((crewship_cfg.profiles.agents | bool)
                       and (crewship_cfg.browser_prune.enabled | bool)) else [])
     + (['obscura'] if (crewship_fleet_browsers_enabled | bool) else [])
     + (['spectrum-ts'] if (crewship_cfg.imessage is defined) else []) }}

# --- Herdr static config ----------------------------------------------------
# Only the reviewed, non-secret subset is templated. experimental.pane_history
# is deliberately absent: it persists terminal output that can contain tokens.
crewship_herdr_update_channel: stable
crewship_herdr_show_agent_labels: true
crewship_herdr_theme_auto_switch: false
crewship_herdr_status_indicators: symbols
crewship_omp_sidebar_extension: "{{ crewship_cfg.home }}/.omp/agent/extensions/crewship-herdr-sidebar.ts"
# The "aa-" name loads it before the plugins whose status it takes over (docs/omp.md).
crewship_omp_status_icons_extension: "{{ crewship_cfg.home }}/.omp/agent/extensions/aa-mode-icons.ts"
# Blocks pkill/killall/kill-by-pgrep in every omp session (docs/omp.md).
crewship_omp_no_pattern_kill_extension: "{{ crewship_cfg.home }}/.omp/agent/extensions/fm-no-pattern-kill.ts"
# The sentrux/fallow quality gate at the end of every omp agent turn (docs/omp.md#quality-gate).
crewship_omp_quality_gate_extension: "{{ crewship_cfg.home }}/.omp/agent/extensions/crewship-quality-gate.ts"
# Herdr's own omp state extension; `herdr integration install omp` writes it (docs/herdr.md).
crewship_herdr_omp_integration: "{{ crewship_cfg.home }}/.omp/agent/extensions/herdr-omp-agent-state.ts"
# omp as the no-mistakes pi agent, and the omp overlay only daemon-spawned omp
# loads (docs/omp.md#no-mistakes-pipeline-agent).
crewship_omp_as_pi_dir: "{{ crewship_cfg.home }}/.no-mistakes/omp-as-pi"
crewship_no_mistakes_omp_overlay: "{{ crewship_cfg.home }}/.no-mistakes/omp-config.yml"
# Stdlib-only reporter that feeds the Spaces sidebar layout, run by herdr-spaces.timer.
crewship_herdr_spaces_source: "{{ crewship_repo }}/maintenance/herdr-spaces.py"
crewship_herdr_spaces_script: "{{ crewship_local_bin }}/herdr-spaces.py"
# btop: ~/.local/bin/btop is a launcher that picks a preset of the saved config
# by pane size, so it also loads in a phone's 50-column pane (docs/herdr.md#btop).
crewship_btop_launcher_source: "{{ crewship_repo }}/maintenance/btop.sh"
crewship_btop_config: "{{ crewship_cfg.home }}/.config/btop/btop.conf"

# --- Browser pruning --------------------------------------------------------
# Flags confirmed by Main (owner of maintenance/chrome-autoprune.py): without
# --apply the script neither keeps state nor prunes.
crewship_prune_exec_args:
  - "--apply"
  - "--idle-seconds"
  - "{{ crewship_cfg.browser_prune.idle_seconds }}"
  - "--max-gap-seconds"
  - "{{ crewship_cfg.browser_prune.max_gap_seconds }}"
crewship_prune_timeout_seconds: 90

# --- Sanitized preference files (Main-owned sources) ------------------------
# first_write: true means the file is written only when it does not exist, so
# an account that already holds provider settings is never overwritten.
crewship_omp_config: "{{ crewship_cfg.home }}/.omp/agent/config.yml"
crewship_acpx_config: "{{ crewship_cfg.home }}/.acpx/config.json"
crewship_agent_config_files:
  - src: config/omp.yml
    dest: "{{ crewship_omp_config }}"
    dir_mode: "0700"
    mode: "0600"
    first_write: true
  # Merged on every apply; user providers and unshipped model keys stay.
  - src: config/omp-models.yml
    dest: "{{ crewship_cfg.home }}/.omp/agent/models.yml"
    dir_mode: "0700"
    mode: "0600"
    first_write: false
  # marksman costs each omp session about 90 MB for markdown diagnostics that
  # agent work never uses.
  - src: config/omp-lsp.json
    dest: "{{ crewship_cfg.home }}/.omp/agent/lsp.json"
    dir_mode: "0700"
    mode: "0600"
    first_write: true
  # See docs/omp.md#no-mistakes-pipeline-agent for agent selection.
  - src: config/no-mistakes.yaml
    dest: "{{ crewship_cfg.home }}/.no-mistakes/config.yaml"
    dir_mode: "0700"
    mode: "0600"
    first_write: true
  - src: config/acpx.json
    dest: "{{ crewship_acpx_config }}"
    dir_mode: "0700"
    mode: "0600"
    first_write: true

# Firstmate reads these from its own checkout and already gitignores them, so
# the clone stays clean and no .gitignore is edited.
crewship_firstmate_config_names:
  - crew-harness
  - secondmate-harness
  - crew-dispatch.json
  - backend
  # 1000000 estimated tokens: no practical cap on the startup prompt memory.
  - startup-memory-budget
  # Fresh spawns are refused while host MemAvailable is under this many MB
  # (bin/fm-spawn-memory-floor-lib.sh). Ten live lanes at 5-8 GB each filled
  # 24 GB RAM + 52 GB swap on the source host on 2026-09-17.
  - spawn-memory-floor-mb
  # omp overlay Firstmate layers onto crewmate and scout launches (never
  # secondmates): the fable-5.1 advisor at low thinking. syncBacklog "off"
  # overrides the global "1", so crews never wait on it; turns that land during
  # a review batch into the next call, and it interrupts at most once per 10
  # turns. omp has no every-N-turns setting.
  - omp-crew-overlay.yml
  # "off": crews and scouts use the flat layout, not one Herdr workspace per task.
  - herdr-presentation-spaces
  # A presence flag (empty file): the watcher may also defer a bare turn end
  # on pane-churn evidence.
  - turnend-churn-absorb
crewship_firstmate_config_first_write: false

# --- Docker -----------------------------------------------------------------
# Ubuntu's docker.io + docker-compose-v2 only; never mixed with Docker CE.
# Docker group membership equals passwordless root on the host, so it is an
# explicit opt-in list, never the Crewship account by default.
crewship_docker_group_users: []
# Engine settings merged into /etc/docker/daemon.json (existing keys are kept,
# nothing is removed). `init` puts docker-init as PID 1 in every container so
# orphaned children are reaped when an image uses a bare process as PID 1.
# `live-restore` keeps containers running across dockerd restarts.
# The merge itself happens inside one Jinja expression in tasks/docker.yml so
# the booleans stay booleans in the written JSON.
crewship_docker_daemon_json: /etc/docker/daemon.json

# --- Fleet guards -----------------------------------------------------------
# Sources live under fleet/. Installed files stay under the account's home.
# Disabling a profile stops managing its files and units without removing them.
crewship_fleet_sources: "{{ crewship_repo }}/fleet"
crewship_fleet_dir: "{{ crewship_cfg.home }}/oss-fleet"
crewship_fleet_doctor_dir: "{{ crewship_fleet_dir }}/doctor"

# --- Fleet browsers (profiles.fleet_browsers, or fleet_guards) ---------------
crewship_fleet_browsers_enabled: "{{ (crewship_cfg.profiles.fleet_guards | bool) or (crewship_cfg.profiles.fleet_browsers | bool) }}"
crewship_fleet_browsers_dir: "{{ crewship_fleet_dir }}/browsers"
# The latest Obscura release for this platform, with the SHA-256 GitHub
# publishes for the asset; each release extracts into its own directory.
crewship_browser_obscura: "{{ crewship_latest.obscura.assets[crewship_platform] }}"
crewship_browser_obscura_dir: "{{ crewship_fleet_browsers_dir }}/obscura-{{ crewship_latest.obscura.version }}"
# The vnc tier's own packages, so it works without the desktop profile:
# /usr/bin/tigervncserver, websockify, the noVNC web root /usr/share/novnc, and
# xfwm4, the window manager the tier's xstartup runs so Chrome maximizes and
# its pop-ups can be moved and closed.
crewship_fleet_browser_vnc_packages:
  - tigervnc-standalone-server
  - websockify
  - novnc
  - xfwm4
crewship_fleet_browser_units:
  - fleet-browser-obscura.service
  - fleet-browser-chrome.service
  - fleet-browser-vnc.service
  - fleet-browser-sync.service
  - fleet-browser-sync.timer
  - fleet-browser-gc.service
  - fleet-browser-gc.timer
crewship_fleet_browser_enabled_units:
  - { unit: fleet-browser-obscura.service, wants: default.target.wants }
  - { unit: fleet-browser-sync.timer, wants: timers.target.wants }
  - { unit: fleet-browser-gc.timer, wants: timers.target.wants }

# Storage guard (fleet/doctor/storage-guard.sh, every 5 min). Use% of the
# filesystems holding /, /var/log, the home and Docker's data root: WARN alerts
# once per episode, re-armed below WARN - hysteresis; CRIT prunes build cache,
# dangling images and unused images created more than image_age_hours ago
# (creation time, not last use), then alerts at most once per repeat_min. A
# fill rate projecting full within fill_horizon_hours alerts even below WARN.
crewship_storage_guard_warn_pct: 85
crewship_storage_guard_crit_pct: 92
crewship_storage_guard_hysteresis_pct: 3
crewship_storage_guard_image_age_hours: 168
crewship_storage_guard_fill_horizon_hours: 6
crewship_storage_guard_repeat_min: 30

crewship_fleet_guard_units:
  - crewship-docker-guard.service
  - crewship-docker-guard.timer
  - crewship-dev-server-reaper.service
  - crewship-dev-server-reaper.timer
  - crewship-storage-guard.service
  - crewship-storage-guard.timer
  - crewship-devtools-bridge-reaper.service
  - crewship-devtools-bridge-reaper.timer
crewship_fleet_guard_enabled_units:
  - { unit: crewship-docker-guard.timer, wants: timers.target.wants }
  - { unit: crewship-dev-server-reaper.timer, wants: timers.target.wants }
  - { unit: crewship-storage-guard.timer, wants: timers.target.wants }
  - { unit: crewship-devtools-bridge-reaper.timer, wants: timers.target.wants }
# Only selected units reach rendering, retirement, enablement and handlers.
crewship_fleet_units: "{{ crewship_fleet_guard_units if (crewship_cfg.profiles.fleet_guards | bool) else [] }}"
crewship_fleet_enabled_units: "{{ crewship_fleet_guard_enabled_units if (crewship_cfg.profiles.fleet_guards | bool) else [] }}"
# Older releases installed the same units as flotilla-*; apply stops and
# deletes any that remain (tasks/fleet_units.yml).
crewship_fleet_retired_units: "{{ crewship_fleet_units | map('regex_replace', '^crewship-', 'flotilla-') | list }}"

# --- Tailscale (install only; login, ACLs, SSH and UFW stay manual) ---------
crewship_tailscale_track: stable
crewship_tailscale_suite: "{{ ansible_distribution_release }}"
crewship_tailscale_keyring: /usr/share/keyrings/tailscale-archive-keyring.gpg
# Optional exact apt version pin, e.g. "1.102.3". Empty installs the current
# package from the stable track.
crewship_tailscale_version: ""

# --- Koncreet (install only; the operator runs it by hand) ------------------
# The latest jimididit/koncreet release, verified against the SHA-256 GitHub
# publishes for the asset, with Crewship's Ubuntu 26.04 patch layered on.
# Root runs it, so the release and its configuration are root-owned, never in
# the account's home. docs/security.md has the manual run. Optional: it is
# resolved only when start_services is true (never in the container image), and
# a failed lookup, digest, or download skips it with a warning.
crewship_koncreet: "{{ crewship_latest.koncreet.assets[crewship_platform] }}"
crewship_koncreet_patch: "{{ crewship_repo }}/patches/koncreet/ubuntu-26.04.patch"
crewship_koncreet_prefix: /usr/local/lib/crewship/koncreet
crewship_koncreet_config: /etc/koncreet.conf

# --- Chrome -----------------------------------------------------------------
# auto  -> install only when the desktop profile is enabled
# true  -> always install (headless AXI bridge use without a desktop)
# false -> never install
crewship_chrome_install: auto
crewship_chrome_package: google-chrome-stable
crewship_chrome_keyring: /usr/share/keyrings/google-chrome.asc
crewship_chrome_key_url: https://dl.google.com/linux/linux_signing_key.pub
crewship_chrome_repo_uri: https://dl.google.com/linux/chrome/deb/
# Optional exact apt version pin. Empty tracks the repository, which is the
# only workable default: Google removes superseded Chrome versions from the
# pool, so a hard pin stops resolving after the next release.
crewship_chrome_version: ""

# --- Desktop ----------------------------------------------------------------
# VNC requires an operator-created credential plus loopback/SSH transport.
# noVNC binds 127.0.0.1 only and still prompts for the RFB password.
crewship_vnc_password_file: "{{ crewship_vnc_dir }}/passwd"
crewship_vnc_rfb_port: "{{ 5900 + (crewship_cfg.desktop.display | int) }}"
crewship_novnc_web_root: /usr/share/novnc/
crewship_desktop_strict_symlink_check: true
